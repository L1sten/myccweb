<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta http-equiv="Content-Security-Policy" content="default-src 'self' data: blob:; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'none'; form-action 'none'; frame-src 'none'; media-src 'none'; object-src 'none'; base-uri 'self'">
<meta http-equiv="Permissions-Policy" content="microphone=(), camera=(), geolocation=()">
<title>数小潮 · 会展中心四角色智能体</title>
<script src="../auth.js"></script>
<style>
*,*::before,*::after{box-sizing:border-box}
:root{
  --primary:#2878ff;--primary-deep:#1459d9;--primary-soft:#edf4ff;--primary-rgb:40,120,255;
  --ink:#182230;--text:#344054;--muted:#667085;--subtle:#98a2b3;
  --line:#e4eaf2;--line-soft:#eff3f8;--surface:#fff;--app-bg:#f3f7fc;
  --success:#079455;--warning:#f79009;--danger:#d92d20;
  --shadow-card:0 8px 24px rgba(24,34,48,.07),0 1px 2px rgba(24,34,48,.04);
  --shadow-panel:0 24px 64px rgba(24,34,48,.18);
  --ease:cubic-bezier(.2,.8,.2,1);
}
html,body{margin:0;height:100%;overflow:hidden;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;color:var(--text);background:#eaf0f7}
button,input,textarea,select{font:inherit}
button{border:0;background:none;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,textarea:focus-visible,a:focus-visible{outline:3px solid rgba(var(--primary-rgb),.22);outline-offset:2px}
.review-shell{height:100vh;display:flex;flex-direction:column;overflow:hidden}
.review-toolbar{height:56px;flex:0 0 56px;display:flex;align-items:center;gap:16px;padding:6px 16px;border-bottom:1px solid #dce3ec;background:#f8fafc;color:#475467;box-shadow:0 5px 18px rgba(24,34,48,.05);z-index:420}
.review-meta{min-width:0;display:flex;align-items:baseline;gap:9px;white-space:nowrap}.review-meta strong{color:#182230;font-size:13px}.review-meta span{color:#7a8798;font-size:11px}
.review-role-tabs{display:flex;align-items:center;gap:4px;padding:3px;border:1px solid #dfe5ed;border-radius:12px;background:#fff}
.review-role-btn{min-width:66px;height:44px;padding:0 12px;border-radius:9px;color:#667085;font-size:12px;font-weight:800;transition:.18s var(--ease)}
.review-role-btn:hover{background:#f1f4f8;color:#344054}.review-role-btn.active{background:var(--primary);color:#fff;box-shadow:0 5px 12px rgba(var(--primary-rgb),.2)}
.app-split{display:flex;flex:1;min-height:0;overflow:hidden}
.page-container{flex:1;min-width:0;position:relative;overflow:hidden;background:radial-gradient(circle at 18% 12%,rgba(40,120,255,.1),transparent 28%),linear-gradient(145deg,#f8fbff 0%,#e9eff6 100%)}
.prototype-stage{height:100%;display:grid;place-items:center;padding:16px}
.phone-shell{position:relative;width:min(430px,calc(100% - 16px));height:min(902px,calc(100% - 32px));min-height:640px;padding:9px;border-radius:38px;background:#111c2d;box-shadow:0 34px 80px rgba(25,39,59,.28),0 0 0 1px rgba(255,255,255,.32) inset;transition:box-shadow .25s var(--ease)}
.phone-shell::before{content:"";position:absolute;top:12px;left:50%;z-index:20;width:92px;height:5px;border-radius:99px;background:rgba(255,255,255,.18);transform:translateX(-50%)}
.phone-screen{position:relative;width:100%;height:100%;overflow:hidden;border-radius:30px;background:var(--app-bg);container-type:inline-size}
.app-header{position:absolute;inset:0 0 auto;height:64px;z-index:30;display:flex;align-items:center;gap:10px;padding:10px 12px 6px;background:rgba(255,255,255,.92);border-bottom:1px solid rgba(228,234,242,.9);backdrop-filter:blur(18px)}
.brand-mark{display:flex;align-items:center;gap:7px;min-width:0;flex:1}
.brand-avatar{width:36px;height:36px;object-fit:contain;filter:drop-shadow(0 4px 7px rgba(var(--primary-rgb),.18))}
.brand-copy{min-width:0}
.brand-title{display:block;font-size:16px;line-height:19px;font-weight:850;letter-spacing:-.4px;color:var(--ink)}
.brand-subtitle{display:block;margin-top:1px;font-size:10px;line-height:13px;color:var(--muted);white-space:nowrap}
.header-btn{height:44px;min-width:44px;border:1px solid var(--line);background:#fff;display:inline-flex;align-items:center;justify-content:center;gap:5px;transition:.18s var(--ease)}
.header-btn{width:44px;border-radius:13px;color:#526175}
.header-btn svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.header-btn:active{transform:scale(.96);background:var(--primary-soft)}
.app-main{position:absolute;inset:64px 0 138px;overflow-y:auto;padding:12px 12px 30px;scroll-behavior:smooth;-webkit-overflow-scrolling:touch;overscroll-behavior:contain}
.app-main::-webkit-scrollbar,.quick-strip::-webkit-scrollbar{width:0;height:0}
.hero{position:relative;min-height:138px;overflow:hidden;padding:18px 114px 16px 17px;border-radius:22px;color:#fff;background:linear-gradient(135deg,var(--primary-deep),var(--primary) 72%,#65a1ff);box-shadow:0 14px 32px rgba(var(--primary-rgb),.22);transition:background .28s var(--ease)}
.hero::before,.hero::after{content:"";position:absolute;border-radius:50%;border:1px solid rgba(255,255,255,.15)}
.hero::before{width:170px;height:170px;right:-70px;top:-104px}
.hero::after{width:92px;height:92px;right:54px;bottom:-68px}
.hero-kicker{position:relative;z-index:2;display:inline-flex;align-items:center;height:24px;padding:0 9px;border-radius:99px;background:rgba(255,255,255,.16);border:1px solid rgba(255,255,255,.22);font-size:11px;font-weight:750}
.hero h1{position:relative;z-index:2;margin:10px 0 4px;font-size:22px;line-height:28px;letter-spacing:-.7px;text-wrap:balance}
.hero p{position:relative;z-index:2;margin:0;font-size:12px;line-height:19px;color:rgba(255,255,255,.82);text-wrap:pretty}
.hero-mascot{position:absolute;right:4px;bottom:-3px;width:121px;height:auto;filter:drop-shadow(0 12px 12px rgba(12,48,112,.28));z-index:1;transform:rotate(-2deg)}
.section{margin-top:14px}
.section-head{display:flex;align-items:center;justify-content:space-between;min-height:28px;margin-bottom:8px;padding:0 2px}
.section-title{font-size:14px;font-weight:850;color:var(--ink);letter-spacing:-.2px}
.section-note{font-size:10px;color:var(--subtle)}
.feature-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;padding:12px 8px 10px;border:1px solid rgba(224,231,240,.92);border-radius:18px;background:rgba(255,255,255,.92);box-shadow:var(--shadow-card)}
.feature-item{position:relative;min-height:80px;padding:6px 2px;border-radius:13px;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;gap:6px;color:#354258;transition:background .18s var(--ease),transform .18s var(--ease),color .18s var(--ease)}
.feature-item:active,.feature-item.active{background:var(--primary-soft);color:var(--primary);transform:translateY(1px)}
.feature-icon{position:relative;width:48px;height:48px;display:grid;place-items:center}
.feature-icon::after{content:"";position:absolute;inset:7px;border-radius:13px;background:rgba(var(--primary-rgb),.09);transform:rotate(8deg);z-index:0}
.feature-icon img{position:relative;z-index:1;width:48px;height:48px;object-fit:contain;filter:saturate(.92)}
.feature-name{font-size:11px;line-height:15px;font-weight:760;text-align:center;text-wrap:balance}
.question-card{padding:0 2px;border:0;border-radius:0;background:transparent;box-shadow:none}
.question-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.question-label{display:flex;align-items:center;gap:8px;font-size:12px;line-height:18px;font-weight:850;letter-spacing:.5px;color:var(--primary)}
.question-label::before,.question-label::after{content:"";height:1px;background:linear-gradient(90deg,transparent,rgba(var(--primary-rgb),.45))}
.question-label::before{width:28px}.question-label::after{width:40px;transform:rotate(180deg)}
.spark{display:none}
.refresh-btn{height:44px;padding:0 11px;display:inline-flex;align-items:center;gap:4px;border:1px solid rgba(var(--primary-rgb),.52);border-radius:999px;background:rgba(var(--primary-rgb),.05);color:var(--primary);font-size:11px;font-weight:800}
.refresh-btn svg{width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:1.8}
.question-list{display:flex;flex-direction:column;align-items:flex-start;gap:6px}
.question-item{width:fit-content;max-width:100%;min-height:44px;padding:7px 16px 7px 11px;border-radius:22px;background:rgba(255,255,255,.9);border:1.5px solid rgba(255,255,255,.72);box-shadow:0 2px 5px rgba(var(--primary-rgb),.07);display:flex;align-items:center;gap:10px;text-align:left;font-size:14px;line-height:19px;color:#1a2433;text-wrap:pretty;transition:.18s var(--ease);backdrop-filter:blur(10px)}
.question-item::before{content:"#";width:22px;height:22px;flex:0 0 22px;border-radius:50%;display:grid;place-items:center;background:rgba(var(--primary-rgb),.12);border:1px solid rgba(255,255,255,.82);color:var(--primary);font-size:14px;line-height:1;font-weight:700}
.question-item:active{border-color:rgba(var(--primary-rgb),.55);background:#fff;color:var(--primary);transform:translateY(1px)}
.chat-section .section-head{display:none}
.chat-stream{display:flex;flex-direction:column;gap:16px}
.message-row{display:flex;align-items:flex-start;gap:7px;animation:msg-in .24s var(--ease)}
.message-row.user{justify-content:flex-end}
.msg-avatar{display:none}
.msg-avatar img{width:27px;height:27px;object-fit:contain}
.message-wrap{max-width:100%;min-width:0}
.message-row:not(.user) .message-wrap{width:100%}
.message-row.user .message-wrap{max-width:86%;display:flex;flex-direction:column;align-items:flex-end}
.message-bubble{padding:14px 16px;border:1px solid rgba(255,255,255,.8);border-radius:8px 18px 18px 18px;background:rgba(255,255,255,.86);box-shadow:0 4px 12px rgba(33,129,255,.05);font-size:14px;line-height:24px;color:#21324d;overflow-wrap:anywhere;text-wrap:pretty;backdrop-filter:blur(12px)}
.message-row.user .message-bubble{padding:10px 14px;border:0;border-radius:18px 8px 18px 18px;background:linear-gradient(135deg,var(--primary),var(--primary-deep));color:#fff;box-shadow:0 8px 18px rgba(var(--primary-rgb),.16);font-size:14px;line-height:20px}
.message-time{display:block;margin-top:5px;color:#8a97aa;font-size:9px;line-height:13px;text-align:right}
.message-bubble p{margin:0 0 7px}
.message-bubble p:last-child{margin-bottom:0}
.message-bubble strong{color:var(--ink)}
.message-bubble ul{margin:7px 0 0;padding-left:17px}
.message-bubble li+li{margin-top:4px}
.thinking{display:flex;align-items:center;gap:4px;color:var(--muted)}
.thinking i{width:5px;height:5px;border-radius:50%;background:var(--primary);animation:thinking 1s ease-in-out infinite}
.thinking i:nth-child(2){animation-delay:.13s}.thinking i:nth-child(3){animation-delay:.26s}
.message-actions{display:flex;align-items:center;justify-content:flex-end;gap:2px;margin-top:2px}
.message-action{width:44px;height:44px;display:grid;place-items:center;border-radius:10px;color:#8b98a9;transition:.16s var(--ease)}
.message-action svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:1.7}
.message-action.active{color:var(--primary);background:var(--primary-soft)}
.recommend-block{margin-top:9px;padding-top:8px;border-top:1px solid var(--line-soft)}
.recommend-group+.recommend-group{margin-top:9px}
.recommend-label{display:block;margin-bottom:5px;color:var(--muted);font-size:10px;font-weight:800}
.company-tags{display:flex;flex-wrap:wrap;gap:5px}
.company-tag{padding:4px 7px;border-radius:7px;background:var(--primary-soft);color:var(--primary);font-size:10px;font-weight:720}
.inline-btn{min-height:44px;margin-top:7px;padding:0 10px;border:1px solid rgba(var(--primary-rgb),.24);border-radius:10px;color:var(--primary);font-size:11px;font-weight:800}
.composer{position:absolute;z-index:25;inset:auto 0 0;height:138px;padding:4px 10px 7px;background:rgba(236,246,255,.94);border:1px solid rgba(255,255,255,.58);border-bottom:0;border-radius:15px 15px 0 0;box-shadow:0 -10px 28px rgba(33,129,255,.07);backdrop-filter:blur(20px)}
.quick-strip{height:48px;display:flex;align-items:center;gap:6px;overflow-x:auto;overscroll-behavior-x:contain}
.quick-btn{position:relative;flex:0 0 auto;height:44px;padding:0;border:0;background:transparent;color:#344054;font-size:12px;font-weight:500;white-space:nowrap;display:flex;align-items:center;transition:.16s var(--ease)}
.quick-btn-visual{height:27px;padding:0 10px;border:1px solid rgba(24,34,48,.08);border-radius:6px;background:#fff;box-shadow:0 6px 12px rgba(15,23,42,.04);display:flex;align-items:center;transition:.16s var(--ease)}
.quick-btn:active .quick-btn-visual{border-color:rgba(var(--primary-rgb),.28);background:var(--primary-soft);color:var(--primary);transform:scale(.98)}
.input-row{height:50px;display:flex;align-items:center;gap:7px}
.input-shell{height:44px;min-width:0;flex:1;display:flex;align-items:center;padding:0 4px 0 13px;border:1.5px solid rgba(255,255,255,.78);border-radius:22px;background:rgba(255,255,255,.95);box-shadow:0 4px 12px rgba(33,129,255,.12),0 1px 2px rgba(33,129,255,.06);transition:.18s var(--ease)}
.input-shell:focus-within{border-color:rgba(var(--primary-rgb),.38);box-shadow:0 5px 15px rgba(var(--primary-rgb),.14),0 0 0 3px rgba(var(--primary-rgb),.07);background:#fff}
.message-input{min-width:0;flex:1;border:0;outline:0;background:transparent;color:var(--ink);font-size:14px}
.message-input::placeholder{color:#a1abba}
.voice-btn,.send-btn{width:44px;height:44px;display:grid;place-items:center;border-radius:12px;flex:0 0 auto;transition:.18s var(--ease)}
.voice-btn{color:#667085}
.send-btn{background:var(--primary);color:#fff;box-shadow:0 8px 16px rgba(var(--primary-rgb),.21)}
.voice-btn svg,.send-btn svg{width:19px;height:19px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.voice-btn.recording{background:#fff0ee;color:var(--danger);animation:pulse 1.1s infinite}
.send-btn:active{transform:scale(.96)}
.disclaimer{text-align:center;color:rgba(var(--primary-rgb),.66);font-size:10px;line-height:13px;letter-spacing:.04em}
.settings-menu,.language-menu{position:absolute;z-index:80;top:60px;right:10px;width:210px;padding:8px;border:1px solid var(--line);border-radius:16px;background:rgba(255,255,255,.98);box-shadow:var(--shadow-panel);opacity:0;visibility:hidden;transform:translateY(-6px);transition:.18s var(--ease)}
.settings-menu.show,.language-menu.show{opacity:1;visibility:visible;transform:translateY(0)}
.menu-title{padding:6px 8px 5px;color:var(--subtle);font-size:10px;font-weight:800;letter-spacing:.4px}
.menu-item{width:100%;min-height:44px;padding:8px;border-radius:11px;display:flex;align-items:center;gap:9px;text-align:left;font-size:12px;font-weight:720;color:#475467}
.menu-item:hover,.menu-item.active{background:var(--primary-soft);color:var(--primary)}
.menu-spacer{height:1px;margin:5px 7px;background:var(--line-soft)}
.switch{width:34px;height:20px;margin-left:auto;padding:2px;border-radius:99px;background:#cbd3df;transition:.18s}
.switch::after{content:"";display:block;width:16px;height:16px;border-radius:50%;background:#fff;box-shadow:0 2px 5px rgba(0,0,0,.16);transition:.18s}
.switch.on{background:var(--primary)}.switch.on::after{transform:translateX(14px)}
.scrim{position:absolute;inset:0;z-index:60;background:rgba(13,24,39,.42);opacity:0;visibility:hidden;transition:.2s var(--ease);backdrop-filter:blur(2px)}
.scrim.show{opacity:1;visibility:visible}
.sheet{position:absolute;z-index:70;inset:auto 0 0;max-height:82%;overflow:auto;padding:10px 16px calc(18px + env(safe-area-inset-bottom));border-radius:24px 24px 0 0;background:#fff;box-shadow:0 -22px 52px rgba(17,30,49,.18);transform:translateY(102%);transition:.25s var(--ease)}
.sheet.show{transform:translateY(0)}
.sheet-handle{width:38px;height:4px;margin:0 auto 13px;border-radius:99px;background:#d7dee8}
.sheet-head{display:flex;align-items:flex-start;gap:10px;margin-bottom:12px}
.sheet-head-copy{flex:1;min-width:0}.sheet-head h2{margin:0;color:var(--ink);font-size:18px;line-height:25px}.sheet-head p{margin:3px 0 0;color:var(--muted);font-size:11px;line-height:17px}
.close-btn{width:44px;height:44px;margin:-8px -8px 0 0;border-radius:13px;display:grid;place-items:center;color:#68768a;font-size:22px}
.nav-grid{display:grid;grid-template-columns:1fr 1fr;gap:9px}
.nav-option{min-height:72px;padding:10px;border:1px solid var(--line);border-radius:14px;background:#f9fafc;text-align:left;transition:.18s var(--ease)}
.nav-option strong{display:block;color:var(--ink);font-size:13px}.nav-option span{display:block;margin-top:4px;color:var(--muted);font-size:10px;line-height:15px}.nav-option:active{background:var(--primary-soft);border-color:rgba(var(--primary-rgb),.3)}
.gap-card{padding:13px;border:1px solid #f7d08c;border-radius:14px;background:#fffaf0}
.gap-state{display:inline-flex;align-items:center;height:24px;padding:0 8px;border-radius:7px;background:#ffefd2;color:#b54708;font-size:10px;font-weight:850}
.gap-card h3{margin:9px 0 4px;color:var(--ink);font-size:14px}.gap-card p,.gap-card li{font-size:11px;line-height:18px;color:#59677b}.gap-card p{margin:0}.gap-card ul{margin:7px 0 0;padding-left:18px}
.form-field{margin-top:12px}.form-label{display:block;margin-bottom:6px;color:var(--ink);font-size:12px;font-weight:800}.required{color:var(--danger)}
.text-field,.text-area{width:100%;border:1px solid var(--line);border-radius:12px;background:#f8fafc;color:var(--ink);font-size:12px;outline:0}.text-field{height:44px;padding:0 12px}.text-area{min-height:78px;padding:10px 12px;resize:none}.text-field:focus,.text-area:focus{border-color:rgba(var(--primary-rgb),.48);background:#fff;box-shadow:0 0 0 3px rgba(var(--primary-rgb),.08)}
.choice-row{display:flex;flex-wrap:wrap;gap:7px}.choice{min-height:44px;padding:0 12px;border:1px solid var(--line);border-radius:10px;background:#f8fafc;color:#59677b;font-size:11px;font-weight:750}.choice.active{border-color:rgba(var(--primary-rgb),.34);background:var(--primary-soft);color:var(--primary)}
.form-error{min-height:18px;margin-top:8px;color:var(--danger);font-size:11px;line-height:18px}
.primary-btn{width:100%;height:46px;margin-top:6px;border-radius:13px;background:var(--primary);color:#fff;font-size:13px;font-weight:850;box-shadow:0 9px 18px rgba(var(--primary-rgb),.2)}
.internal-page{position:absolute;z-index:90;inset:0;background:#f4f7fb;transform:translateX(102%);transition:.26s var(--ease);overflow:hidden}
.internal-page.show{transform:translateX(0)}
.internal-head{height:62px;display:flex;align-items:center;gap:8px;padding:9px 12px;background:#fff;border-bottom:1px solid var(--line)}
.back-btn{width:44px;height:44px;border-radius:13px;display:grid;place-items:center;color:#526175}.back-btn svg{width:21px;height:21px;stroke:currentColor;fill:none;stroke-width:1.8}.internal-head h2{margin:0;color:var(--ink);font-size:16px}.internal-head span{display:block;margin-top:2px;color:var(--muted);font-size:10px}
.create-body{height:calc(100% - 62px);overflow:auto;padding:14px}.create-hero{position:relative;overflow:hidden;padding:18px 94px 18px 16px;border-radius:18px;background:linear-gradient(135deg,#4634d6,#725bff);color:#fff}.create-hero h3{margin:0;font-size:20px}.create-hero p{margin:6px 0 0;font-size:11px;line-height:18px;color:rgba(255,255,255,.8)}.create-hero img{position:absolute;right:-5px;bottom:-7px;width:102px;filter:drop-shadow(0 12px 18px rgba(20,14,92,.28))}
.create-list{display:flex;flex-direction:column;gap:9px;margin-top:12px}.create-item{min-height:72px;padding:10px 11px;border:1px solid var(--line);border-radius:15px;background:#fff;box-shadow:0 4px 16px rgba(30,43,62,.05);display:flex;align-items:center;gap:11px;text-align:left}.create-item img{width:48px;height:48px;object-fit:contain}.create-item div{min-width:0;flex:1}.create-item strong{display:block;color:var(--ink);font-size:13px}.create-item span{display:block;margin-top:4px;color:var(--muted);font-size:10px;line-height:15px}.create-arrow{color:#a6afbc;font-size:18px}
.dialog{position:absolute;z-index:75;left:18px;right:18px;top:50%;padding:18px;border-radius:18px;background:#fff;box-shadow:var(--shadow-panel);opacity:0;visibility:hidden;transform:translateY(-46%) scale(.96);transition:.2s var(--ease)}

---

## 1. 产品概述

### 1.1 背景

现有会展智能体已形成普通用户与媒体风格的移动端页面示例，但不同角色的功能入口仍存在混用、缺失和反馈不完整的问题。客户期望系统根据用户角色展示不同功能组合，并统一保留智能问答、推荐问题、语音入口和多语言入口等公共能力。

### 1.2 产品目标

- 为普通用户、展商、客商、媒体提供角色专属功能首页。
- 保证不同角色仅看到本角色授权功能，避免跨角色功能泄漏。
- 统一上方大图标区和输入框上方快捷入口区的展示规则。
- 让每个功能入口点击后获得明确反馈，包括对话回复、推荐列表、功能页面、业务弹窗或业务化不可用提示。
- 正式物料不足时不生成未经确认的业务内容；缺失项、补充要求和内部判断仅在 PRD 与缺口清单中展示，不进入用户侧系统界面。

### 1.3 用户角色

- **普通用户**：以了解展会、规划行程、获取现场服务和参与互动为主要目标。
- **展商**：以产业对接、供采合作、商机匹配、参展服务和传播推广为主要目标。
- **客商**：以采购选品、查找展商、产业对接和现场服务为主要目标。
- **媒体**：以获取官方素材、现场素材、活动信息和智能内容创作为主要目标。

### 1.4 使用场景

- 用户进入智能体首页后，系统根据已识别角色加载对应首页。
- 用户点击上方角色专属功能，查看对话结果、推荐列表或进入对应业务能力。
- 用户点击输入框上方的快捷入口，快速获取现场服务、权益、问卷、亮码等能力。
- 用户通过推荐问题或自主输入发起问答，并查看生成结果。

### 1.5 本期范围

- 四角色首页及功能可见性。
- 36 个角色入口实例（对应 23 个不同功能名）的展示、排序和点击反馈。
- 推荐问题、换一批、文本输入、对话消息、语音入口、多语言入口等公共壳层。
- 已有功能反馈的确定性演示，以及缺失物料对应的 toast、空状态或异常提示。

### 1.6 非本期范围

- 正式账号登录、角色识别和鉴权系统建设。
- 实时 AI 服务、真实语音识别、地图导航和多语言翻译。
- 权益领取、问卷提交、亮码、传播需求提交等正式业务写入。
- 未经客户确认的推荐数据、规则、权益内容和第三方业务页面。

### 1.7 关键约束与待确认问题

- 正式环境如何取得用户角色、角色优先级及无角色时的处理方式待确认。
- 客商与媒体的正式角色定义、命名和归属关系待确认。
- 权益、打卡、回访、亮码、供采、公共素材库等业务物料待客户补充。
- 智能推荐类功能的正式数据范围、排序、换一批规则和刷新频率待确认。
- 已有 AI 回复仅代表现网实测样例，正式文案与数据口径需业务复核。

## 2. 全局交互规则

### 2.1 角色与功能可见性

角色字段：

- **展示规则**：页面一次只展示一个角色版本。评审环境的角色切换器位于业务系统外部，并明确标注为评审工具；业务系统内部不展示角色切换按钮、物料状态或调试信息。
- **交互规则**：通过系统外评审工具切换角色后，刷新角色文案、上方功能、快捷入口、推荐问题和主题风格；已展开的弹窗、菜单和临时消息同时关闭。
- **数据规则**：角色功能以第 3 章矩阵为准；不同角色的功能集合互相隔离，不因历史浏览记录增加其他角色入口。
- **权限规则**：无权限功能采用隐藏方式，不以置灰方式向用户暴露其他角色能力。

### 2.2 页面结构

业务系统从上至下包含：助手信息区、角色功能区、推荐问题区、对话消息区、输入框上方快捷入口区、消息输入区和公共声明区。评审角色切换器位于业务系统之外，不计入正式页面结构。

上方功能入口：

- **展示规则**：采用图标与文字组合，按角色矩阵中的序号排列；入口数量较多时自动分行，功能名称完整可读。
- **交互规则**：点击后进入对应反馈流程；点击过程中入口显示激活状态，回复生成期间显示加载状态。
- **数据规则**：仅展示矩阵中标记为“上方图标区”的功能，不涉及筛选和排序。

快捷入口：

- **展示规则**：位于消息输入框上方，按角色矩阵中的序号横向排列；空间不足时允许横向滚动。
- **交互规则**：点击后触发对话、菜单、弹窗、跳转或业务化不可用提示，不清空已有对话。
- **数据规则**：仅展示矩阵中标记为“输入框快捷区”的功能，不涉及筛选和排序。

### 2.3 推荐问题与换一批

推荐问题字段：

- **展示规则**：默认展示 4 条与当前角色相关的问题，问题文案完整可读。
- **交互规则**：点击问题后按用户消息发送，并显示对应对话反馈；点击“换一批”后替换全部 4 条问题。
- **数据规则**：首版使用确定性问题集合；同一批次不重复，换一批按预置批次循环展示，不涉及个性化排序。

### 2.4 消息输入与发送

消息输入字段：

- **展示规则**：默认显示引导文案；空值时发送操作不可执行。
- **交互规则**：支持输入、清空和发送；发送后显示用户消息、加载状态和系统回复。原型不将内容传输至外部服务。
- **数据规则**：首版仅对预置关键词返回确定性演示回复；未匹配内容返回“暂时没有找到相关内容，换个问题试试吧”。不涉及筛选和排序。
- **校验规则**：仅空格按空值处理；超长内容不撑破页面布局。

### 2.5 消息反馈

- 每条系统消息可显示赞、踩和语音播放操作。
- 赞、踩仅在当前页面本地切换选中状态，不提交外部数据。
- 语音播放在原型中仅演示状态变化，不调用真实语音合成。
- 推荐列表可提供“换一批”；首版按预置数据切换，不生成随机企业或活动。

### 2.6 功能反馈类型

- **对话回复**：在当前页面追加用户消息和系统回复。
- **推荐列表**：回复包含分类、条目和换一批操作。
- **内部功能页**：在原型内展示功能页并提供返回操作。
- **外部链接**：仅在地址已确认且不包含敏感鉴权信息时提供；地址缺失时显示简短 toast，地址异常时显示业务化失败提示。
- **业务弹窗**：在当前页面上方打开表单或选择面板，关闭后回到原对话状态。
- **业务不可用提示**：根据场景使用 toast、空状态或错误状态，仅说明“暂未开放”“暂无内容”“暂时无法打开”或“尚未配置地址”等用户可理解结果，不在系统内展示缺失物料、客户补充项、实测过程或内部风险说明。

### 2.7 加载、成功、失败与异常状态

- 对话回复生成期间显示“思考中”，完成后替换为正式内容。
- 页面能力打开期间显示加载状态；加载结束后进入功能页或错误状态。
- 地址未配置时显示“当前入口还没有配置跳转地址”等简短 toast；不打开缺口说明面板。
- 地址失效或外部页面异常不得表现为操作成功，应显示“暂时无法打开，请稍后再试”等业务化失败提示。
- 素材缺失、数据为空或业务规则未开放时，分别使用空状态或“暂未开放”提示；具体缺口和待确认事项仅记录在 PRD 与缺口清单。

### 2.8 公共控制项

- 设置菜单包含语音播报开关和清空对话；清空对话需二次确认。
- 语音输入在首版仅展示录音状态，不申请真实麦克风权限。
- 语言菜单展示中文、English、日本語、한국어；首版仅中文内容完整，其他语言选择后提示当前暂不支持该语言。
- 公共声明固定展示“以上内容由 AI 生成，请谨慎甄别”。

## 4. 普通用户功能需求

### 4.1 展会信息

- **展会速览**：点击后说明本届展会亮点与规模；正式亮点、规模和更新时间待客户确认。
- **展区介绍**：点击后返回主题展区及重点板块介绍；回复可继续引导用户选择具体展区。
- **活动日程**：点击后返回当前已知的举办时间和日程发布状态；日程未发布时不得生成具体活动时间。
- **首发首秀**：点击后按展区展示已知首发首秀信息，并提示可继续查询具体展区或企业。

### 4.2 推荐与导航

- **展商推荐**：按展区展示企业列表，支持换一批；正式推荐规则、企业库和兴趣标签待确认。
- **伴游导航**：先展示服务台、停车场、洗手间、交通方式等已知能力；暂未取得准确点位时提示用户以现场导视为准，路线服务不可用时显示简短 toast。点位与导航缺口仅在 PRD 和缺口清单记录。
- **一键亮码**：点击后检查亮码地址；首版地址未配置，显示“当前入口还没有配置跳转地址”toast，不在系统内展示需要客户提供的内容。

### 4.3 现场服务

- **打卡活动**：展示玩法、任务、奖品、次数和完成反馈；首版规则未开放时显示“打卡活动暂未开放，敬请期待”。
- **订餐服务**：展示现有餐饮推荐样例；预订方式、营业时间和正式联系方式待确认。
- **通用权益**：展示权益项目、领取条件、有效期和使用入口；首版无可用内容时显示“当前暂无可领取的通用权益”。

### 4.4 验收标准

- 仅展示普通用户 10 个功能，入口位置和顺序与矩阵一致。
- 展区介绍、活动日程、展商推荐、首发首秀、订餐服务 5 个已有对话功能可展示确定性回复。
- 导航与亮码对用户仅展示业务化结果，不展示物料缺口或补充要求。
- 打卡、权益等无物料功能不得出现虚构规则。

## 5. 展商功能需求

### 5.1 商务合作

- **产业对接**：展示已知产业活动样例；正式结果需包含活动名单、关键词和换一批能力。
- **供采大厅**：说明供采大厅用途；正式地址未确认时显示“供采大厅暂未开放，敬请期待”。
- **商机匹配**：展示推荐说明、企业或活动列表、关键词和换一批；首版匹配数据与规则未开放时显示简短不可用 toast。
- **首发首秀**：展示已知首发信息；申报入口、条件、截止时间和状态待补充。

### 5.2 参展与传播

- **DT奖**：展示现有奖项介绍；申报入口、评选动态和本届规则待补充。
- **参展权益**：展示展商权益、领取条件和使用入口；首版无可用内容时显示“当前暂无可领取的展商权益”。
- **智能创作**：展示 AI 海报、会议速记、AI 编辑室、AI 成片、AI 写作等能力入口。
- **传播投手**：打开两步传播需求弹窗；第一步展示企业名称、服务类型、服务明细和传播要求，必填项不完整时提示补充。第二步字段和提交结果待确认。
- **伴游导航、一键亮码**：沿用普通用户同名功能规则。

### 5.3 验收标准

- 仅展示展商 10 个功能，DT奖和参展权益位于快捷入口区。
- 智能创作可进入功能页，传播投手可打开表单并触发必填校验。
- 未确认的供采地址、商机数据和提交结果不得对外展示为已完成能力。

## 6. 客商功能需求

### 6.1 采购与对接

- **供采大厅**：沿用展商同名能力说明，正式查看与发布权限未确认时显示暂未开放 toast。
- **智能选品**：根据采购偏好展示展商和展品推荐，支持换一批；相关数据未开放时显示“智能选品功能暂未开放，敬请期待”。
- **展商搜索**：支持输入企业或展商关键词并展示匹配结果；相关数据未开放时显示“展商搜索功能暂未开放，敬请期待”。
- **产业对接**：展示商贸匹配和产业对接专场；正式名单、关键词和报名方式待补充。

### 6.2 参展服务

- **展会回访**：打开问卷；问卷未开放时显示“展会回访问卷暂未开放”。
- **参展权益**：展示客商权益；首版无可用内容时显示“当前暂无可领取的客商权益”。
- **伴游导航、订餐服务、一键亮码**：沿用普通用户同名功能规则。

### 6.3 验收标准

- 仅展示客商 9 个功能，回访、权益和订餐位于快捷入口区。
- 智能选品和展商搜索在无正式数据时显示业务化不可用 toast，不展示缺口详情。
- 不使用展商角色的权益文案替代客商权益。

## 7. 媒体功能需求

### 7.1 素材与内容生产

- **媒体手册**：提供官方图片、视频和宣传资料；素材库地址异常时显示“媒体手册暂时无法打开，请稍后再试”，不携带动态鉴权信息，不展示实测过程。
- **智能创作**：沿用展商同名功能页能力。
- **现场素材**：展示现场图片、视频和其他媒体素材；首版内容未开放时显示“现场素材暂未上线”。
- **传播热点**：展示展期热点、亮点和相关线索；首版内容未开放时显示“传播热点内容暂未更新”。

### 7.2 会展服务

- **活动日程、订餐服务**：沿用普通用户同名功能规则。
- **参展权益**：展示媒体对应权益，不使用展商权益文案代替；首版无可用内容时显示“当前暂无可领取的媒体权益”。

### 7.3 验收标准

- 仅展示媒体 7 个功能，订餐和参展权益位于快捷入口区。
- 媒体手册与现场素材明确区分官方资料和现场产生素材。
- 素材地址异常时不得跳转到错误页或泄露鉴权参数。

## 8. 异常与空状态

- **无角色**：评审环境使用普通用户版本；评审角色切换器位于系统外部，正式产品处理方式待鉴权方案确认。
- **无回复内容**：系统内显示“暂时没有找到相关内容”或对应能力的简短不可用提示；功能目标、缺失内容和补充建议仅在 PRD 与缺口清单展示。
- **推荐列表为空**：展示“暂无可展示数据”，换一批保持可用但不得循环制造虚假结果。
- **地址未配置**：显示“当前入口还没有配置跳转地址”toast，不执行跳转。
- **地址异常**：显示“暂时无法打开，请稍后再试”，不展示实测异常、内部风险或动态鉴权参数。
- **表单缺失**：保留已确认步骤；无法继续时提示服务暂未开放且当前内容未提交，不展示缺失字段和补充要求，不得模拟成功提交。
- **多语言缺失**：保留语言选项，切换后说明当前暂不支持该语言。

## 9. 整体验收标准

- 四角色共 36 个角色入口实例（23 个不同功能名），入口 ID、名称、顺序和入口位置与角色矩阵完全一致。
- 系统外评审工具可切换角色；系统内部不展示角色切换按钮、评审声明、功能物料状态或缺口说明。
- 切换角色后页面文案、主题、推荐问题和功能集合同步变化。
- 已有反馈可重复稳定演示，不依赖外部 AI、地图或业务系统。
- 所有缺失能力均可点击并获得业务化 toast、空状态或错误提示，不展示“待客户补充”、缺失物料清单、实测过程或补充建议。
- 页面不存在跨角色功能泄漏、空白点击、无说明错误、敏感鉴权参数或内部评审信息展示。
- 对话 loading、消息操作、推荐换一批、弹窗关闭、表单校验和返回操作均可正常使用。
- 页面在常见移动端尺寸下无文字截断、入口重叠或输入框遮挡。

function promotionNext(){var p=state.promotion;p.company=(document.getElementById('companyInput').value||'').trim();p.requirement=document.getElementById('requirementInput').value;if(!p.company||!p.type||!p.detail){document.getElementById('promotionError').textContent='请完整填写当前步骤必填项。';return}document.getElementById('promotionSheet').innerHTML='<div class="sheet-handle"></div><div class="sheet-head"><div class="sheet-head-copy"><h2>传播投手</h2><p>暂时无法继续</p></div><button class="close-btn" type="button" onclick="closeBusinessLayer()">×</button></div><div class="gap-card"><h3>服务暂未开放</h3><p>传播投手后续服务暂不可用，本次填写内容未提交，请稍后再试。</p></div><button class="primary-btn" type="button" onclick="closeBusinessLayer()">我知道了</button>'}
function showLayer(id){document.getElementById('scrim').classList.add('show');document.getElementById(id).classList.add('show')}
function closeBusinessLayer(event){if(event&&event.target&&event.target.id!=='scrim')return;['navSheet','promotionSheet'].forEach(function(id){document.getElementById(id).classList.remove('show')});document.getElementById('clearDialog').classList.remove('show');document.getElementById('scrim').classList.remove('show')}
function toggleSettings(){var menu=document.getElementById('settingsMenu'),open=menu.classList.contains('show');closeAllMenus();menu.classList.toggle('show',!open)}
function openLanguageMenu(){closeAllMenus();renderLanguageMenu();document.getElementById('languageMenu').classList.add('show')}
function renderLanguageMenu(){var langs=['中文','English','日本語','한국어'];document.getElementById('languageMenu').innerHTML='<div class="menu-title">选择语言</div>'+langs.map(function(lang,i){return '<button class="menu-item '+(i===0?'active':'')+'" type="button" onclick="selectLanguage(\''+lang+'\')">'+lang+'</button>'}).join('')}
function selectLanguage(lang){closeAllMenus();if(lang==='中文')toast('当前使用中文');else toast('当前暂不支持 '+lang)}
function closeAllMenus(){['settingsMenu','languageMenu'].forEach(function(id){document.getElementById(id).classList.remove('show')})}
function toggleVoicePlayback(){state.voicePlayback=!state.voicePlayback;document.getElementById('voiceSwitch').classList.toggle('on',state.voicePlayback);toast(state.voicePlayback?'已开启语音播报':'已关闭语音播报')}
function demoVoiceInput(){toast('语音输入暂未开放')}
function reactMessage(id,reaction){var msg=state.messages.filter(function(item){return item.id===id})[0];if(!msg)return;msg.reaction=msg.reaction===reaction?'':reaction;renderMessages();toast(msg.reaction?'已记录本地反馈':'已取消反馈')}
function playMessage(id){var msg=state.messages.filter(function(item){return item.id===id})[0];if(!msg)return;msg.playing=!msg.playing;renderMessages();toast(msg.playing?'正在播报':'已停止播报');if(msg.playing)setTimeout(function(){msg.playing=false;renderMessages()},1200)}
function openClearDialog(){closeAllMenus();document.getElementById('scrim').classList.add('show');document.getElementById('clearDialog').classList.add('show')}
function closeClearDialog(){document.getElementById('clearDialog').classList.remove('show');document.getElementById('scrim').classList.remove('show')}
function confirmClear(){closeClearDialog();resetMessages();renderMessages();document.getElementById('appMain').scrollTop=0;toast('对话已清空')}
function toast(text){var el=document.getElementById('toast');el.textContent=text;el.classList.add('show');clearTimeout(window.__toastTimer);window.__toastTimer=setTimeout(function(){el.classList.remove('show')},1800)}
function togglePrdPanel(){var panel=document.getElementById('prdPanel'),drag=document.getElementById('splitDrag'),btn=document.getElementById('prdToggle'),collapsed=panel.classList.toggle('collapsed');drag.style.display=collapsed?'none':'';btn.querySelector('.toggle-dot').style.background=collapsed?'#98a2b3':'#12b76a';btn.querySelector('span:last-child').textContent=collapsed?'展开 PRD':'收起 PRD'}
function downloadPrd(){var md=document.getElementById('prdMdSource').textContent.trim();var blob=new Blob([md+'\n'],{type:'text/markdown;charset=utf-8'});var url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='会展中心四角色智能体移动端PRD.md';a.click();setTimeout(function(){URL.revokeObjectURL(url)},0)}
function toggleChangelog(show){document.getElementById('changelogOverlay').classList.toggle('show',show);if(show)renderChangelog()}
function closeChangelogOnMask(event){if(event.target.id==='changelogOverlay')toggleChangelog(false)}
function renderChangelog(){var html='<table class="changelog-table"><thead><tr><th>更新时间</th><th>说明</th></tr></thead><tbody>';changelogData.forEach(function(item){html+='<tr><td>'+escapeHtml(item.time)+'</td><td>'+escapeHtml(item.desc)+'</td></tr>'});document.getElementById('changelogBody').innerHTML=html+'</tbody></table>'}
function inlineMarkdown(text){return text.replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>')}
function renderMarkdown(md){
  var lines=escapeHtml(md).split('\n'),html='',heads=[],listDepth=-1,liOpen=[],inTable=false;
  function closeTable(){if(inTable){html+='</tbody></table>';inTable=false}}
  function closeLists(toDepth){while(listDepth>=toDepth){if(liOpen[listDepth])html+='</li>';html+='</ul>';liOpen.pop();listDepth--}}
  function finishBlocks(){closeTable();closeLists(0)}
  for(var i=0;i<lines.length;i++){
    var raw=lines[i],trim=raw.trim();
    if(!trim){finishBlocks();continue}
    if(/^---+$/.test(trim)){finishBlocks();html+='<hr>';continue}
    var heading=trim.match(/^(#{1,5})\s+(.+)$/);
    if(heading){finishBlocks();var level=heading[1].length,id='prd-h-'+heads.length;heads.push({id:id,text:heading[2],level:level});html+='<h'+level+' id="'+id+'">'+inlineMarkdown(heading[2])+'</h'+level+'>';continue}
    if(/^\|.*\|$/.test(trim)){
      closeLists(0);var cells=trim.slice(1,-1).split('|').map(function(cell){return cell.trim()});var next=(lines[i+1]||'').trim();
      if(!inTable&&/^\|(?:\s*:?-+:?\s*\|)+$/.test(next)){html+='<table class="prd-table"><thead><tr>'+cells.map(function(cell){return '<th>'+inlineMarkdown(cell)+'</th>'}).join('')+'</tr></thead><tbody>';inTable=true;i++;continue}
      if(!inTable){html+='<table class="prd-table"><tbody>';inTable=true}
      html+='<tr>'+cells.map(function(cell){return '<td>'+inlineMarkdown(cell)+'</td>'}).join('')+'</tr>';continue
    }
    closeTable();var item=raw.match(/^(\s*)-\s+(.+)$/);
    if(item){var depth=Math.floor(item[1].replace(/\t/g,'  ').length/2);while(listDepth<depth){html+=listDepth<0?'<ul class="prd-list">':'<ul class="prd-nested">';listDepth++;liOpen[listDepth]=false}while(listDepth>depth)closeLists(depth+1);if(liOpen[depth])html+='</li>';html+='<li>'+inlineMarkdown(item[2]);liOpen[depth]=true;continue}
    finishBlocks();html+='<p>'+inlineMarkdown(trim)+'</p>';
  }
  finishBlocks();return {html:html,heads:heads};
}
function initPrd(){var md=document.getElementById('prdMdSource').textContent.trim(),rendered=renderMarkdown(md);document.getElementById('prdContent').innerHTML=rendered.html;document.getElementById('prdToc').innerHTML='<div class="prd-toc-title">PRD 目录</div>'+rendered.heads.filter(function(head){return head.level<=3}).map(function(head){return '<div class="prd-toc-item '+(head.level===3?'sub':'')+'" onclick="scrollPrdTo(\''+head.id+'\')">'+head.text+'</div>'}).join('')}
function scrollPrdTo(id){var container=document.getElementById('prdContent'),target=document.getElementById(id);if(!container||!target)return;container.scrollTop=Math.max(0,target.offsetTop-22)}
function initDrag(){var drag=document.getElementById('splitDrag'),panel=document.getElementById('prdPanel'),startX=0,startW=0;drag.addEventListener('mousedown',function(event){if(panel.classList.contains('collapsed'))return;event.preventDefault();startX=event.clientX;startW=panel.offsetWidth;drag.classList.add('dragging');document.body.style.cursor='col-resize';document.body.style.userSelect='none';function onMove(moveEvent){var width=startW-(moveEvent.clientX-startX),min=300,max=Math.floor(window.innerWidth*.7);panel.style.width=Math.max(min,Math.min(max,width))+'px'}function onUp(){drag.classList.remove('dragging');document.body.style.cursor='';document.body.style.userSelect='';document.removeEventListener('mousemove',onMove);document.removeEventListener('mouseup',onUp)}document.addEventListener('mousemove',onMove);document.addEventListener('mouseup',onUp)})}
document.addEventListener('click',function(event){if(!event.target.closest('.header-btn')&&!event.target.closest('.settings-menu')&&!event.target.closest('.language-menu')){document.getElementById('settingsMenu').classList.remove('show');document.getElementById('languageMenu').classList.remove('show')}});
document.addEventListener('DOMContentLoaded',function(){state.role=getInitialRole();applyTheme();resetMessages();renderAll();initPrd();initDrag()});
</script>
