  <textarea id="prdMdSource" hidden># 正能量态势感知项目 PRD

## 1. 产品概述

### 1.1 背景与目标

驾驶舱与正能量看板统一采用经过上线、播报和属地筛选的话题，避免两页话题展示与传播统计范围不一致。正能量看板顶部调整为与驾驶舱一致的六项指标，保留各指标既有业务含义。

### 1.2 用户与使用场景

供现有租户内有权查看驾驶舱、看板的用户了解本地正能量话题、传播规模及每日最高传播话题。沿用既有访问权限，不新增角色或授权范围。

### 1.3 本期范围与边界

- 调整实时正能量热点、话题热榜、正能量话题传播量、正能量热点数、话题传播走势图及全网热度趋势的参与话题范围。
- 调整看板顶部六指标的名称与排列；提供日期筛选、分类切换、图表提示、指标口径说明及需求文档阅读能力。
- 其他稿件、媒体关注、专题、地域分布等模块保持原业务边界，在演示中作为独立示意，不从新话题集合推算。
- 本期为演示原型，所有数值均为示例。登录账号、密码和会话不属于演示内容。

### 1.4 关键约束与默认假设

- 真实上线时间是归日统计的必要依据；不得以发布时间、更新时间或播报时间替代。
- 来源中的状态以查询时状态为准，不引入历史状态快照。
- 全网热度及新莓汇播报数、稿件数、央媒报道量、省媒报道量的完整公式沿用既有规则；本期不新增公式。演示采用独立示例，不能据其数值反推正式口径。
- 热榜默认按传播量降序为原型假设；正式业务排序另有既定规则时须复核，不擅自将此假设作为既有规则。

## 2. 全局规则

### 2.1 统一话题范围

| 来源列表 | 对应分类 | 纳入范围 |
|---|---|---|
| 热点播报 | 正能量热点 | 符合共同条件的话题 |
| 线索播报 | 正能量线索 | 符合共同条件的话题 |
| 央媒涉浙播报 | 央媒报道 | 仅“央媒涉浙热点”中的符合条件话题 |

三个来源取并集；本地热点列表和央媒涉浙稿库不纳入。每条话题必须同时满足：

1. 属地与租户配置的所属地区精确匹配，不自动纳入下辖区县。
2. 状态为“已上线”。
3. 播报状态为“已播报”。

同一来源的同一话题记录重复出现只计一次。不同来源或独立记录不能仅因标题相同合并。租户所属地区只读；未配置时提示配置缺失，不回退到全地区，也不展示其他地区数据。

### 2.2 日期与分类筛选

**日期范围**

- 展示规则：开始日期、结束日期，演示默认 2026-09-16 至 2026-09-22；两项均必填。
- 交互规则：有效范围应用后刷新关联指标、热榜、词云与传播走势图；两页切换保留同一有效日期范围；日期变化清空两页已选话题，恢复各自汇总趋势。开始晚于结束或日期不完整时提示修正，保留上次有效结果。
- 数据规则：以上线时间对应的北京时间自然日筛选，包含首尾日期；与属地、状态条件取交集。不涉及排序。全网热度独立使用近7日，不被全局日期范围改变。

**话题分类**

- 展示规则：两页均提供“央媒报道”“正能量热点”“正能量线索”三个选项卡，默认央媒报道，单选；不再提供微博、抖音、头条筛选。
- 交互规则：点击立即刷新当前页面词云或热榜，清空当前页面已选话题并恢复汇总趋势。两页分类与话题选择相互独立；分类切换不改变顶部指标或驾驶舱右侧汇总传播图。
- 数据规则：在统一话题范围与有效日期范围内精确匹配分类。无匹配时仅当前话题模块显示空状态；汇总统计始终包含三个分类。

**话题选择与原文**

- 默认未选中话题。点击条目非标题区域、选择按钮或词云可选择区域后，突出当前话题并在对应图表展示其趋势；同一页面同时只选中一个话题。
- 标题承担原文阅读功能：有真实原文链接时新标签打开，点击标题不同时选中话题，不弹出话题详情窗口。
- 未提供原文链接时不伪造跳转目标，标题提示“原文地址未提供”；仍可通过条目或选择按钮查看该话题趋势。
- 选中后显示“全部话题”操作，点击清空选择并恢复汇总趋势；选中与恢复均不改变顶部六指标。

### 2.3 传播统计

**每日总传播量**

- 统计该日上线、且符合统一范围的全部话题传播量之和；计算前统一单位。同一话题不会因为跨日展示重复计入其他日期。
- 区间总传播量为范围内各自然日总量之和。区间正能量热点数为范围内符合条件的去重话题数，包含三类话题，不限“正能量热点”分类。
- 缺少上线时间的话题不能归入任意一天，也不能纳入按日期筛选的指标；提示数据不完整。

**每日最高话题**

- 在同一日、同一统计集合内选取传播量最大的话题；并列时展示全部并列话题及各自传播量。
- 当存在传播量缺失时，已知合计必须标明不完整，不宣称最高话题已经确定。全部传播量缺失时显示“数据缺失”，不能显示为0。

**数值与展示**

- 数值以统一后的原始精度计算，仅在展示时转换为万或亿；数量指标按条数展示。
- 真实传播量为0属于有效值；无话题时传播总量、热点数为0，最高话题显示“无话题”。
- 负数或不可识别的传播量按无效数据处理并提示不完整，不能静默当作0。
- 日期与演示场景变化时重新计算；分类切换不触发整页统计口径变化。

### 2.4 空状态与异常状态

| 状态 | 关联话题模块与统计表现 | 操作与边界 |
|---|---|---|
| 正常 | 显示完整示例数据 | 可查询、切换分类、查看提示 |
| 全量范围无匹配话题 | 列表、词云显示暂无话题，传播量与热点数为0 | 日期、分类仍可切换；仅分类结果为空时不将全量指标置0 |
| 部分传播量缺失 | 显示已知合计并标注不完整，缺失记录显示“数据缺失” | 不确认当日最高话题 |
| 全部传播量缺失 | 传播量显示数据缺失，热点数仍可按有效话题统计 | 不绘制伪造的零值传播点 |
| 加载失败 | 相关统计显示加载失败，图表不显示成功结果 | 提供重试；失败不等同无话题 |
| 租户所属地区缺失 | 提示先配置所属地区，相关话题数据不展示 | 不扩大范围；保留页面导航与说明能力 |

演示场景选择仅位于需求文档面板工具区，主业务页不展示演示工具条。演示场景用于检查上述状态，不改变其他独立示意模块的业务口径。来源异常不得以旧结果冒充本次成功结果。

### 2.5 全局操作与文档

- 主业务页不展示演示说明横条、来源筛选说明条或英文眉题；演示标识保留于页脚与需求文档工具区。
- 页面入口提供“驾驶舱”“正能量看板”；点击切换当前页面，保持有效全局日期条件。演示不增加权限点。
- 指标说明通过提示展示，鼠标悬停可阅读，点击或键盘聚焦后按 Enter 可打开说明；说明不触发数据变化。
- 需求文档面板支持展开、折叠、调整宽度与下载。调整后不得遮挡到无法关闭；折叠后有明确的重新打开入口。
- 下载内容与面板所展示的完整需求正文一致；下载仅导出文档，不附带账号、密码或会话。
- 可用操作应有明确文字或辅助名称，选中状态可辨认；不存在数据时不保留可误点的“更多”。

## 3. 驾驶舱

### 3.1 页面结构

沿用深蓝大屏、三栏布局。保留专题与媒体报道分布、中央六指标及实时正能量热点、右侧媒体关注与话题传播走势图等区块。关联话题模块使用统一范围，其他区块保留独立业务边界。

### 3.2 顶部六指标

第一行依次为正能量话题传播量、新莓汇播报数、正能量热点数；第二行依次为正能量稿件数、央媒报道量、省媒报道量。

| 指标 | 展示与数据规则 |
|---|---|
| 正能量话题传播量 | 有效日期范围内的传播总量；按全局缺失、空值、失败规则展示 |
| 正能量热点数 | 有效日期范围内三类话题的去重数量，不受分类切换影响 |
| 新莓汇播报数 | 沿用既有口径；演示为固定示例，不由话题数推算 |
| 正能量稿件数 | 沿用既有口径；演示为固定示例，不与话题条数混同 |
| 央媒报道量 | 沿用既有口径；演示为固定示例，不由央媒话题数推算 |
| 省媒报道量 | 沿用既有口径；演示为固定示例，不由话题来源推算 |

各指标只读、无独立排序，提供口径说明。四项沿用指标的示例须有说明，避免使用户误以为随话题日期筛选重新计算。

### 3.3 实时正能量热点

- 展示规则：以词云展示话题名称，使用央媒报道、正能量热点、正能量线索切换；标题过长应能查看完整名称。数据来自当前日期、分类与统一筛选集合。
- 交互规则：词云可选择区域或选择按钮选中话题，突出选中态，并使下方全网热度图切换为该话题热度趋势；标题按全局原文规则处理，不弹出详情。选择不影响右侧总传播走势图与顶部指标。
- 数据规则：已知传播量用于表现话题相对规模；缺失时明确标识，不伪造传播量。没有话题、来源失败或属地缺失时按全局状态规则展示。

### 3.4 正能量话题传播走势图

- 展示规则：横轴按自然日升序，纵轴为传播量；展示有效范围内每天的统计，包括无话题的日期。
- 交互规则：悬停或聚焦日期节点显示日期、当日总传播量、最高话题及其传播量；并列全部展示。缺失日期提示数据不完整，不给出确定最高结论。
- 数据规则：严格使用全局每日统计，与看板未选中话题时在相同日期和场景下保持一致；不受分类及话题选择影响，不涉及其他排序。

### 3.5 全网热度趋势

- 展示规则：未选中话题时展示全量话题的独立近7日热度；选中时展示该话题的热度趋势，并显示话题名称与“全部话题”恢复入口。日期升序，指标含义始终为热度。
- 交互规则：悬停或聚焦查看该日热度；演示近7日固定截至2026-09-22，不随全局日期变化。分类切换或日期改变清空话题选择，恢复全量热度视图。
- 数据规则：全量热度参与话题使用统一来源及筛选条件，计算规则沿用既有算法。单话题热度使用该话题独立每日观测示例；缺少采样时显示缺失并断开曲线，不填0、不跨缺失点连线。任何热度均不由传播量换算。

## 4. 正能量看板

### 4.1 结构与六指标

保留白底、蓝色导航与卡片布局。日期控件左对齐、紧邻顶部业务内容，贴近线上布局；不增加看板大标题或副标题。顶部六指标与驾驶舱名称、顺序和业务口径一致：第一行为正能量话题传播量、新莓汇播报数、正能量热点数；第二行为正能量稿件数、央媒报道量、省媒报道量。两页相同有效条件下的关联指标须一致。

### 4.2 正能量话题热榜

**字段规则**

- 排名：按当前结果顺序编号，只读；不与其他分类混排。
- 话题名称：展示真实示例标题，过长可截断但提供完整阅读方式；不同记录允许同名；有原文链接时点击在新标签打开，不触发选择；缺少链接时提示原文地址未提供。
- 上线时间：展示真实上线时间的日期与时间；不以其他时间替代。缺失时明确显示未提供，不伪装为有效时间。
- 来源分类：展示央媒报道、正能量热点或正能量线索，帮助核对三个来源的纳入情况。
- 传播量：按统一单位显示；缺失值显示数据缺失，真实0显示0。上述字段均只读，不提供编辑操作。

**筛选、排序与操作**

- 使用全局日期与本模块央媒报道、正能量热点、正能量线索分类条件；来源、属地和状态条件不可在本模块绕过。
- 原型默认传播量降序，缺失值排末尾；同传播量按上线时间降序，再按来源记录保持稳定顺序。此排序为明确的演示假设。
- 默认显示前5条；超过5条时“更多”可用，点击在列表内展开完整结果，提供“收起”操作，不使用弹窗。无额外记录时不提供无效展开操作。
- 点击条目非标题区域或选择按钮选中话题，突出选中行，下方传播走势图切换为该话题趋势；点击标题仅按原文规则处理，不打开详情弹窗。
- 无匹配话题显示空状态，不显示虚假排名；缺失、失败及属地缺失遵循全局规则。

### 4.3 正能量话题传播量走势图

- 未选中话题时，使用与驾驶舱右侧图相同的每日总量与最高话题结果，日期升序；图表提示、并列最高、缺失值、无话题和失败规则一致。
- 选中话题后切换为该话题的每日传播趋势，展示话题名称；悬停或聚焦显示日期及该话题截至当日的累计传播观测量，不再显示全量最高话题。
- 单话题趋势使用有效日期范围内独立的每日累计传播观测示例，不能把按上线日归属的总传播量复制到其他日期。未采样日期显示数据缺失并断开曲线，不补0、不跨缺失点连线；真实观测值0仍显示0。
- 点击“全部话题”恢复汇总图。分类切换、日期改变后自动清空选择并恢复汇总；切换分类不改变汇总图的三分类统计范围。

### 4.4 其他模块

央媒关注、省媒关注、正能量稿件地域分布等保留原业务边界与现有独立控件，不根据新话题集合重新定义稿件或媒体指标。演示值标识为示例。

## 5. 验收标准

| 验收场景 | 预期结果 |
|---|---|
| 三类来源各有符合条件的话题 | 三类均进入统一统计，分类选项卡显示对应话题 |
| 本地热点或央媒涉浙稿库存在记录 | 不进入本次新来源集合 |
| 属地不符、未上线、未播报任一条件不符 | 记录均被排除；所属地区匹配不扩展至下辖区县 |
| 同一来源话题重复出现 | 仅统计一次；独立同标题记录仍分别统计 |
| 上线时间跨北京时间零点 | 分别归入对应自然日；首尾日期边界正确 |
| 缺少真实上线时间 | 不以其他时间替代，不进入按日统计；有明确不完整提示 |
| 多话题传播量与最高值并列 | 总量为全量求和，全部并列最高在提示中可见 |
| 部分或全部传播量缺失 | 已知合计明确不完整或显示数据缺失，不确认最高，不伪造0 |
| 有效传播量为0或无匹配话题 | 与数据缺失、加载失败清楚区分；无话题无最高记录 |
| 两页使用相同日期和场景且看板未选中话题 | 传播总量、热点数、逐日总量与最高话题一致 |
| 切换央媒报道、正能量热点或正能量线索 | 当前热榜或词云刷新并清空选中话题，恢复汇总趋势；顶部指标与驾驶舱右侧汇总图不变 |
| 两页切换分类或选中话题 | 两页分类、选中状态相互独立，默认分类为央媒报道 |
| 选择话题与恢复全部话题 | 看板下方切换单话题传播趋势；驾驶舱下方切换单话题热度，右侧总传播图不变；恢复操作有效 |
| 点击话题标题 | 有真实链接时新标签打开且不触发选中；无链接时提示原文地址未提供，不伪造链接 |
| 更多与收起 | 在热榜列表内展开和收起，无话题详情或更多列表弹窗 |
| 单话题观测缺少某日采样 | 显示缺失、曲线断开，不填0，不复制上线日总量 |
| 改变全局日期范围 | 关联模块一致刷新，两页选择清空；全网热度恢复汇总且仍保持独立近7日 |
| 查看全网热度 | 明确展示热度示例，不把传播量作为热度 |
| 检查看板顶部 | 六指标名称与两行顺序符合要求，四项沿用指标不由话题推算 |
| 无话题、加载失败、地区缺失 | 各自文案和操作明确，失败重试可用，无越界数据 |
| 打开、折叠、调整文档面板、下载 | 操作有效，不阻塞关闭；阅读正文与下载正文一致 |
| 检查主业务布局 | 无演示工具横条、来源说明条、英文眉题；看板无大标题与副标题，日期左对齐 |
| 查看演示状态与标识 | 状态选择位于需求文档工具区；页脚与文档工具保留示例标识 |
| 查看页面与文档内容 | 不出现登录账号、密码或会话信息 |
