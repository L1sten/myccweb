## 1. 当前产品概述

### 1.1 产品定位

优洗通用于连接平台、酒店和洗涤厂，当前围绕布草补充、酒店服务关系、工厂履约、退污退款、预存账户、易耗品商城和厂内扫描事件开展业务。

当前产品由一个共享业务服务支撑多个使用端：

- 平台与洗涤厂人员使用 Web 管理端。
- 酒店管理员、酒店操作员和司机使用微信小程序。
- 工厂操作员可在非微信构建的厂内终端中登记扫描事件。

### 1.2 当前业务闭环

1. 平台维护酒店、洗涤厂、站点、布草价格和酒店服务关系。
2. 平台管理员或平台运营按酒店和布草品类登记可补额度。
3. 酒店选择布草品类，有启用楼层时选择所属楼层，系统校验当前额度、预存余额、价格和承接工厂后生成补充订单。
4. 补充订单生成时同步扣减品类额度和酒店预存余额。
5. 工厂管理员或工厂操作员按顺序将订单推进为备货中、配送中和已送达。
6. 酒店可从已送达订单的一条明细发起退污申请。
7. 工厂确认可退数量后，系统按原订单酒店单价立即将退款计入酒店预存余额。
8. 酒店管理员和酒店操作员可使用预存余额购买平台商城商品；提交时同步校验并扣减库存与余额。

### 1.3 范围与使用约束

- 本文以当前系统为功能基线，覆盖已有页面、角色入口、操作规则和数据口径。
- 可补额度登记属于已有业务能力，目前 Web 没有独立额度登记页面；不将其列为可直接操作的菜单。
- 司机端当前只读查看负责范围；厂内终端当前采用手工事件采集方式，不代表已经接通真实 RFID 设备。
- 本期不包含在线充值、自动支付、司机任务履约、工厂付款、商品上下架、账号删除或其他当前页面尚未提供的操作。
- 组织建档、成员入口、账号基础维护及酒店、楼层、工厂站点和服务关系维护属于已确认范围；其他未确认目标能力不属于本文范围。

| 平台运营 | Web | 查看并维护平台运营资料；查看订单、退款、结算和商城订单；处理待派单异常订单 |

| 工厂管理员 | Web | 查看本厂经营数据；推进订单履约；确认退污；查看仓库、扫描记录、结算和报表 |
| 工厂操作员 | Web 与非微信厂内终端 | 推进订单履约；确认退污；查看仓库、扫描记录、结算和报表；登记终端事件 |

### 2.4 组织与数据范围

- 酒店账号只能访问所属酒店的楼层、额度、订单、退款、账户和员工数据。
- 工厂账号只能访问所属洗涤厂的订单、退款、仓库、扫描、结算和报表数据。
- 司机只能查看分配给本人的负责范围。
- 平台角色可查看全平台业务数据，但具体写操作仍受角色权限限制。
- 工厂订单页面只显示工厂结算金额，不显示酒店扣款和平台毛利。
- 酒店小程序只显示酒店成交价格，不显示工厂成本和平台毛利。

## 3. 全局产品规则

### 3.1 登录、退出与会话

- Web 与小程序均使用业务账号和密码登录。
- 登录成功后按账号角色进入对应工作台。
- Web 账号不能进入酒店或司机小程序工作台；不适用的账号登录后返回登录页并提示使用 Web 管理端。
- 已登录用户再次进入系统时恢复当前会话；会话失效后返回登录页。
- Web 右上角显示组织名称、当前角色、用户头像缩写和用户姓名，并提供退出登录。
- 小程序个人中心或司机工作台提供退出登录。

### 3.2 加载、空数据、错误与无权限

- 页面读取数据时显示加载状态。
- 列表无记录时显示对应业务空状态。
- 读取失败时显示简短错误原因和重新加载入口。
- 无页面权限时不显示菜单；通过外部地址进入时显示无权限页面。
- 提交失败时保留当前页面并显示可理解的失败原因。

### 3.3 列表、筛选与分页

- 酒店、洗涤厂和站点等已有档案均使用名称下拉选择，打开即可浏览候选，输入仅用于可选搜索，不要求输入编号，不允许以自由文本创建档案。候选为空时显示空状态；酒店和洗涤厂统一到“客户与组织”建档。业务页面保留字段标签、校验错误及必要操作确认，不展示原型、设计意图或规则讲解类文案。

- Web 业务订单和退污退款支持按状态查询，默认每页 20 条。
- 钱包流水和协议价格必须先下拉选择对应组织再查询。
- 状态筛选为单选，默认“全部状态”；选择或清空后点击“查询”生效，并回到第一页。刷新保留当前筛选和页码；订单与退款页没有独立重置按钮；组织和用户管理提供重置。
- 钱包和价格的组织条件为名称下拉框，打开即可浏览候选，可选输入搜索，按所选组织精确查询；价格的酒店与洗涤厂条件同时生效。条件不完整时提示选择，不加载无条件结果。点击查询生效。
- Web 用户、业务订单、退污退款、钱包流水、商城订单和 RFID 扫描记录使用分页；其余通用资源页一次显示当前返回的全部记录，不提供可切换页容量或列头排序。
- 酒店补充订单、退污记录、资金流水及厂内终端最近事件当前仅展示最近 20 条，不提供翻页或加载更多。不得据此将页面记录数视为历史累计总量。
- 通用资源列表提供刷新。
- 组织和用户使用专用管理页面，支持组织详情及账号维护；酒店与楼层、洗涤厂与站点、酒店服务关系提供下述专用维护能力；未另行说明的通用资源页不提供详情、编辑、停用、删除或批量操作。

数据排序规则：

- 订单、退款、钱包流水、商城订单与扫描事件按各自创建或发生时间倒序；相同时间没有另行规定次级顺序。
- 组织按组织类型、组织名称升序；酒店按名称升序；价格和仓库按布草品类名称升序；商城商品按分类、名称升序；工厂结算按工厂名称升序。
- 未提供条件的页面不涉及用户筛选；单条详情和表单不涉及排序。

### 3.4 金额、数量与状态

- 列表、详情、统计和小程序结算金额以人民币元展示并保留两位小数。Web 设置价格、登记充值、新增商品的金额输入分别标注“单价（分）”“到账金额（分）”“统一售价（分）”，填写整数分；不得将元值直接写入这些输入框。
- 布草和商品数量使用整数。
- 状态同时显示文字和颜色，不以颜色作为唯一识别方式。
- Web 与小程序保留各自当前状态文案：

| 业务状态 | Web 文案 | 小程序文案 |
|---|---|---|
| 等待工厂处理 | 已派单 | 待备货 |
| 工厂备货 | 备货中 | 备货中 |
| 已从工厂发出 | 配送中 | 配送中 |
| 履约完成 | 已送达 | 已完成 |
| 退款等待工厂确认 | 待处理（筛选项为“待确认”） | 待检测 |
| 退款同意 | 已同意 | 已退款 |
| 退款驳回 | 已驳回 | 已驳回 |

### 3.5 字段与提交的通用规则

- 展示规则：列表字段只读；空的普通文本及尚未确认的数量显示“—”，零金额和零数量保留为零。表单必填项按页面标记展示，初始密码使用密码输入。
- 交互规则：新增或设置操作打开表单；取消关闭表单，不保存输入。提交先校验必填项；提交中显示进度反馈；失败保留表单内容并展示原因，成功关闭弹窗并刷新当前列表。
- 数据规则：账号和司机创建使用可搜索组织选择器；司机负责酒店从酒店清单选择。酒店服务关系、手工派厂、价格和钱包等表单使用名称下拉选择已有档案，可选搜索候选，并校验实际归属与有效性。姓名、地址、说明等表单字段不涉及筛选和排序；角色、类型为页面已有选项的单选，不允许自定义角色。
- 权限规则：无写权限用户不显示新增、设置和业务处理按钮；有权限但记录状态不允许操作时，列表操作区域显示“—”。
- 密码规则：所有创建账号入口统一使用下述初始密码规则；账号列表不显示密码。

### 3.6 创建账号与初始密码

- 适用范围：平台新增用户、酒店或工厂建档时创建管理员、新增司机、酒店管理员添加员工，以及平台重置密码。
- 展示规则：初始密码、确认初始密码均为必填，打开表单时为空，不预填固定密码；默认隐藏输入，允许显示或隐藏以核对内容。
- 密码规则：8～20 位，英文字母、数字、特殊字符三类中至少包含两类。大写和小写字母同属字母类；特殊字符指英文半角标点和符号。任何位置均不允许空格、中文、全角字符、换行或表情；系统明确报错，不自动删改用户输入。
- 校验规则：先检查初始密码是否合规，再检查确认密码是否填写且与初始密码逐字一致；校验失败保留表单并显示原因，不创建账号。
- 交互规则：提交中阻止重复提交；创建失败保留输入供修改，成功后关闭或清空表单并刷新账号数据。取消、关闭或重新打开表单后不保留密码。成功反馈不回显密码。
- 数据规则：初始密码由创建人手工设置；确认密码只用于当前表单核对，不作为账号资料保存。创建成功后，由创建人通过安全渠道告知使用者账号及初始密码；当前没有短信或邮件自动通知。
- 使用边界：现有账号继续按原密码登录；没有首次登录强制改密或找回密码入口。平台可按账号维护权限重置密码，并使目标账号原登录失效；不会自动重置其他存量密码。
- 验收标准：账号创建与重置入口均拒绝少于 8 位、超过 20 位、仅含单类字符、含空格或中文、确认不一致的密码；字母加数字、字母加特殊字符、数字加特殊字符或三类组合均可通过格式校验。失败不清空输入，成功或关闭后清空密码。不涉及密码筛选或排序。

## 4. 平台 Web

### 4.1 经营总览

- 仅平台管理员和平台财务显示。
- 展示合作酒店、待处理订单、待确认退款、累计充值、累计消费和工厂应付。
- 支持刷新数据。
- 待关注事项当前不提供业务提醒记录，页面提示以各业务列表为准。

统计规则：

- 合作酒店：当前启用的酒店组织数量，按酒店计一次。
- 待处理订单：状态为已派单的订单数，不包含待派单、备货中、配送中或已送达。
- 待确认退款：尚未由工厂处理的申请数，按退款申请计一次。
- 累计充值：已登记充值流水金额之和；累计消费：补充订单和商城订单扣款的正向累计额，不扣减退污退款，不等于净收入。
- 工厂应付：已派单、备货中、配送中、已送达订单的工厂成本总额；不同于仅统计已送达订单的“工厂结算”。
- 时间范围为截至本次读取的全部历史记录，无日期筛选；各记录按其业务记录计一次，不按明细重复计单。页面打开或刷新时重新读取，空汇总显示零，读取失败显示错误，不以零代替失败。

### 4.2 业务订单

- 支持按订单状态查询和分页。
- 列表字段：订单号、酒店、所属楼层、布草件数、酒店扣款、工厂结算、平台毛利、承接洗涤厂、状态、下单时间。
- 平台管理员和平台运营仅可对待派单订单执行派单。
- 派单时必须填写有效的承接洗涤厂和工厂站点。
- 已通过固定关系自动派发的订单不显示派单操作。
- 筛选选项为全部状态、待派单、已派单、备货中、配送中、已送达，按状态精确匹配。订单号和酒店名称只用于展示，不提供搜索。
- 派单弹窗展示所选订单号和酒店；工厂与站点从名称搜索结果中选择且必填，仅可选启用对象；站点随工厂联动，切换工厂清空原站点。取消不变更订单；成功后关闭弹窗、刷新当前页，原状态筛选下不再符合的记录不显示。

### 4.3 退污退款

- 支持按待确认、已同意和已驳回查询。
- 列表字段：退款单号、原订单号、酒店、申请件数、确认件数、申请退款、实际退款、原因和状态。
- 平台角色仅查看，不执行同意、驳回或资金处理。
- 默认显示全部状态，申请件数与申请退款为原申请值；待确认时确认件数为空、实际退款为零。部分同意后分别展示原申请数量和实际确认数量；驳回后实际退款为零。

### 4.4 客户与组织

#### 组织建档与成员入口

- 模块目标：“客户与组织”是酒店、洗涤厂统一建档入口，创建时完成首个管理员配置，并在组织详情中继续添加和维护成员。
- 展示规则：组织列表展示编号、名称、类型和状态；名称或“详情与成员”打开右侧组织详情抽屉，展示组织基本资料、管理员和成员；关闭抽屉后保留组织列表查询条件。缺少启用管理员的存量组织显示“待配管理员”，不把它当作停用状态。
- 筛选规则：组织名称为可清空文本，按名称模糊匹配；组织类型单选平台、酒店、洗涤厂，默认全部。条件取交集，点击查询或回车生效，重置清空条件。组织按类型、名称升序，同名按组织编号稳定排序。
- 建档步骤：从“新建组织”打开表单，在组织资料步骤选择酒店或洗涤厂，然后依次填写首个管理员、确认创建。酒店与洗涤厂均必须配置首个管理员；平台组织不提供普通新建入口。
- 字段规则：组织名称、区域和地址必填；工厂另需首个站点名称，酒店不填写站点名称及楼层，也不强制选择承接站点。管理员姓名、登录账号、初始密码及确认密码必填，角色只读为对应组织管理员。普通文本去除首尾空白，密码不裁剪；表单字段不涉及排序。
- 数据规则：酒店同时建立档案、零余额账户和管理员，不自动生成楼层；工厂同时建立首个站点和管理员。任一资料或账号校验失败，全部创建失败，不留下部分组织或账号。
- 交互规则：前后步骤保留已填资料；确认页展示组织、区域、地址、管理员姓名和账号，工厂另展示首个站点，不展示密码。提交中禁止重复操作；失败保留表单并说明原因；酒店创建成功进入酒店详情，工厂创建成功进入组织详情。取消或关闭时清空密码。
- 成员入口：从组织详情添加成员时，所属组织预填且不可更改；存量组织可通过补齐管理员入口创建对应管理员，不自动生成密码或账号。
- 数据与统计规则：成员按所属组织纳入，包含启用和停用账号；启用管理员只统计本组织对应管理员角色且状态为启用的账号，按账号去重，不受当前列表筛选或日期影响。成员变更后刷新组织详情、管理员状态和相关列表，零成员显示零，读取失败显示错误及重试，不以零代替失败。
- 权限规则：平台管理员、平台运营可以创建酒店或工厂；成员维护范围按下述账号管理规则执行。无创建权限时隐藏新增入口，组织详情仍可只读查看。

### 4.5 酒店与楼层

- 模块目标：集中维护酒店资料、选品所属楼层和承接关系。楼层仅作为酒店内部选品归属标签，不是配送地址，不参与派厂、商品范围、价格、额度或结算。
- 列表展示规则：展示酒店名称、区域、酒店地址、状态、启用楼层数、承接工厂及站点；未关联显示“待配置”，与停用状态分别展示。酒店名称进入详情，关闭详情保留查询条件。
- 筛选规则：酒店为可清空下拉框，默认全部，候选来自“客户与组织”已建档酒店，可选按名称搜索，选定后精确匹配；状态单选全部、启用、停用；关联站点单选全部、已配置、待配置，默认全部，条件取交集。查询或回车生效并回第一页，重置清空条件；无结果提示调整条件，失败可重试。
- 数据规则：酒店按名称升序，同名稳定排序；楼层数仅统计当前酒店启用楼层，按楼层计一次，不受日期或其他酒店影响，维护后刷新；无楼层显示零。列表包含未配置承接站点的酒店。
- 组织来源：本模块不提供新建酒店；通过下拉框选择“客户与组织”已建档酒店后维护。
- 建档规则：“客户与组织”建档仅填写酒店名称、区域、地址及首个管理员姓名、账号、初始密码和确认密码；不出现楼层、酒店站点名称。允许暂不指定承接站点，成功进入酒店详情，不自动生成“默认楼层”。
- 酒店资料：名称、区域、地址必填，详情可编辑并启用、停用或恢复；配送使用酒店地址。酒店停用后停止新业务，已有订单可继续查询、履约和退款；恢复不自动恢复已解除关系。
- 楼层字段：名称必填，去除首尾空白；顺序为整数，数值越小越靠前，同序按名称排列；状态为启用或停用。只提供名称、顺序、状态，不配置地址、工厂站点、独立商品、价格或额度。
- 楼层操作：每次添加一个楼层，名称采用单行输入，不按逗号或换行拆分；支持改名、修改顺序、停用和恢复，不提供物理删除。列表包含启用与停用记录；同酒店内名称唯一，与已有启用或停用记录重名均明确指出并阻止保存；与停用项重名时提示恢复原楼层。
- 操作反馈：平台管理员和运营可维护；财务只读，不显示写操作。保存中禁止重复提交；失败保留输入；资料已被他人修改时提示刷新后重新编辑，不覆盖他人结果。停用前确认对象及仅影响新业务，成功刷新详情与列表，修改记录可追溯。
- 承接关系：酒店详情与“酒店服务关系”共用配置、更换和解除操作，遵循第 4.7 节。
- 验收标准：从“客户与组织”无楼层建档后可进入详情；维护模块只能选择已有酒店；可筛选未关联酒店；单条添加重名明确报错；排序、停用与恢复同步影响选品候选，不改写旧订单所属楼层。

### 4.6 协议价格

- 查询条件：酒店和洗涤厂名称下拉选择，两个条件均为必选。
- 列表字段：布草编号、布草品类、单位、酒店协议价和工厂成本价。
- 平台管理员和平台运营可设置酒店协议价或洗涤厂成本价。
- 设置字段：价格类型、酒店、洗涤厂、布草品类和单价；已有档案使用名称下拉选择。
- 价格修改只更新当前价格；已生成订单继续显示下单时保存的价格。
- 单价为必填的非负整数分，允许零值。查询展示当前有效布草品类，缺少的协议价或成本价显示空值，不视为已经配置零价。

### 4.7 酒店服务关系与工厂站点

#### 酒店服务关系

- 业务关系：工厂可以有多个站点，每家酒店最多关联一个承接站点，一个站点可服务多家酒店。平台统一维护关系。
- 展示规则：列表展示全部酒店，包括未配置酒店；字段包括酒店、酒店状态、承接洗涤厂、工厂站点和关联状态。未关联显示“待配置”，不展示酒店内部站点层级。
- 筛选规则：酒店名称下拉选择，可选搜索候选，酒店状态与是否关联站点单选，默认全部；条件取交集，查询回第一页，重置清空。按酒店名称升序；无结果展示空状态，读取失败可重试。
- 设置规则：酒店、工厂和站点通过名称下拉选择，打开即可浏览候选，输入仅用于可选搜索；从酒店详情或行操作进入时酒店预填。仅可选择启用工厂及其启用站点，切换工厂必须清空原站点；候选为空时说明原因并引导维护。
- 操作规则：未配置酒店显示设置，已配置显示更换和解除。保存前确认酒店、原承接对象与新承接对象；解除前确认当前关系。明确说明仅影响新订单，已有订单保留原承接对象和成交价格。
- 数据规则：新补充订单使用提交时有效的服务关系自动派发；未配置关系可浏览商品和选品，但下单不可用并提示联系平台配置承接站点。恢复酒店、工厂或站点不自动恢复已解除关系。
- 权限与冲突：仅平台管理员、平台运营可写，财务只读。提交中禁止重复操作，失败保留选择；他人先修改时提示刷新重选，不覆盖新关系。成功刷新关系列表、酒店详情和工厂服务酒店清单。

#### 洗涤厂与站点

- 展示规则：工厂列表通过下拉框选择“客户与组织”已建档洗涤厂，可选按名称搜索，并支持状态筛选，默认全部，条件取交集；工厂按名称升序。工厂详情展示基本资料及多个站点，站点展示名称、区域、地址、状态和服务酒店。
- 字段规则：工厂名称必填，状态为启用或停用；新增站点名称、区域、地址必填，默认启用。站点从当前工厂读取，服务酒店只统计当前关联该站点的酒店，按酒店去重；零酒店显示零或“暂无服务酒店”，读取失败不当作零。
- 操作规则：本模块不提供新建洗涤厂，缺少档案时到“客户与组织”建档。平台管理员和运营可编辑工厂资料、新增及编辑站点、停用和恢复；财务只读，不提供物理删除。表单保存中禁止重复提交，失败保留输入，成功刷新详情；遇同时修改冲突需刷新后重试。
- 停用规则：工厂或站点仍有服务酒店时，必须先调整或解除关系，展示受影响酒店。停用后停止新业务，但既有订单继续查询、履约和退款，不自动改派。
- 历史规则：新订单记录当时的酒店名称、所属楼层、工厂、站点及酒店地址，后续改名或改地址不改变历史展示；原有订单补齐历史资料只能反映补齐时可得资料，不能保证还原更早时点。
- 验收标准：一厂多站点、一站点多酒店正确展示；候选按工厂联动；设置、更换、解除后各入口一致；有服务酒店不能停用，解除后可停用和恢复，恢复不重建关系；旧订单承接对象、价格和地址保持不变。

### 4.8 司机负责范围

- 列表字段：司机、登录账号、所属组织、负责区域、负责酒店、分配数和状态。
- 平台管理员和平台运营可新增司机并分配首家酒店。
- 新增字段：所属平台或工厂、登录账号、初始密码、司机姓名、负责区域和首家负责酒店。组织与酒店使用可搜索选择器，从组织成员入口进入时所属组织预填只读。
- 当前 Web 没有追加或移除负责酒店的页面操作。

### 4.9 钱包与流水

- 仅平台管理员和平台财务显示。
- 必须从下拉候选选择酒店后查询。
- 列表字段：流水类型、变动金额、变动后余额、关联业务、摘要和发生时间。
- 平台管理员和平台财务可登记已核验的线下充值。
- 登记字段：酒店名称下拉选择、到账金额、银行流水号和核验备注。
- 同一酒店的相同银行流水号重复提交时不得重复入账；若金额不一致则拒绝提交。
- 已登记流水不可在页面中修改或删除。
- 到账金额必须为大于零的整数分；酒店必选，银行流水号必填，核验备注选填。流水带有正负方向，余额为该笔变动完成后的余额；无日期或流水类型筛选。

### 4.10 工厂结算

- 列表字段：工厂组织编号、洗涤厂、已送达订单和结算金额。
- 结算金额按已送达订单中的工厂成本汇总。
- 每家工厂一行，未送达订单不计入；没有已送达订单的工厂数量和金额为零。退污退款当前不会冲减该汇总，金额不代表已付款或扣除退款后的净应付。
- 当前页面仅提供汇总查看，不提供账单生成、核对、开票或付款操作。

### 4.11 商城商品与商城订单

商城商品：

- 仅平台管理员和平台运营显示。
- 列表字段：商品名称、分类、商品说明、统一售价、可售库存和状态。
- 可新增商品；字段包括商品名称、分类、说明、图片地址、统一售价和初始库存。
- 当前没有商品编辑、上下架和分类维护操作。
- 列表当前只返回可售商品，包括库存为零的可售商品。商品名称、分类、说明、统一售价和初始库存必填，图片地址选填；统一售价为大于零的整数分，初始库存为大于零的整数。

商城订单：

- 所有平台角色均可查看。
- 列表字段：商城订单号、商品明细、商品件数、订单金额、状态和下单时间。
- 当前页面只读。

### 4.12 用户与权限

#### 用户、角色与账号维护

- 关系规则：一个账号属于一个组织、具有一个固定角色。组织决定基础数据归属，角色决定业务操作；司机负责酒店属于业务分配，与所属平台或工厂分别展示。无跨组织任职、多个角色、自定义权限、账号迁移或删除功能。
- 展示规则：用户列表展示姓名、登录账号、所属组织、组织类型、中文角色、状态和创建时间；账号、组织只读，密码不展示。角色说明展示职责、使用端与数据范围；空的普通文本显示“—”。
- 筛选规则：姓名或账号共用文本搜索，任一字段模糊匹配即命中；组织、角色、状态为可清空单选，默认全部，多个条件取交集。角色来自固定角色目录；状态为启用、停用。点击查询或回车生效并回第一页，重置清空全部条件；刷新保留条件。用户每页默认 20 条，按创建时间倒序，同一时间按账号编号稳定排序；无结果提示调整条件。
- 所属组织：新增时必填、可按名称搜索选择，仅可向启用组织添加账号；组织详情入口预填只读。切换组织后清除原角色，再选择该组织及当前操作者允许分配的角色，不保留非法组合。
- 角色选项：平台可选平台管理员、平台运营、平台财务；酒店可选酒店管理员、酒店操作员；洗涤厂可选工厂管理员、工厂操作员、工厂财务。平台和工厂另可创建司机，但必须进入包含负责酒店的司机创建流程；酒店不可创建司机。
- 新增字段：姓名、全局唯一登录账号、角色、初始密码和确认密码必填。组织从选择结果取值；登录账号不可与任何存量启用或停用账号重复。新建账号初始为启用；酒店最多 10 个启用账号，包含管理员。
- 司机规则：所属组织仅平台或工厂；首家负责酒店与负责区域必填，酒店从酒店清单中选择。创建账号与首家酒店分配共同成功或失败，不能只建没有负责范围的司机账号。既有司机可修改姓名、启停用或重置密码，不允许转换为其他角色；其他角色也不可直接改为司机。
- 维护入口：列表统一通过“维护账号”打开弹窗，“维护内容”可选“姓名、角色与状态”或“重置密码”。组织成员在详情抽屉内沿用用户列表的姓名或账号、角色、状态筛选及分页，固定所属组织且不展示组织筛选。
- 姓名维护：预填现值、必填，保存后同步更新相关列表；登录账号和组织不可编辑。
- 角色调整：仅可在同组织内选择合法角色。确认时展示原角色、新角色及职责变化，提示该账号需重新登录。禁止降低自己的管理员角色；禁止把组织最后一个启用管理员改为其他角色。
- 启停用：按当前状态显示停用或启用，停用前确认目标及登录失效影响。禁止停用自己或组织最后一个启用管理员；恢复酒店账号时重新校验 10 人上限，停用账号不占启用名额。
- 重置密码：手工填写新密码与确认密码，沿用统一密码规则；提交前确认将结束该账号现有登录，成功不回显密码，由操作人通过安全渠道告知使用者。新密码不会自动启用停用账号，不提供找回密码、强制首次改密或自动通知。
- 会话规则：停用、角色变化或重置密码成功后，账号原登录全部失效；恢复启用不恢复原登录，需重新登录。仅修改姓名不强制退出。
- 操作反馈：无维护权限隐藏操作按钮；已知的自身或最后管理员限制禁用并显示原因，提交时仍校验最新状态。提交中阻止重复保存；取消不修改资料；失败保留输入并说明冲突原因；成功刷新用户及组织成员数据，不再符合筛选的账号从当前结果移除。无批量操作。
- 权限规则：平台管理员可维护全平台账号；平台运营仅可维护非平台角色账号，既不能维护已有平台角色，也不能授予平台角色。平台财务只读。酒店移动端保留原有成员查看与创建能力，本轮不增加工厂自主管理入口。
- 数据保护：最后管理员、酒店名额限制以同一组织最新结果判定，同时操作不能突破约束。账号变更可追溯记录操作者、对象和变更，不记录明文密码。
- 验收标准：建档后可立即查看管理员并继续配人；组织预填和角色联动正确；重复账号、非法角色、越权、名额已满及最后管理员冲突均失败且无部分保存；改角色、停用或改密后原登录失效；财务只能查看；空、加载失败、保存失败都有明确反馈。

## 5. 洗涤厂 Web

### 5.1 经营总览

- 展示待处理订单、备货中订单、待确认退款和工厂应收。
- 数据范围仅限当前洗涤厂。
- 支持刷新数据。
- 待关注事项当前不提供业务提醒记录。
- 统计规则：待处理订单仅统计本厂已派单订单，备货中仅统计备货中订单，待确认退款仅统计本厂待确认申请；工厂应收汇总本厂已派单至已送达订单的工厂成本。均为全部历史截至读取时的结果，无日期筛选，刷新重新统计；无记录显示零，读取失败展示错误。

### 5.2 业务订单

- 支持按订单状态查询和分页。
- 列表字段：订单号、酒店、所属楼层、布草件数、工厂结算、状态和下单时间。
- 不显示酒店扣款、平台毛利和其他工厂数据。
- 工厂管理员和工厂操作员可按唯一顺序更新进度：已派单进入备货中，备货中进入配送中，配送中进入已送达。
- 当前状态不满足下一步要求时不得更新。
- 工厂财务仅查看，不显示更新操作。
- 更新弹窗展示所选订单、酒店及唯一可用的下一状态，下一状态只读。用户确认后更新，取消不改变状态；不支持跳步、回退或批量履约。

### 5.3 退污确认

- 仅工厂管理员和工厂操作员显示。
- 列表字段：退款单号、原订单号、酒店、申请件数、确认件数、原因和状态。
- 页面不显示申请退款和实际退款金额。
- 待确认申请可同意或驳回。
- 同意时可填写不超过申请件数的确认数量，因此支持部分同意。
- 驳回时确认数量为零且必须填写原因。
- 已处理申请再次提交不同结果时必须拒绝。
- 同意弹窗默认确认数量等于申请件数，允许修改为 1 至申请件数的整数，核验备注选填。驳回弹窗不填写确认数量，原因必填。提交成功关闭弹窗并刷新列表；在“待确认”条件下已处理申请移出当前结果。

### 5.4 布草与仓库

- 仅工厂管理员和工厂操作员显示。
- 列表字段：布草编号、布草品类、累计入库、累计备货和当前可用。
- 数量由当前洗涤厂的首次芯片入库与租赁备货事件汇总。
- 当前页面只读，不提供仓区或货架维护。
- 统计规则：按当前有效布草品类分行；累计入库为首次芯片入库事件数量之和，累计备货为租赁备货事件数量之和，当前可用为累计入库减累计备货。只统计已保存的本厂事件，不按订单状态增减，没有日期筛选；无事件品类显示零。当前没有库存不足拦截，结果可能为负值，按实际汇总展示。

### 5.5 RFID 扫描记录

- 仅工厂管理员和工厂操作员显示。
- 列表字段：事件编号、工作模式、关联业务、布草品类、识别数量、采集方式和提交时间。
- 只展示已经由系统确认保存的事件。
- 当前页面只读；扫描事件在非微信厂内终端提交。

### 5.6 工厂结算与业务报表

工厂结算：

- 展示当前工厂编号、名称、已送达订单数和工厂结算金额。
- 仅使用订单中的工厂成本，不显示酒店销售金额或平台毛利。

业务报表：

- 展示累计订单、已送达订单、布草总件数和工厂应收。
- 当前没有日期、站点、酒店或布草品类筛选。
- 累计订单和布草总件数包含本厂全部订单状态；已送达订单只计履约完成的订单；工厂应收沿用经营总览口径，包含已派单至已送达订单。当前报表与结算汇总不是同一个统计范围。

## 6. 酒店管理员微信小程序

### 6.1 补充下单

- 展示规则：顶部展示优洗通、酒店名称、账户记录入口、可补总量、精确余额和余额状态。布草品类展示名称、酒店单价、单位及当前可补数量；底部显示已选总件数和预计扣款。
- 楼层规则：只读取当前酒店启用楼层，按维护顺序、名称排列。有启用楼层时默认第一项，刷新优先保留仍有效的当前选择；没有启用楼层时隐藏切换入口，正常选品与下单，所属楼层为空，不自动创建默认楼层。
- 交互规则：所有楼层共用酒店商品、价格和额度；切换仅改变本次选品所属楼层，保留已选品类和数量。数量初始为零，使用加减操作，最小零、最大不超过该品类可补数量；布草按名称排列，不提供按楼层单独的商品或价格筛选。
- 提交规则：未选布草、额度或余额不足、酒店停用、承接关系无效时不能下单，并明确原因。无承接站点仍可浏览选品；具备启用楼层时必须选择有效楼层，无启用楼层时可直接无楼层下单。
- 状态变化：所选楼层在提交前被停用时保留选品内容，提示刷新并重新选择，不静默替换；刷新后已无启用楼层时，须经用户确认才无楼层提交。更换账号不继承其他酒店或用户的草稿。
- 操作反馈：提交中禁止重复操作；失败保留草稿；成功进入新订单详情。重复提交同一内容返回原订单，不重复扣额度或余额。
- 数据规则：额度属于酒店与品类，楼层不独立核算；可补总量为本酒店全部品类剩余额度之和，预计扣款为已选数量与当前酒店单价乘积之和，不涉及日期筛选。切换楼层不改变单价、额度或所选数量。
- 验收标准：无楼层酒店可浏览、下单并查看订单；添加楼层后显示切换，切换保留数量和合计；排序、刷新保留、提交前停用、无可用楼层确认及跨酒店楼层均按规则处理。

### 6.2 订单列表与详情

- 订单页包含“补充订单”和“退污记录”两个页签。
- 补充订单字段：订单号、下单时间、状态、所属楼层、品类摘要、总件数和订单金额。
- 点击订单进入详情。
- 订单详情展示当前状态、订单号、下单时间、所属楼层、酒店地址、承接站点、布草名称、原单价、数量、小计、合计件数和合计金额。
- 已送达且仍有可退数量的订单显示“申请部分退污”。
- 默认显示补充订单，两个页签切换当前已读取的数据；无订单与无退污分别显示空状态。无楼层统一显示“未指定”；配送使用酒店地址。详情金额、酒店、楼层、承接工厂站点和地址沿用订单记录，不随后续资料或价格调整变化。

### 6.3 退污申请与记录

- 退污只能从已送达订单进入。
- 每次申请只能选择一个订单明细品类。
- 页面展示的可退数量为原订单数量减去已退款数量；提交时还需扣除待确认申请已占用的数量，因此已有待确认申请时，可能收到剩余可退数量不足的提示。
- 必须选择申请数量并填写退污原因。
- 页面按原订单酒店单价计算预计退款金额。
- 提交后返回订单页，可在“退污记录”查看退款单号、关联订单、状态、申请或确认数量和金额。
- 增加另一品类的申请数量时，清空此前品类的选择；每次仅提交一个品类。原单价只读，原因最多 200 字；未选数量或未填原因时点击提交提示补全，提交中禁用按钮。
- 待检测与已驳回记录展示申请数量和申请金额，不能解读为实际已退款；已退款记录展示工厂通过数量和实际退款金额。当前列表不显示工厂核验备注。

### 6.4 账户与账单

- 仅酒店管理员可进入。
- 展示当前可用余额。
- 流水类型包括线下充值、补充订单扣款、商城订单扣款、退污退款和账户调整。
- 每条流水展示类型、发生时间、关联业务、变动金额和变动后余额。
- 点击充值只显示“充值方式待开通”，并提示联系优洗通财务处理授权充值。

### 6.5 易耗品商城

- 展示商品图片或占位图、分类、名称、说明、统一售价、库存和状态。
- 酒店管理员和酒店操作员均可逐件增加或减少购买数量。
- 选择数量不能超过库存；不可售商品不能增加数量。
- 提交前显示总件数和总金额，并要求再次确认。
- 提交时再次校验商品状态、库存和预存余额。
- 成功后扣减商品库存和酒店预存余额，并显示商城订单号。
- 数据与交互规则：只加载可售商品，按分类、名称升序，不提供分类筛选或商品搜索。数量默认零；未选商品或提交中不可提交。取消确认保留已选数量；成功清空选择并刷新商品，失败保留选择并展示失败原因。金额仅合计本次已选商品，不属于历史消费统计。

### 6.6 员工账号

- 仅酒店管理员可进入。
- 展示姓名、登录账号、角色和状态。
- 酒店管理员可添加酒店操作员。
- 新增字段：姓名、登录账号、初始密码和确认初始密码；密码按第 3.6 节统一校验。
- 当前酒店最多有 10 个启用账号。
- 登录账号不能与已有账号重复。
- 当前页面没有编辑、停用或删除员工操作。

### 6.7 个人中心

- 展示用户姓名、所属酒店和当前身份。
- 显示账户与账单、员工账号和退污记录入口。
- 提供退出登录。

## 7. 酒店操作员微信小程序

### 7.1 当前可用能力

- 与酒店管理员共用补充下单、订单列表、订单详情、退污申请、退污记录、易耗品商城和个人中心。
- 补充页显示精确钱包余额和酒店协议单价。
- 可使用预存余额提交补充订单和商城订单。

### 7.2 当前受限入口

- 个人中心仍显示“账户与账单”和“员工账号”。
- 点击账户与账单时提示当前账号无权限，不进入资金流水。
- 点击员工账号时提示当前账号无权限，不进入员工列表。

## 8. 司机微信小程序

- 司机登录后直接进入本人负责范围。
- 顶部展示“司机工作台”、司机姓名和退出入口。
- 负责范围按区域分组。
- 区域展示区域名称和酒店数量。
- 酒店条目展示序号、酒店名称；存在数据时同时展示酒店地址和服务点。
- 无负责酒店时提示联系优洗通运营人员调整。
- 当前页面不提供业务操作按钮。
- 数据规则：分组来源为当前司机负责范围；酒店条目按配置顺序、酒店名称排列。区域酒店数取该分组条目数，序号在区域内从一开始；不提供搜索、状态或日期筛选，也不涉及订单数量统计。

## 9. 非微信厂内终端

### 9.1 使用边界

- 当前移动端页面仅向工厂操作员开放；工厂管理员通过 Web 查看扫描记录，没有厂内终端的移动入口。事件登记业务授权同时覆盖工厂管理员与工厂操作员，不能将页面入口范围等同于全部业务授权范围。
- 页面采用与微信小程序一致的竖屏移动端比例和单栏操作结构，不使用宽屏侧栏工作台。
- 顶部展示所属洗涤厂和“终端工位”，工作模式在内容区顶部横向切换。
- 微信小程序中不开放厂内终端；进入时提示使用经认证的厂内终端并返回登录页。
- 非微信终端提供首次芯片入库和租赁备货两个工作模式。

### 9.2 事件登记

- 通用字段：洗涤站点、布草品类、业务引用、芯片号和有效数量。
- 洗涤站点通过当前工厂权限范围内的名称列表选择，不填写站点编号；展示状态，不可选择其他工厂站点。
- 布草品类必须有效。
- 有效数量必须为大于零的整数。
- 首次芯片入库必须填写芯片号。
- 租赁备货允许芯片号为空。
- 工厂或站点停用后禁止首次芯片入库；仅允许为原工厂及原站点下已有未完成订单进行租赁备货，必须填写可匹配的原订单业务引用，不能开展新的独立业务。
- 同一业务引用重复提交相同内容时返回原事件，不生成重复事件。
- 同一业务引用对应不同内容时拒绝提交。
- 展示与交互规则：默认首次芯片入库，站点、品类、业务引用、芯片号初始为空，有效数量初始为 1。站点和品类从当前有效候选中按名称下拉选择，业务引用必填；切换模式保留表单输入，首次入库的芯片号必填，租赁备货选填。
- 提交按钮在提交中禁用；校验失败保留表单并提示原因。成功后保留站点、品类及工作模式，清空芯片号和业务引用，将有效数量恢复为 1，并在最近事件前部显示结果。
- 业务引用的防重范围为同一洗涤厂；当前不会按芯片号自动去重，也不检查租赁备货是否超过累计入库数量。

### 9.3 最近事件

- 展示当前工厂最近的扫描事件。
- 每条记录展示工作模式、业务引用、提交时间、有效数量和采集方式。
- 当前采集方式为手工适配器。
- 读取时按提交时间倒序展示最近 20 条，两个模式共用列表，不随模式切换筛选；无记录展示“暂无设备事件”，读取失败提供重新加载。
- 当前终端事件不会自动推进补充订单状态，也不会自动增加酒店可补额度。

## 10. 当前业务规则

### 10.1 可补额度

- 可补额度按酒店和布草品类记录。
- 平台管理员或平台运营可按酒店、布草品类、数量和业务引用增加额度。
- 同一酒店与业务引用对同一布草品类重复登记时不重复增加额度。
- 下单时按每个布草品类分别扣减额度。
- 任一品类额度不足时整笔补充订单不生成。

### 10.2 补充订单与预存余额

- 酒店管理员和酒店操作员均可提交补充订单。
- 下单至少包含一个大于零的布草品类数量。有启用楼层时必须选择所属酒店的有效楼层；无启用楼层时允许不指定楼层。
- 每个品类必须同时存在酒店协议价和承接工厂成本价。
- 酒店必须启用且配置有效承接工厂与站点，工厂及站点也须启用；未配置可选品但不能下单。
- 下单金额为各品类数量乘以酒店协议单价后求和。
- 账户余额不足时不生成订单、不扣额度、不扣余额。
- 成功下单时，订单创建、额度扣减和余额扣减作为同一次业务处理完成。
- 同一提交标识重复提交相同内容时返回原订单，不重复扣款；提交不同内容时拒绝。

### 10.3 订单履约

- 新订单在服务关系有效时直接进入已派单状态。
- 只有待派单异常订单可由平台管理员或平台运营重新指定工厂和站点。
- 工厂履约状态必须依次从已派单进入备货中、配送中和已送达。
- 工厂管理员和工厂操作员可更新状态；工厂财务只读。

### 10.4 退污与退款

- 酒店管理员和酒店操作员均可申请退污。
- 仅已送达订单可申请。
- 每次申请关联一条订单明细。
- 申请数量不能超过原数量扣除已有有效申请后的剩余数量。
- 有效占用数量为待确认申请的申请件数加已同意申请的确认件数；已驳回申请不占用额度，部分同意未通过的件数不继续占用可退数量。
- 工厂管理员和工厂操作员可全部、部分同意或驳回。
- 同意数量大于零时，退款金额按原订单酒店单价计算并立即增加酒店预存余额。
- 驳回不产生资金变动。
- 退款和余额入账作为同一次业务处理完成。

### 10.5 商城订单

- 酒店管理员和酒店操作员均可下单。
- 商品必须处于可售状态，购买数量不能超过当前库存。
- 商城金额按商品统一售价乘以数量求和。
- 酒店预存余额不足时不生成商城订单。
- 成功提交时，商城订单创建、库存扣减和余额扣减作为同一次业务处理完成。
- 同一提交标识不得产生重复订单或重复扣款。

### 10.6 价格与结算口径

- 平台价格页同时展示酒店协议价和工厂成本价。
- 酒店订单与小程序只使用酒店协议价。
- 工厂订单与结算只使用工厂成本价。
- 平台订单同时展示酒店扣款、工厂结算和两者差额。
- 工厂结算只汇总已送达订单的工厂成本。

## 11. 当前验收标准

### 11.1 角色与导航

- 每个测试账号登录后进入与其角色匹配的首个页面。
- Web 菜单与本文权限矩阵一致。
- Web 右上角展示组织、角色和用户姓名，用户菜单可执行退出登录。
- 酒店与工厂账号不能查看其他组织的数据。
- 酒店、工厂建档均配置首个管理员，失败无部分保存；组织详情可直接添加成员，用户列表按条件交集查询。
- 平台运营不能维护原有平台角色或授予平台角色；财务只读；最后管理员、自己停用、酒店启用名额限制不可绕过。
- 改角色、停用和重置密码后原登录失效，组织成员与用户列表保持一致。
- 工厂订单不显示酒店扣款和平台毛利。

### 11.2 补充订单

- 酒店建档不出现楼层及酒店站点名称；无楼层可浏览、下单、查询及重复提交。
- 添加楼层后出现切换，切换保留品类数量，价格和额度不变；刷新保留有效选择。
- 楼层排序、单条添加重名、停用恢复、提交前停用及跨酒店归属校验正确；无楼层统一显示“未指定”。
- 加减数量不能突破零和该品类可补数量。
- 金额与件数随数量变化正确更新。
- 额度不足、余额不足、价格缺失或酒店服务关系缺失时不生成订单。
- 成功下单仅生成一笔订单、一次额度扣减和一次余额扣减。
- 重复提交相同内容不会重复扣款。

### 11.3 履约与退款

- 工厂订单只能按既定顺序推进至已送达。
- 工厂财务不能更新订单状态。
- 酒店只能对已送达订单的剩余可退数量发起退污。
- 工厂可部分同意，确认数量不能超过申请数量。
- 驳回必须填写原因且不改变酒店余额。
- 同意后酒店余额按原订单单价和确认数量正确增加。

### 11.4 账户与商城

- 平台管理员和平台财务可登记已核验线下充值；同一酒店的相同银行流水号不重复入账。
- 酒店管理员可查看资金流水；酒店操作员进入该入口时收到无权限提示。
- 商城提交时再次校验库存和余额。
- 商城成功下单仅生成一笔订单、一次库存扣减和一次余额扣减。

### 11.5 工厂数据与终端

- 仓库页面按事件汇总累计入库、累计备货和当前可用数量。
- 工厂财务不显示仓库、扫描和退污菜单。
- 厂内终端以竖屏移动端比例展示，工作模式、事件表单和最近事件按单栏顺序排列。
- 只有工厂操作员账号拥有厂内终端移动页面入口；此入口规则不改变已有的工厂管理员事件登记业务授权。
- 微信小程序不允许进入厂内终端。
- 厂内终端的首次芯片入库在芯片号为空时不能提交。
- 相同业务引用重复提交相同事件不会生成重复记录。

### 11.6 页面状态

- 关键页面具备加载、空数据、错误重试和无权限状态。
- 列表筛选、刷新和分页可正常使用。
- 翻页仅适用于本文列明的 Web 分页列表；移动端最近 20 条列表不验收为全量历史检索。
- 关键提交操作具有禁用、确认、成功和失败反馈。

### 11.7 酒店、楼层和服务关系

- 酒店下拉选择、状态、关联站点筛选取交集，包含待配置酒店；酒店和洗涤厂统一从“客户与组织”建档，维护模块只能选择已有组织；楼层单条添加且不提供物理删除。
- 工厂多站点和站点服务酒店完整展示；工厂与站点名称联动，更换工厂清空旧站点。
- 关系配置、替换和解除在酒店详情与关系列表保持一致，仅影响新订单；没有关系时可选品不能下单。
- 酒店、工厂和站点停用不阻断旧订单履约、查询及退款；有服务酒店的工厂和站点不能直接停用，恢复不重建解除的关系。
- 同时编辑发生冲突时不能覆盖他人结果；新下单使用提交时有效的楼层、状态及关系，不出现部分成功。
- 新订单名称、酒店地址与价格保留原记录；改名、改址及服务关系变更不改写既有订单。
- 财务仅能查看酒店、楼层、工厂站点与服务关系；终端只选择本厂站点，停用站点仅用于已有订单允许的租赁备货。
