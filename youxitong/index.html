## 1. 当前产品概述

### 1.1 产品定位

优洗通用于连接平台、酒店和洗涤厂，当前围绕布草补充、酒店服务关系、工厂履约、退污退款、预存账户、易耗品商城和厂内扫描事件开展业务。

当前产品由一个共享业务服务支撑多个使用端：

- 平台与洗涤厂人员使用 Web 管理端。
- 酒店管理员、酒店操作员和司机使用微信小程序。
- 工厂操作员可在非微信构建的厂内终端中登记扫描事件。

### 1.2 当前业务闭环

1. 平台维护酒店、洗涤厂、站点、布草价格和酒店服务关系。
2. 平台管理员或平台运营按酒店和布草品类登记可补额度。
3. 酒店选择布草品类，有启用楼层时选择所属楼层，系统校验当前额度、预存余额、价格和承接工厂后生成补充订单。
4. 补充订单生成时同步扣减品类额度和酒店预存余额。
5. 工厂终端选择订单所属站点和待备货订单，按订单品类分批登记备货；工厂管理员或工厂操作员依次推进备货中、配送中和已送达，所有品类备齐后才允许出库进入配送中。
6. 酒店可从已送达订单的一条明细发起退污申请。
7. 工厂确认可退数量后，系统按原订单酒店单价立即将退款计入酒店预存余额。
8. 酒店管理员和酒店操作员可使用预存余额购买平台商城商品；提交时同步校验并扣减库存与余额。

### 1.3 范围与使用约束

- 本文以当前系统为功能基线，覆盖已有页面、角色入口、操作规则和数据口径。
- 可补额度登记属于已有业务能力，通过“酒店与站点”的独立额度弹窗设置目标可补数量，不设置单独菜单。
- 司机端当前只读查看负责范围；厂内终端当前采用手工事件采集方式，不代表已经接通真实 RFID 设备。
- 本期不包含在线充值、自动支付、司机任务履约、工厂付款、商品编辑及上下架。删除仅用于符合第 3.7 节条件的基础资料，业务凭证与汇总不可删除。
- 组织建档、成员入口、账号基础维护及酒店、楼层、工厂站点和服务关系维护属于已确认范围；其他未确认目标能力不属于本文范围。

### 1.4 布草归属与待确认边界

- 布草品类为平台共用目录，不属于某一个站点；酒店售价按酒店和品类配置，当前工厂成本按洗涤厂和品类配置，同厂站点共用成本。
- 工厂拥有多个站点；酒店服务关系明确承接工厂及具体站点。订单保存下单时的工厂、站点、酒店地址和价格，履约沿用原单，不随之后改名或关系变更重新归属。
- 逐件布草的芯片资产归属、重复初始化、酒店绑定或换绑以及脏布草入库自动增加额度尚未形成完整业务闭环，当前不将品类选择或备货事件等同于实物绑定。
- 是否改为各站点独立成本价待确认；当前维持洗涤厂和品类口径，不由站点选择隐式改变历史价格。
- 司机本期没有签收或送达确认操作，送达由有权限的工厂人员确认。

### 2.4 组织与数据范围

- 酒店账号只能访问所属酒店的楼层、额度、订单、退款、账户和员工数据。
- 工厂账号只能访问所属洗涤厂的订单、退款、仓库、扫描、结算和报表数据。
- 司机只能查看分配给本人的负责范围。
- 平台角色可查看全平台业务数据，但具体写操作仍受角色权限限制。
- 工厂订单页面只显示工厂结算金额，不显示酒店扣款和平台毛利。
- 酒店小程序只显示酒店成交价格，不显示工厂成本和平台毛利。

## 3. 全局产品规则

### 3.1 登录、退出与会话

- Web 与小程序均使用业务账号和密码登录。
- 登录成功后按账号角色进入对应工作台。
- Web 账号不能进入酒店或司机小程序工作台；不适用的账号登录后返回登录页并提示使用 Web 管理端。
- 已登录用户再次进入系统时恢复当前会话；会话失效后返回登录页。
- Web 右上角显示组织名称、当前角色、用户头像缩写和用户姓名，并提供退出登录。
- 酒店小程序在“我的”页提供“退出登录”按钮；司机工作台顶部提供“退出”按钮，两者均直接退出，不弹出二次确认。
- 退出后结束本次会话，清除当前用户身份并返回独立的“业务账号登录”页；不能通过返回继续使用刚才的工作台。即使本次注销未成功，也清除本机登录状态并返回登录页。
- 退出后的登录页展示优洗通、账号与密码输入框、登录按钮及业务账号使用说明，不显示酒店底部导航。账号、密码初始为空，不提供角色选择器；账号提示“请输入平台开通的账号”，密码提示“请输入密码”并隐藏输入内容。
- 账号去除首尾空格后为空，或密码为空时，显示“请输入账号和密码”；登录中按钮禁用并显示等待状态，失败在表单内展示原因。重新登录后根据该账号角色进入酒店补充页或司机工作台，不继承退出前的商品选择。
- 登录说明为“首版使用已开通的业务账号。微信绑定及支付将在客户资质就绪后开放。”，不提供微信绑定或微信支付入口。

### 3.2 加载、空数据、错误与无权限

- 页面读取数据时显示加载状态。
- 列表无记录时显示对应业务空状态。
- 读取失败时显示简短错误原因和重新加载入口。
- 无页面权限时不显示菜单；通过外部地址进入时显示无权限页面。
- 提交失败时保留当前页面并显示可理解的失败原因。

### 3.3 列表、筛选与分页

- 酒店、洗涤厂和站点等已有档案均使用名称下拉选择，打开即可浏览候选，输入仅用于可选搜索，不要求输入编号，不允许以自由文本创建档案。候选为空时显示空状态；酒店和洗涤厂统一到“客户与组织”建档。业务页面保留字段标签、校验错误及必要操作确认，不展示原型、设计意图或规则讲解类文案。

- Web 业务订单和退污退款支持按状态查询，默认每页 20 条。
- 钱包流水按当前下拉选择的酒店自动展示，切换酒店立即生效；协议价格按酒店与工厂分别展示。
- 状态筛选为单选，除充值申请默认“待审批”并切换立即生效外，默认“全部状态”；选择或清空后点击“查询”生效，并回到第一页。提交后的自动更新保留当前筛选和页码；订单与退款页没有独立重置按钮；组织和用户管理提供重置。
- 钱包的酒店条件为名称下拉框，按所选酒店精确匹配，切换立即生效并回到第一页，无需点击查询。协议价格的两类组织相互独立，不使用酒店与洗涤厂的交集作为设置条件。
- Web 用户、业务订单、退污退款、钱包流水、商城订单和 RFID 扫描记录使用分页；其余通用资源页一次显示当前返回的全部记录，不提供可切换页容量或列头排序。
- 酒店补充订单、退污记录及厂内终端最近事件当前仅展示最近 20 条，不提供翻页或加载更多。酒店账户的充值申请与资金流水支持每页 20 条分页。不得将单页记录数视为历史累计总量。
- 所有页面不提供独立刷新按钮；进入页面自动加载，提交成功后自动更新相关列表、详情与统计。查询、重置及加载失败后的重试保留。
- 组织和用户使用专用管理页面，支持组织详情及账号维护；酒店与站点、洗涤厂与站点提供下述专用维护能力；未另行说明的通用资源页不提供详情、编辑、停用或批量操作；基础资料删除统一遵守第 3.7 节。

数据排序规则：

- 订单、退款、钱包流水、商城订单与扫描事件按各自创建或发生时间倒序；相同时间没有另行规定次级顺序。
- 组织按组织类型、组织名称升序；酒店按名称升序；价格和仓库按布草品类名称升序；商城商品按种类、名称升序；工厂结算按工厂名称升序。
- 未提供条件的页面不涉及用户筛选；单条详情和表单不涉及排序。

单对象详情展示规则：

- 组织资料、工厂基本信息及其他单对象摘要使用描述卡，字段标签与内容成对展示，普通空值显示“—”，状态清晰标注；不以只有一条记录的表格呈现。
- 成员、楼层、站点、订单明细等多条记录继续使用列表或表格，保留其已有操作、分页及空状态；不能为改成描述卡而隐藏真实明细。
- 只读详情不混入编辑表单；需要编辑的对象使用明确、独立的编辑入口，取消或关闭不修改资料。

### 3.4 金额、数量与状态

- 列表、详情、统计和小程序结算金额以人民币元展示并保留两位小数。线下充值填写“充值金额（元）”，必须大于零、最多两位小数，申请 12.34 元不改变余额，审批通过后充值流水和余额均按 12.34 元变化。协议价格和商品售价也统一以元输入：协议价允许零值，商品售价必须大于零，最多两位小数；界面不要求填写整数分。
- 布草和商品数量使用整数。
- 状态同时显示文字和颜色，不以颜色作为唯一识别方式。
- Web 与小程序保留各自当前状态文案：

| 业务状态 | Web 文案 | 小程序文案 |
|---|---|---|
| 等待工厂处理 | 已派单 | 待备货 |
| 工厂备货 | 备货中 | 备货中 |
| 已从工厂发出 | 配送中 | 配送中 |
| 履约完成 | 已送达 | 已完成 |
| 退款等待工厂确认 | 待处理（筛选项为“待确认”） | 待检测 |
| 退款同意 | 已同意 | 已退款 |
| 退款驳回 | 已驳回 | 已驳回 |

### 3.5 字段与提交的通用规则

- 展示规则：列表字段只读；空的普通文本及尚未确认的数量显示“—”，零金额和零数量保留为零。表单必填项按页面标记展示，初始密码使用密码输入。
- 交互规则：新增或设置操作打开表单；取消关闭表单，不保存输入。提交先校验必填项；提交中显示进度反馈；失败保留表单内容并展示原因，成功关闭弹窗并自动更新当前列表。
- 数据规则：账号和司机创建使用可搜索组织选择器；司机负责酒店从酒店清单选择。酒店服务关系、手工派厂、价格和钱包等表单使用名称下拉选择已有档案，可选搜索候选，并校验实际归属与有效性。姓名、地址、说明等表单字段不涉及筛选和排序；角色、类型为页面已有选项的单选，不允许自定义角色。
- 权限规则：无写权限用户不显示新增、设置和业务处理按钮；有权限但记录状态不允许操作时，列表操作区域显示“—”。
- 密码规则：所有创建账号入口统一使用下述初始密码规则；账号列表不显示密码。

### 3.6 创建账号与初始密码

- 适用范围：平台新增用户、酒店或工厂建档时创建管理员、新增司机、酒店管理员添加员工，以及平台重置密码。
- 展示规则：初始密码、确认初始密码均为必填，打开表单时为空，不预填固定密码；默认隐藏输入，允许显示或隐藏以核对内容。
- 密码规则：8～20 位，英文字母、数字、特殊字符三类中至少包含两类。大写和小写字母同属字母类；特殊字符指英文半角标点和符号。任何位置均不允许空格、中文、全角字符、换行或表情；系统明确报错，不自动删改用户输入。
- 校验规则：先检查初始密码是否合规，再检查确认密码是否填写且与初始密码逐字一致；校验失败保留表单并显示原因，不创建账号。
- 交互规则：提交中阻止重复提交；创建失败保留输入供修改，成功后关闭或清空表单并刷新账号数据。取消、关闭或重新打开表单后不保留密码。成功反馈不回显密码。
- 数据规则：初始密码由创建人手工设置；确认密码只用于当前表单核对，不作为账号资料保存。创建成功后，由创建人通过安全渠道告知使用者账号及初始密码；当前没有短信或邮件自动通知。
- 使用边界：现有账号继续按原密码登录；没有首次登录强制改密或找回密码入口。平台可按账号维护权限重置密码，并使目标账号原登录失效；不会自动重置其他存量密码。
- 验收标准：账号创建与重置入口均拒绝少于 8 位、超过 20 位、仅含单类字符、含空格或中文、确认不一致的密码；字母加数字、字母加特殊字符、数字加特殊字符或三类组合均可通过格式校验。失败不清空输入，成功或关闭后清空密码。不涉及密码筛选或排序。

### 3.7 基础资料删除

- 适用范围：平台管理员和平台运营可在组织、酒店、洗涤厂、工厂站点、楼层、账号、司机、商品及商品种类列表清理误建且无业务引用的资料。无权限角色不显示删除按钮；平台运营不能删除平台权限账号。
- 交互规则：逐条删除，不提供批量删除；确认前展示对象与影响，取消不变更。提交中禁止重复操作；遇引用、保护规则或对象已变化时拒绝操作并说明原因；成功关闭相关详情、刷新列表及关联候选，保留原筛选，无结果展示空状态。
- 引用保护：已有订单、资金流水、额度、扫描记录、协议价格或服务关系的组织不可删除。非零余额、成员有登录会话或历史业务操作的组织不可删除；无业务空组织可连同无业务成员、楼层、地址及零余额空账户清理，创建与删除记录仍可追溯。
- 单项保护：楼层已有订单不可删除；站点已有服务关系、订单或扫描记录不可删除；账号有登录会话、业务或操作历史不可删除，当前登录账号和最后一个启用管理员不可删除；平台组织不能删除。司机删除按账号规则，并同时清理其负责酒店分配。
- 商品保护：种类已被商品使用不可删除；商品已被商城订单使用不可删除。
- 保留范围：订单、退污退款、钱包流水、审计和扫描凭证不可删除；库存、结算、报表为汇总，不提供删除汇总行。协议价格继续通过调价维护；已有历史资料可使用适用的停用功能。
- 验收标准：无引用误建资料删除后各入口同步；带业务引用资料被拒绝且原数据不变；删除自己、平台组织及最后管理员均被拒绝；订单、资金与扫描记录继续可查。

## 4. 平台 Web

### 4.1 经营总览

- 仅平台管理员和平台财务显示。
- 展示合作酒店、待处理订单、待确认退款、累计充值、累计消费和工厂应付。
- 页面进入时自动加载，提交成功后自动更新相关数据；不提供独立刷新按钮，读取失败保留重试。
- 待关注事项当前不提供业务提醒记录，页面提示以各业务列表为准。

统计规则：

- 合作酒店：当前启用的酒店组织数量，按酒店计一次。
- 待处理订单：状态为已派单的订单数，不包含待派单、备货中、配送中或已送达。
- 待确认退款：尚未由工厂处理的申请数，按退款申请计一次。
- 累计充值：已入账充值流水金额之和，待审批和已驳回申请不纳入，历史已入账流水保留统计；累计消费：补充订单和商城订单扣款的正向累计额，不扣减退污退款，不等于净收入。
- 工厂应付：已派单、备货中、配送中、已送达订单的工厂成本总额；不同于仅统计已送达订单的“工厂结算”。
- 时间范围为截至本次读取的全部历史记录，无日期筛选；各记录按其业务记录计一次，不按明细重复计单。页面打开、查询或提交成功后自动重新读取，空汇总显示零，读取失败显示错误，不以零代替失败。

### 4.2 业务订单

- 支持按订单状态查询和分页。
- 列表字段：订单号、酒店、所属楼层、布草件数、酒店扣款、工厂结算、平台毛利、承接洗涤厂、状态、下单时间。
- 平台管理员和平台运营仅可对待派单订单执行派单。
- 派单时必须填写有效的承接洗涤厂和工厂站点。
- 已通过固定关系自动派发的订单不显示派单操作。
- 筛选选项为全部状态、待派单、已派单、备货中、配送中、已送达，按状态精确匹配。订单号和酒店名称只用于展示，不提供搜索。
- 派单弹窗展示所选订单号和酒店；工厂与站点从名称搜索结果中选择且必填，仅可选启用对象；站点随工厂联动，切换工厂清空原站点。取消不变更订单；成功后关闭弹窗、刷新当前页，原状态筛选下不再符合的记录不显示。

### 4.3 退污退款

- 支持按待确认、已同意和已驳回查询。
- 列表字段：退款单号、原订单号、酒店、申请件数、确认件数、申请退款、实际退款、原因和状态。
- 平台角色仅查看，不执行同意、驳回或资金处理。
- 默认显示全部状态，申请件数与申请退款为原申请值；待确认时确认件数为空、实际退款为零。部分同意后分别展示原申请数量和实际确认数量；驳回后实际退款为零。

### 4.4 客户与组织

#### 组织建档与成员入口

- 模块目标：“客户与组织”是酒店、洗涤厂统一建档、组织资料编辑与成员管理入口。创建时完成首个管理员配置；查看资料、成员管理和资料编辑分别进入独立界面。
- 列表入口：组织列表展示编号、名称、类型和状态；行操作分别提供“详情”“成员”“编辑”，受保护删除仍遵守第 3.7 节。点击名称或“详情”仅查看组织资料，点击“成员”打开独立成员弹窗，点击“编辑”打开独立资料表单，不共用混合详情页面。缺少启用管理员的存量组织显示“待配管理员”，不把它当作停用状态。
- 详情规则：以描述卡展示只读组织资料，包含编号、名称、类型和状态，酒店另展示区域和地址；空值显示“—”。不显示成员列表、新增成员、资料编辑或楼层维护操作。关闭详情保留组织列表查询条件；单对象资料不涉及筛选或排序。
- 筛选规则：组织名称为可清空文本，按名称模糊匹配；组织类型单选平台、酒店、洗涤厂，默认全部。条件取交集，点击查询或回车生效，重置清空条件。组织按类型、名称升序，同名按组织编号稳定排序。
- 建档步骤：从“新建组织”打开表单，在组织资料步骤选择酒店或洗涤厂，然后依次填写首个管理员、确认创建。酒店与洗涤厂均必须配置首个管理员；平台组织不提供普通新建入口。
- 字段规则：酒店名称、区域和地址必填，不填写酒店站点名称及楼层，也不强制选择承接站点。洗涤厂仅填写工厂名称，不填写首站点、区域或地址；站点资料从工厂列表“站点”入口独立维护。两类组织均必填管理员姓名、登录账号、初始密码及确认密码，角色只读为对应组织管理员。普通文本去除首尾空白，密码不裁剪；表单字段不涉及排序。
- 数据规则：酒店同时建立档案、零余额账户和管理员，不自动生成楼层；工厂仅建立组织和管理员，不自动生成站点。任一资料或账号校验失败，全部创建失败，不留下部分组织或账号。零站点工厂可正常建档，须另建启用站点并配置酒店承接关系后才能承接新订单。
- 交互规则：前后步骤保留已填资料；确认页展示组织名称、管理员姓名和账号，酒店另展示区域和地址，不展示密码。提交中禁止重复操作；失败保留表单并说明原因；酒店创建成功进入酒店详情，工厂创建成功进入组织详情。取消或关闭时清空密码。
- 资料编辑：平台管理员和平台运营从“客户与组织”列表的“编辑”打开独立表单，不从只读详情进入。酒店可修改名称、区域、地址和状态；洗涤厂可修改名称和状态，站点区域与地址仍在站点维护。组织编号和类型不可修改；平台组织不提供编辑入口，财务不显示编辑按钮。打开时读取最新资料；必填校验失败或保存冲突时保留输入并提示；取消不保存，提交中禁止重复操作，成功关闭编辑表单、刷新组织列表，下次打开详情展示最新资料。停用洗涤厂前必须调整或解除当前服务酒店关系，已有订单继续履约，恢复不重建已解除关系。
- 成员入口：组织列表“成员”打开独立成员弹窗，标题明确当前组织；弹窗内查看、筛选、新增及维护成员，所属组织固定且不可更改。存量缺管理员组织在成员弹窗补齐对应管理员，不自动生成密码或账号；关闭成员弹窗返回原组织列表，不进入组织资料详情。
- 数据与统计规则：成员按所属组织纳入，包含启用和停用账号；启用管理员只统计本组织对应管理员角色且状态为启用的账号，按账号去重，不受当前列表筛选或日期影响。成员变更后刷新成员弹窗、组织列表的管理员状态和相关账号列表，零成员显示零，读取失败显示错误及重试，不以零代替失败。
- 权限规则：平台管理员、平台运营可以创建酒店或工厂；成员维护范围按下述账号管理规则执行。无创建权限时隐藏新增入口，组织详情仍可只读查看。

### 4.5 酒店与站点

- 模块目标：维护酒店选品所属楼层、可补额度和承接站点服务关系，不承担酒店资料编辑或成员管理。楼层仅作为酒店内部选品归属标签，不是配送地址，不参与派厂、商品范围、价格、额度或结算。
- 列表展示规则：展示酒店名称、区域、酒店地址、状态、启用楼层数、承接工厂及站点；未关联显示“待配置”，与停用状态分别展示。酒店名称进入详情，关闭详情保留查询条件。
- 筛选规则：酒店为可清空下拉框，默认全部，候选来自“客户与组织”已建档酒店，可选按名称搜索，选定后精确匹配；状态单选全部、启用、停用；关联站点单选全部、已配置、待配置，默认全部，条件取交集。查询或回车生效并回第一页，重置清空条件；无结果提示调整条件，失败可重试。
- 数据规则：酒店按名称升序，同名稳定排序；楼层数仅统计当前酒店启用楼层，按楼层计一次，不受日期或其他酒店影响，维护后刷新；无楼层显示零。列表包含未配置承接站点的酒店。
- 组织来源：本模块不提供新建酒店；通过下拉框选择“客户与组织”已建档酒店后维护。
- 建档规则：“客户与组织”建档仅填写酒店名称、区域、地址及首个管理员姓名、账号、初始密码和确认密码；不出现楼层、酒店站点名称。允许暂不指定承接站点，成功进入酒店详情，不自动生成“默认楼层”。
- 详情边界：从酒店名称或列表“详情”进入只读详情，展示酒店信息、楼层信息及承接工厂和站点。酒店信息包含名称、区域、地址和状态；楼层展示名称、顺序和状态；无承接关系显示“待配置”。详情不包含资料编辑、成员管理、楼层维护、更换、解绑或删除操作；名称、地址及酒店启停用统一在“客户与组织”编辑。配送仍使用酒店地址，酒店停用不阻断旧订单履约和退款。

**酒店列表独立操作规则**

- 行操作按“详情、楼层、额度、更换、解绑、删除”分别展示；未配置承接关系时显示“配置”代替“更换”，不显示“解绑”。详情始终只读；财务仅可查看，不显示维护、解绑及删除操作。
- “楼层”打开独立楼层管理弹窗，固定当前酒店，提供原有新增、编辑、排序、启停用及受保护删除；不在此弹窗编辑酒店资料或承接关系。关闭返回列表，成功后自动更新楼层数及后续详情。
- “配置”或“更换”打开独立选择弹窗，固定酒店，选择启用工厂及其启用站点；切换工厂清空原站点。更换展示原承接对象，保存前明确只影响新订单；取消不修改，失败保留选择，成功关闭并自动更新列表。
- “解绑”打开独立确认，展示酒店及当前承接工厂、站点，说明解绑后新订单不可提交、旧订单仍按原关系履约。取消无变化；确认时校验最新关系，成功后列表改为“配置”，不再显示“解绑”。
- “删除”打开独立保护确认，不与解绑共用确认。展示删除对象，说明仅无业务引用基础资料可清理；订单、资金、额度、成员会话及其他历史引用仍按原保护规则阻止删除，不得自动解绑后强删。成功后自动更新列表，失败保留原数据并说明原因。
- 所有提交中禁止重复操作；只读详情不放置上述管理按钮，关闭各弹窗保留列表筛选。酒店信息及承接对象使用描述卡，楼层多条记录使用只读列表；无楼层显示空状态，读取失败不可当作无楼层或未配置关系。

**额度设置独立弹窗**

- 入口与权限：“酒店与站点”每行独立“额度”按钮打开当前酒店额度弹窗；平台管理员、运营可设置，平台财务只读查看。详情、楼层、额度、承接关系分别打开独立界面，酒店详情不放置额度编辑表单。
- 展示规则：固定酒店，逐项展示同时配置本酒店协议价与当前承接工厂成本价的启用布草品类、单位、当前可补数量；无额度记录按 0 展示。品类按名称排序，不涉及日期筛选，未配齐双价格的品类不列入额度弹窗；金额与可补件数不混用。
- 输入规则：选择布草品类后输入“目标可补数量”，必填非负整数，最大 2147483647，表示保存后希望得到的当前可补数量，不是增加数量。展示当前可补数量与目标数量，点击保存校验通过后直接生效，不打开差额确认页面或二次确认弹窗；取消不修改。
- 数据规则：额度归属于酒店和布草品类，酒店各楼层共用；更换工厂或站点不清零、复制或按工厂另设额度。目标值与当前值的差额追加至额度流水，保留操作记录，不覆盖历史订单、额度流水或价格。
- 冲突与反馈：提交中禁用重复操作；失败保留输入。同一次提交重复重试不能重复增减。若已被他人或订单更新，提示重新读取当前数量，由用户核对目标数量后再次点击保存，不自动重试覆盖最新额度。成功自动更新额度弹窗及相关酒店选品数据。
- 下单联动：启用品类同时配置当前酒店协议价、当前承接工厂成本价后才在酒店补充页可见，价格 0 属于已配置；缺任一价格不显示。无额度记录也应显示该品类，可补数量为 0，不能提交正数量；有额度不代替价格或有效服务关系校验。
- 验收：双价格齐全但无额度时可见且显示 0；补齐缺失价格后自动出现；设置目标 10 后显示 10，再设 6 仅追加 -4；点击保存直接生效；下单或其他人调整造成冲突时重读当前量后由用户重新保存；重试不重复入账；财务不能修改；更换工厂与楼层共用原酒店额度，历史流水不变。


- 楼层字段：名称必填，去除首尾空白；顺序为整数，数值越小越靠前，同序按名称排列；状态为启用或停用。只提供名称、顺序、状态，不配置地址、工厂站点、独立商品、价格或额度。
- 楼层操作：每次添加一个楼层，名称采用单行输入，不按逗号或换行拆分；支持改名、修改顺序、停用、恢复和删除；已有订单引用的楼层拒绝删除，可改用停用。列表包含启用与停用记录；同酒店内名称唯一，与已有启用或停用记录重名均明确指出并阻止保存；与停用项重名时提示恢复原楼层。
- 操作反馈：平台管理员和运营可维护楼层及服务关系；财务只读，不显示写操作。保存中禁止重复提交；失败保留输入；楼层或关系已被他人修改时提示重新打开加载最新资料后重试，不覆盖他人结果。楼层停用前确认对象及对新选品的影响，成功后自动更新详情与列表，修改记录可追溯。
- 承接关系：只从本模块列表进入独立配置、更换弹窗或解绑确认，不在详情中操作，也不设置独立“酒店服务关系”菜单。
- 验收标准：从“客户与组织”无楼层建档后可进入维护详情；维护模块只能选择已有酒店；酒店详情只读展示酒店、楼层和承接信息，所有维护操作从独立列表按钮进入；可筛选未关联酒店；单条添加重名明确报错；排序、停用与恢复同步影响选品候选，不改写旧订单所属楼层。

#### 承接站点配置

- 业务关系：工厂可以有多个站点，每家酒店最多关联一个承接站点，一个站点可服务多家酒店。平台统一维护关系。
- 展示规则：列表展示全部酒店，包括未配置酒店；字段包括酒店、酒店状态、承接洗涤厂、工厂站点和关联状态。未关联显示“待配置”，不展示酒店内部站点层级。
- 筛选规则：酒店名称下拉选择，可选搜索候选，酒店状态与是否关联站点单选，默认全部；条件取交集，查询回第一页，重置清空。按酒店名称升序；无结果展示空状态，读取失败可重试。
- 设置规则：酒店、工厂和站点通过名称下拉选择，打开即可浏览候选，输入仅用于可选搜索；从列表“配置”或“更换”进入时酒店预填且固定。仅可选择启用工厂及其启用站点，切换工厂必须清空原站点；候选为空时说明原因并引导维护。
- 操作规则：未配置酒店显示设置，已配置显示更换和解除。保存前确认酒店、原承接对象与新承接对象；解除前确认当前关系。明确说明仅影响新订单，已有订单保留原承接对象和成交价格。
- 数据规则：新补充订单使用提交时有效的服务关系自动派发；未配置承接工厂时无满足双价格的选品候选，提示联系平台配置承接关系；关系无效时下单不可用。恢复酒店、工厂或站点不自动恢复已解除关系。
- 权限与冲突：仅平台管理员、平台运营可写，财务只读。提交中禁止重复操作，失败保留选择；他人先修改时提示重新打开加载最新候选后重选，不覆盖新关系。成功后自动更新酒店列表、酒店详情和工厂服务酒店清单。

### 4.6 协议价格

- 展示规则：酒店协议价与工厂成本价分别展示；酒店价格列表仅展示酒店、布草品类和单价，工厂价格列表仅展示洗涤厂、布草品类和单价，不要求同时选择酒店与工厂。
- 权限规则：平台管理员和平台运营可设置价格，平台财务只读查看。
- 设置字段：价格类型、所属组织、布草品类和单价。默认价格类型为酒店协议价，仅显示酒店选择；切换为工厂成本价时仅显示洗涤厂选择，另一类组织不显示、不必填、不参与保存。
- 交互规则：组织与布草品类通过名称下拉选择；组织候选来自对应类型的启用档案，当前组织必选。切换价格类型保留布草品类和金额，仅按当前类型校验所属组织。取消不保存，校验失败保留输入，保存成功关闭弹窗并更新对应价格列表。
- 数据规则：酒店协议价按酒店与布草品类独立维护，工厂成本价按工厂与布草品类独立维护；更新一类价格不修改另一类价格，已生成订单保留成交价格。不涉及日期筛选，设置表单不涉及排序。
- 单价为必填的非负人民币元金额，最多两位小数，允许零值；未配置价格不视为零价。
- 验收标准：酒店协议价表单不出现洗涤厂选择，工厂成本价表单不出现酒店选择；连续切换类型后仅保存当前类型与所属组织的价格。

### 4.7 洗涤厂与站点

- 入口规则：工厂操作列分别提供“详情”和“站点”，各自打开独立弹窗。详情只读工厂及站点信息，不包含新增、编辑、停用或删除；站点管理只处理当前工厂的站点。工厂删除统一到“客户与组织”，不得放回本模块操作列。
- 站点管理：固定当前工厂，展示多条站点与原有管理操作，站点删除继续执行引用保护及独立确认。无站点显示空状态；财务只能查看，维护按钮按原权限隐藏。取消无变化，提交防重，成功后自动更新列表及后续详情。

- 展示规则：工厂列表通过下拉框选择“客户与组织”已建档洗涤厂，可选按名称搜索，并支持状态筛选，默认全部，条件取交集；工厂按名称升序。工厂列表操作列仅提供独立“详情”“站点”入口。详情以只读描述卡展示工厂基本信息，以只读列表展示站点名称、区域、地址、状态和服务酒店，不包含站点管理操作；“站点”打开独立管理弹窗。工厂基本信息不得使用单行数据表格模拟详情。
- 字段规则：工厂名称必填，状态为启用或停用；新增站点名称、区域、地址必填，默认启用。站点从当前工厂读取，服务酒店只统计当前关联该站点的酒店，按酒店去重；零酒店显示零或“暂无服务酒店”，读取失败不当作零。
- 操作规则：本模块不提供新建洗涤厂，缺少档案时到“客户与组织”建档。本模块详情只读展示工厂及站点信息，不提供“编辑资料”“管理员与成员”或工厂删除入口；工厂资料、成员和工厂删除统一在“客户与组织”。平台管理员和运营在独立站点管理弹窗新增、编辑、停用、恢复及删除站点；删除遵守第 3.7 节，有服务关系、订单或扫描记录时拒绝删除。财务只读。表单保存中禁止重复提交，失败保留输入，成功后自动更新详情；遇同时修改冲突需重新打开加载最新资料后重试。
- 停用规则：工厂或站点仍有服务酒店时，必须先调整或解除关系，展示受影响酒店。停用后停止新业务，但既有订单继续查询、履约和退款，不自动改派。
- 历史规则：新订单记录当时的酒店名称、所属楼层、工厂、站点及酒店地址，后续改名或改地址不改变历史展示；原有订单补齐历史资料只能反映补齐时可得资料，不能保证还原更早时点。
- 验收标准：一厂多站点、一站点多酒店正确展示；候选按工厂联动；设置、更换、解除后各入口一致；有服务酒店不能停用，解除后可停用和恢复，恢复不重建关系；旧订单承接对象、价格和地址保持不变。

### 4.8 司机负责范围

- 列表字段：司机、登录账号、所属组织、负责区域、负责酒店、分配数和状态。
- 平台管理员和平台运营可新增司机并分配首家酒店。
- 新增字段：所属平台或工厂、登录账号、初始密码、司机姓名、负责区域和首家负责酒店。组织与酒店使用可搜索选择器，从组织成员入口进入时所属组织预填只读。
- 当前 Web 没有单独追加或移除负责酒店的页面操作；删除司机按第 3.7 节账号保护规则执行，成功时一并清理其负责范围。

### 4.9 钱包与流水

- 模块范围与权限：仅平台管理员和平台财务显示，可登记线下充值申请、核验银行流水并审批；平台运营无入口。酒店管理员从小程序提交本酒店申请，不提供在线支付。已有资金流水不可修改或删除。
- 展示规则：默认选择首家已有酒店（演示为云栖酒店），选择酒店后展示独立的当前余额、充值申请与资金流水。申请列表展示充值业务 ID、申请金额、原始付款参考号、核验银行流水号、审批状态、备注、审批意见与时间。资金流水展示关联业务 ID、审批状态、银行流水号、类型、变动金额、变动后余额、摘要和发生时间；历史无审批记录显示“历史记录（无审批信息）”，不补造申请、审批状态或关联编号。
- 申请金额：必填元金额，初始为空，必须大于零且最多两位小数；金额展示保留两位小数。超精度、零值、负值或非金额内容拒绝提交，不自动四舍五入；审批时申请金额只读。不涉及独立金额筛选或排序。
- 原始付款参考号：酒店申请不提供输入且允许为空；Web 兼容登记仍必填，记录中有值时只读保留，不能被核验银行流水号覆盖。核验银行流水号：审批通过时必填，驳回时不要求；两类编号均仅去首尾空白，保留前导零和分隔符，不按数字处理。尚未核验显示“待核验”，不涉及编号筛选或排序。
- 关联编号与审批状态：充值业务 ID 在申请成功后生成且只读；入账流水仅审批通过后产生，内部流水编号不在界面展示。待审批和已驳回无入账流水，显示“尚未入账”；状态只允许待审批转为已通过或已驳回，终态不可改判。编号来自当前业务与真实入账记录，不涉及单独筛选或排序。
- 操作规则：登记成功只生成待审批申请，提示等待审批，余额与账本不变。仅待审批显示审批操作；通过须绑定核验银行流水号，驳回须填写原因，通过意见选填。提交中禁用重复操作，失败保留输入并显示原因；成功自动更新申请、流水与余额，保留适用筛选。已通过、已驳回只读，不提供批量审批。
- 数据规则：申请及流水限定所选酒店；审批状态单选默认为“待审批”，选项为全部、待审批、已通过、已驳回，与酒店条件取交集，切换酒店或审批状态立即生效并回到第一页，不提供独立重置按钮。申请按创建时间倒序，流水按发生时间倒序分页，默认每页 20 条，无日期或流水类型筛选。无结果分别显示“暂无充值申请”“暂无流水”，读取失败提示重试，不能按零余额解释。
- 防重与统计规则：同一申请内容重试返回原申请，内容冲突拒绝；重复审批不重复入账，同一核验银行流水号不得跨申请或跨酒店再次入账，历史银行号也不得重新核销。仅通过审批的申请一次性增加余额并产生唯一关联流水，驳回不入账。累计充值以已入账流水去重汇总，包括历史已入账记录，排除待审批和驳回；申请和审批成功自动更新，空值为零、异常读取提示重试。
- 验收标准：提交 12.34 元后产生业务 ID 和待审批状态，余额不变；财务绑定“000123-01”通过后余额恰增 12.34 元，两端业务 ID、银行号和状态一致。驳回原因两端可查且不入账；相同申请、重复审批和跨酒店重复银行号不增加第二笔流水；历史无审批流水不可标为已审批。

### 4.10 工厂结算

- 列表字段：工厂组织编号、洗涤厂、已送达订单和结算金额。
- 结算金额按已送达订单中的工厂成本汇总。
- 每家工厂一行，未送达订单不计入；没有已送达订单的工厂数量和金额为零。退污退款当前不会冲减该汇总，金额不代表已付款或扣除退款后的净应付。
- 当前页面仅提供汇总查看，不提供账单生成、核对、开票或付款操作。

### 4.11 商城商品与商城订单

商城商品：

- 权限与入口：仅平台管理员和平台运营显示，提供新增商品、种类管理与受保护删除；财务不显示。当前没有商品编辑或上下架操作。
- 列表字段：商品名称、种类、商品说明、统一售价、可售库存、状态和删除操作。列表只返回可售商品，包含零库存商品，按种类、名称升序；无记录展示空状态，失败可重试。
- 商品种类展示规则：商品表单必填单选下拉，默认未选择；候选仅来自种类管理，可按名称搜索，不允许通过输入新名称直接成为商品种类。无候选时引导先维护种类；已选种类失效后必须重选。
- 种类管理交互规则：管理弹窗仅展示种类列表、删除和“新增种类”入口，不将名称输入框嵌入列表。点击新增打开独立弹窗，名称必填，去除首尾空白，最多 80 个字，重复名称拒绝保存；取消不新增，成功关闭新增弹窗并自动更新种类列表及商品候选。列表按名称升序，不提供改名、日期筛选或统计；已有商品使用的种类不可删除并说明原因。
- 商品图片展示规则：选填，提供“上传图片”，选择本地 PNG 或 JPEG 文件，文件不超过 1MB；成功显示预览，并可更换或移除。不提供图片地址输入；未选择时商品使用占位图。
- 图片交互规则：选择失败或文件不符合要求时提示原因并保留原图；图片处理中禁止商品保存，完成后再提交；更换只更新当前表单图片，移除后回到未选择状态。图片字段不涉及筛选或排序。
- 其他字段与校验：名称、说明、统一售价和初始库存必填；售价输入明确标注“统一售价（元）”，必须大于零且最多两位小数，列表按元展示；初始库存为大于零的整数。取消不新增商品，保存中禁止重复提交，失败保留输入。
- 删除规则：商品无商城订单引用时可删除，有订单引用时拒绝删除；成功后自动更新商品及种类选择候选，被引用种类在商品清理完成前仍不可删除。
- 验收标准：空种类不能保存商品；先建种类后可在下拉选中，不能自由输入代替选择；本地选图可预览、更换、移除；被商品使用的种类、被订单使用的商品均不可删除。

商城订单：

- 所有平台角色均可查看。
- 列表字段：商城订单号、商品明细、商品件数、订单金额、状态和下单时间。
- 当前页面只读。

### 4.12 用户与权限

#### 用户、角色与账号维护

- 关系规则：一个账号属于一个组织、具有一个固定角色。组织决定基础数据归属，角色决定业务操作；司机负责酒店属于业务分配，与所属平台或工厂分别展示。无跨组织任职、多个角色、自定义权限或账号迁移；账号与司机删除遵守第 3.7 节保护规则。
- 展示规则：用户列表展示姓名、登录账号、所属组织、组织类型、中文角色、状态和创建时间；账号、组织只读，密码不展示。角色说明展示职责、使用端与数据范围；空的普通文本显示“—”。
- 筛选规则：姓名或账号共用文本搜索，任一字段模糊匹配即命中；组织、角色、状态为可清空单选，默认全部，多个条件取交集。角色来自固定角色目录；状态为启用、停用。点击查询或回车生效并回第一页，重置清空全部条件；自动更新保留条件。用户每页默认 20 条，按创建时间倒序，同一时间按账号编号稳定排序；无结果提示调整条件。
- 所属组织：新增时必填、可按名称搜索选择，仅可向启用组织添加账号；组织列表的独立成员弹窗入口预填只读。切换组织后清除原角色，再选择该组织及当前操作者允许分配的角色，不保留非法组合。
- 角色选项：平台可选平台管理员、平台运营、平台财务；酒店可选酒店管理员、酒店操作员；洗涤厂可选工厂管理员、工厂操作员、工厂财务。平台和工厂另可创建司机，但必须进入包含负责酒店的司机创建流程；酒店不可创建司机。
- 新增字段：姓名、全局唯一登录账号、角色、初始密码和确认密码必填。组织从选择结果取值；登录账号不可与任何存量启用或停用账号重复。新建账号初始为启用；酒店最多 10 个启用账号，包含管理员。
- 司机规则：所属组织仅平台或工厂；首家负责酒店与负责区域必填，酒店从酒店清单中选择。创建账号与首家酒店分配共同成功或失败，不能只建没有负责范围的司机账号。既有司机可修改姓名、启停用或重置密码，不允许转换为其他角色；其他角色也不可直接改为司机。
- 维护入口：列表统一通过“维护账号”打开弹窗，“维护内容”可选“姓名、角色与状态”或“重置密码”。组织成员在独立成员弹窗内沿用用户列表的姓名或账号、角色、状态筛选及分页，固定所属组织且不展示组织筛选。
- 姓名维护：预填现值、必填，保存后同步更新相关列表；登录账号和组织不可编辑。
- 角色调整：仅可在同组织内选择合法角色。确认时展示原角色、新角色及职责变化，提示该账号需重新登录。禁止降低自己的管理员角色；禁止把组织最后一个启用管理员改为其他角色。
- 启停用：按当前状态显示停用或启用，停用前确认目标及登录失效影响。禁止停用自己或组织最后一个启用管理员；恢复酒店账号时重新校验 10 人上限，停用账号不占启用名额。
- 重置密码：手工填写新密码与确认密码，沿用统一密码规则；提交前确认将结束该账号现有登录，成功不回显密码，由操作人通过安全渠道告知使用者。新密码不会自动启用停用账号，不提供找回密码、强制首次改密或自动通知。
- 会话规则：停用、角色变化或重置密码成功后，账号原登录全部失效；恢复启用不恢复原登录，需重新登录。仅修改姓名不强制退出。
- 操作反馈：无维护权限隐藏操作按钮；已知的自身或最后管理员限制禁用并显示原因，提交时仍校验最新状态。提交中阻止重复保存；取消不修改资料；失败保留输入并说明冲突原因；成功后自动更新用户及组织成员数据，不再符合筛选的账号从当前结果移除。无批量操作。
- 权限规则：平台管理员可维护全平台账号；平台运营仅可维护非平台角色账号，既不能维护已有平台角色，也不能授予平台角色。平台财务只读。酒店移动端保留原有成员查看与创建能力，本轮不增加工厂自主管理入口。
- 数据保护：最后管理员、酒店名额限制以同一组织最新结果判定，同时操作不能突破约束。账号变更可追溯记录操作者、对象和变更，不记录明文密码。
- 验收标准：建档后可立即查看管理员并继续配人；组织预填和角色联动正确；重复账号、非法角色、越权、名额已满及最后管理员冲突均失败且无部分保存；改角色、停用或改密后原登录失效；财务只能查看；空、加载失败、保存失败都有明确反馈。

## 5. 洗涤厂 Web

### 5.1 经营总览

- 展示待处理订单、备货中订单、待确认退款和工厂应收。
- 数据范围仅限当前洗涤厂。
- 页面进入时自动加载，提交成功后自动更新相关数据；不提供独立刷新按钮，读取失败保留重试。
- 待关注事项当前不提供业务提醒记录。
- 统计规则：待处理订单仅统计本厂已派单订单，备货中仅统计备货中订单，待确认退款仅统计本厂待确认申请；工厂应收汇总本厂已派单至已送达订单的工厂成本。均为全部历史截至读取时的结果，无日期筛选，页面进入、查询或业务提交成功后自动重新统计；无记录显示零，读取失败展示错误。

### 5.2 业务订单

- 支持按订单状态查询和分页。
- 列表字段：订单号、酒店、所属楼层、布草件数、工厂结算、状态和下单时间。
- 不显示酒店扣款、平台毛利和其他工厂数据。
- 工厂管理员和工厂操作员可按唯一顺序更新进度：已派单进入备货中，各品类累计备货与计划数量一致后才能出库进入配送中，配送中进入已送达。未备齐时拒绝出库并说明原因，不改变订单状态；工厂财务无操作权限。
- 当前状态不满足下一步要求时不得更新。
- 工厂财务仅查看，不显示更新操作。
- 更新弹窗展示所选订单、酒店及唯一可用的下一状态，下一状态只读。用户确认后更新，取消不改变状态；不支持跳步、回退或批量履约。

### 5.3 退污确认

- 仅工厂管理员和工厂操作员显示。
- 列表字段：退款单号、原订单号、酒店、申请件数、确认件数、原因和状态。
- 页面不显示申请退款和实际退款金额。
- 待确认申请可同意或驳回。
- 同意时可填写不超过申请件数的确认数量，因此支持部分同意。
- 驳回时确认数量为零且必须填写原因。
- 已处理申请再次提交不同结果时必须拒绝。
- 同意弹窗默认确认数量等于申请件数，允许修改为 1 至申请件数的整数，核验备注选填。驳回弹窗不填写确认数量，原因必填。提交成功关闭弹窗并自动更新列表；在“待确认”条件下已处理申请移出当前结果。

### 5.4 布草与仓库

- 仅工厂管理员和工厂操作员显示。
- 列表字段：布草编号、布草品类、累计入库、累计备货和当前可用。
- 数量由当前洗涤厂的首次芯片入库与租赁备货事件汇总。
- 当前页面只读，不提供仓区或货架维护。
- 统计规则：按当前有效布草品类分行；累计入库为首次芯片入库事件数量之和，累计备货为租赁备货事件数量之和，当前可用为累计入库减累计备货。只统计已保存的本厂事件，不按订单状态增减，没有日期筛选；无事件品类显示零。当前没有库存不足拦截，结果可能为负值，按实际汇总展示。

### 5.5 RFID 扫描记录

- 仅工厂管理员和工厂操作员显示。
- 列表字段：采集事件编号、工作模式、关联订单、布草品类、识别数量、采集方式和提交时间；首次入库不关联订单时显示“—”。
- 只展示已经由系统确认保存的事件。
- 当前页面只读；扫描事件在非微信厂内终端提交。

### 5.6 工厂结算与业务报表

工厂结算：

- 展示当前工厂编号、名称、已送达订单数和工厂结算金额。
- 仅使用订单中的工厂成本，不显示酒店销售金额或平台毛利。

业务报表：

- 展示累计订单、已送达订单、布草总件数和工厂应收。
- 当前没有日期、站点、酒店或布草品类筛选。
- 累计订单和布草总件数包含本厂全部订单状态；已送达订单只计履约完成的订单；工厂应收沿用经营总览口径，包含已派单至已送达订单。当前报表与结算汇总不是同一个统计范围。

## 6. 酒店管理员微信小程序

### 6.1 补充下单

- 展示规则：顶部展示优洗通、酒店名称、账户记录入口、可补总量、精确余额和余额状态。布草品类展示名称、酒店单价、单位及当前可补数量；底部显示已选总件数和预计扣款。
- 楼层规则：只读取当前酒店启用楼层，按维护顺序、名称排列。有启用楼层时默认第一项，刷新优先保留仍有效的当前选择；没有启用楼层时隐藏切换入口，正常选品与下单，所属楼层为空，不自动创建默认楼层。
- 交互规则：所有楼层共用酒店商品、价格和额度；切换仅改变本次选品所属楼层，保留已选品类和数量。数量初始为零，使用加减操作，最小零、最大不超过该品类可补数量；布草按名称排列，不提供按楼层单独的商品或价格筛选。
- 提交规则：未选布草、额度或余额不足、酒店停用、承接关系无效时不能下单，并明确原因。无承接站点时展示承接关系缺失原因，暂不提供补充选品候选；具备启用楼层时必须选择有效楼层，无启用楼层时可直接无楼层下单。
- 状态变化：所选楼层在提交前被停用时保留选品内容，提示刷新并重新选择，不静默替换；刷新后已无启用楼层时，须经用户确认才无楼层提交。更换账号不继承其他酒店或用户的草稿。
- 操作反馈：提交中禁止重复操作；失败保留草稿；成功进入新订单详情。重复提交同一内容返回原订单，不重复扣额度或余额。
- 数据规则：额度属于酒店与品类，楼层不独立核算；可补总量为本酒店全部品类剩余额度之和，预计扣款为已选数量与当前酒店单价乘积之和，不涉及日期筛选。切换楼层不改变单价、额度或所选数量。
- 验收标准：无楼层酒店可浏览、下单并查看订单；添加楼层后显示切换，切换保留数量和合计；排序、刷新保留、提交前停用、无可用楼层确认及跨酒店楼层均按规则处理。

### 6.2 订单列表与详情

- 订单页包含“补充订单”和“退污记录”两个页签。
- 补充订单字段：订单号、下单时间、状态、所属楼层、品类摘要、总件数和订单金额。
- 点击订单进入详情。
- 订单详情展示当前状态、订单号、下单时间、所属楼层、酒店地址、承接站点、布草名称、原单价、数量、小计、合计件数和合计金额。
- 已送达且仍有可退数量的订单显示“申请部分退污”。
- 默认显示补充订单，两个页签切换当前已读取的数据；无订单与无退污分别显示空状态。无楼层统一显示“未指定”；配送使用酒店地址。详情金额、酒店、楼层、承接工厂站点和地址沿用订单记录，不随后续资料或价格调整变化。

### 6.3 退污申请与记录

- 退污只能从已送达订单进入。
- 每次申请只能选择一个订单明细品类。
- 页面展示的可退数量为原订单数量减去已退款数量；提交时还需扣除待确认申请已占用的数量，因此已有待确认申请时，可能收到剩余可退数量不足的提示。
- 必须选择申请数量并填写退污原因。
- 页面按原订单酒店单价计算预计退款金额。
- 提交后返回订单页，可在“退污记录”查看退款单号、关联订单、状态、申请或确认数量和金额。
- 增加另一品类的申请数量时，清空此前品类的选择；每次仅提交一个品类。原单价只读，原因最多 200 字；未选数量或未填原因时点击提交提示补全，提交中禁用按钮。
- 待检测与已驳回记录展示申请数量和申请金额，不能解读为实际已退款；已退款记录展示工厂通过数量和实际退款金额。当前列表不显示工厂核验备注。

### 6.4 账户与账单

- 权限与范围：仅酒店管理员可进入，提交和查看当前酒店充值申请；酒店操作员、司机、工厂角色无申请或审批权限，不可切换至其他酒店账户。
- 展示规则：顶部余额卡下直接展示充值金额输入、可选备注与提交按钮，不另开申请弹窗，不要求填写付款参考号。账户记录采用紧凑列表，默认仅展示中文业务类型或审批状态、金额与时间，点击单条记录展开详情。
- 表单规则：金额以元填写且大于零、最多两位小数，备注选填，初始为空。输入校验失败保留内容并提示原因；提交中禁用重复操作；提交成功清空表单、显示待审批并自动更新记录，不提示到账，不改变余额。
- 记录规则：待审批和已驳回申请保留可查；已通过申请与已展示的对应入账流水合并为一条；对应流水尚未展示时保留已入账摘要，不能遗漏该笔记录。展开详情只读展示充值业务 ID、核验银行流水号、可选历史付款参考号、审批说明及备注；编号保留前导零和分隔符，空值显示占位。未入账申请只显示申请金额，不展示虚构的变动后余额或入账流水；驳回原因可查，终态不可编辑。历史无审批信息的流水保留历史标识，不伪造已审批状态。
- 数据规则：仅取当前酒店申请与流水，账户记录按申请时间或流水发生时间合并倒序展示，每页 20 条；不涉及酒店或金额筛选。账户区域无任何记录时显示“暂无账户流水”，读取失败提示重试，余额不可从当前分页流水推断；进入账户与申请提交成功后自动更新相关数据。
- 验收标准：酒店提交后等待财务核验审批；通过后账户余额及唯一入账流水自动对应，驳回不入账且原因可见，重复提交不重复建单。Web 与小程序展示一致的充值业务 ID、审批状态、银行号，不提供在线支付成功流程。

### 6.5 易耗品商城

#### 6.5.1 页面入口与范围

- 酒店管理员和酒店操作员从底部“商城”进入，底部导航固定为“补充、订单、商城、我的”，商城处于选中状态。
- 当前账号未开通商城权限时，点击商城提示“当前账号未开通商城权限”，保留当前页面；司机没有商城入口。
- 页头展示“酒店易耗品”和“全平台统一售价 · 库存以提交时校验为准”，下方以双列商品卡展示平台商品。
- 当前仅提供商品浏览、逐件选购、确认提交及提交结果，不提供商品搜索、种类筛选、商品详情、独立购物车、收货地址填写、优惠券、在线支付或商城历史订单入口。酒店订单页仍只承载补充订单与退污记录。

#### 6.5.2 商品字段与数据规则

- 图片、种类、名称与说明：均只读，展示平台维护的内容；有图片时展示图片，无图片时展示礼品占位图。种类作为卡片标签，不作为可点击筛选项；名称、说明不打开商品详情。
- 统一售价：每张卡展示人民币单价，保留两位小数；酒店间使用同一商品售价，不使用酒店布草协议价。
- 库存：每张卡展示“库存 N 件”，零库存商品仍可显示；该数值为本次读取时的库存，最终购买以提交时重新校验为准。
- 状态：正常可售商品显示数量加减控件；若当前商品数据为不可售状态，则显示“暂不可购”并替代加减控件，不能调整该商品数量。
- 取数规则：读取平台当前可售商品，排除已下架商品；每次进入商城重新读取。按种类、名称升序排列，相同种类及名称不另行规定次级顺序。
- 筛选规则：不提供用户筛选、排序切换、分页或日期条件，种类与名称只影响默认排序。

#### 6.5.3 选购数量与金额合计

- 数量展示规则：每种商品初始为 0，以减号、当前数量、加号展示，不提供手工输入。
- 数量交互规则：每次增加或减少 1 件，最小为 0；减至 0 后继续减少仍为 0。增加后超过当前库存时不改变数量，并提示“库存仅剩 N 件”；库存为 0 时增加同样提示。
- 选择仅属于本次商城页面；切换到底部其他页面后重新进入，重新从 0 开始，不保存跨页购物车或跨账号选择。
- 合计展示规则：存在已选商品时，在底部导航上方展示“已选 N 件”、合计金额与“提交订单”按钮；全部减至 0 时整条结算区域隐藏。
- 统计规则：总件数为本页当前商品中已选数量之和；合计金额为各商品当前售价乘以已选数量后求和，以人民币元显示两位小数。只计算本次选择，不包含其他页面草稿、历史订单或历史消费，不涉及时间筛选。
- 刷新规则：数量变化立即重新计算件数与金额；商品重新加载后按本次返回的商品及售价计算。提交前合计属于本次选购展示，最终金额按提交时的有效售价计算。

#### 6.5.4 确认、提交与结果

- 点击“提交订单”打开“确认商城订单”弹窗，正文为“共 N 件，合计 ¥金额。”，提供取消与确认。
- 取消仅关闭弹窗，保留所选商品、数量与合计；确认后提交。提交过程中按钮显示等待状态并禁用，不能再次从该按钮发起提交。
- 校验规则：酒店必须启用；商品必须仍存在且可售、数量不得超过实时库存、酒店预存余额必须足够。提交按当时有效商品价格结算，不由页面显示的金额决定扣款。
- 成功规则：生成已支付商城订单，同次完成库存扣减、酒店预存余额扣减和对应商城消费流水。清空全部已选数量，重新读取商品与库存，隐藏结算区域。
- 成功反馈：展示标题“订单已提交”、正文“订单号 商城订单号”的结果弹窗，仅提供确认；确认后仍在商城，不跳转补充订单或不存在的商城订单详情。
- 失败反馈：显示具体失败原因，例如商品不存在或已下架、某商品库存不足、预付余额不足；保留选择并恢复提交按钮，不展示成功订单号。提交校验失败不产生部分扣款或部分库存扣减。
- 重复处理规则：同一次提交不得生成重复订单、重复扣库存或重复扣款；相同提交身份对应不同商品或数量时应拒绝。不能将再次手动点击提交理解为对任意历史订单自动去重。

#### 6.5.5 加载、空状态与验收

- 加载中显示加载状态；读取失败展示实际失败原因及“重新加载”按钮，点击后重试读取商品。
- 无可售商品时展示“暂无在售商品”和“商品由优洗通平台统一配置”，底部导航仍可使用。
- 验收标准：管理员与操作员均可进入；图片缺失使用占位图；零库存不能增加、数量不能为负；加减联动件数与金额，清空选择隐藏结算栏。
- 验收标准：取消确认保留选择，确认中禁用提交；成功显示商城订单号、清空选择、刷新库存，失败保留选择并展示原因；不可售、库存或余额不足均不能创建有效订单。
- 验收标准：页面不出现分类筛选、搜索、详情、独立购物车及其他未开放入口；重新进入商城不恢复上一次页面的选购数量。

### 6.6 员工账号

- 仅酒店管理员可进入。
- 展示姓名、登录账号、角色和状态。
- 酒店管理员可添加酒店操作员。
- 新增字段：姓名、登录账号、初始密码和确认初始密码；密码按第 3.6 节统一校验。
- 当前酒店最多有 10 个启用账号。
- 登录账号不能与已有账号重复。
- 当前页面没有编辑、停用或删除员工操作。

### 6.7 个人中心

- 展示用户姓名、所属酒店和当前身份。
- 显示账户与账单、员工账号和退污记录入口。
- 底部提供独立的“退出登录”按钮；点击直接按第 3.1 节退出并进入业务账号登录页，不使用仅提示退出成功或只切换角色的替代行为。

## 7. 酒店操作员微信小程序

### 7.1 当前可用能力

- 与酒店管理员共用补充下单、订单列表、订单详情、退污申请、退污记录、易耗品商城和个人中心。
- 补充页显示精确钱包余额和酒店协议单价。
- 可使用预存余额提交补充订单和商城订单。

### 7.2 当前受限入口

- 个人中心仍显示“账户与账单”和“员工账号”。
- 点击账户与账单时提示当前账号无权限，不进入资金流水。
- 点击员工账号时提示当前账号无权限，不进入员工列表。

## 8. 司机微信小程序

- 司机登录后直接进入本人负责范围。姓名、区域及酒店数量以当前司机分配数据展示，不写死演示数量；酒店条目只读，长名称和地址换行，空列表不显示虚构酒店。加载失败可重新加载，成功后清除错误状态。
- 顶部展示“司机工作台”、司机姓名和“退出”入口；点击直接按第 3.1 节退出并进入业务账号登录页。
- 负责范围按区域分组。
- 区域展示区域名称和酒店数量。
- 酒店条目展示序号、酒店名称；存在数据时同时展示酒店地址和服务点。
- 无负责酒店时提示联系优洗通运营人员调整。
- 当前页面不提供业务操作按钮。
- 数据规则：分组来源为当前司机负责范围；酒店条目按配置顺序、酒店名称排列。区域酒店数取该分组条目数，序号在区域内从一开始；不提供搜索、状态或日期筛选，也不涉及订单数量统计。

## 9. 非微信厂内终端

### 9.1 使用边界

- 当前移动端页面仅向工厂操作员开放；工厂管理员通过 Web 查看扫描记录，没有厂内终端的移动入口。事件登记业务授权同时覆盖工厂管理员与工厂操作员，不能将页面入口范围等同于全部业务授权范围。
- 页面采用与微信小程序一致的竖屏移动端比例和单栏操作结构，不使用宽屏侧栏工作台。
- 顶部展示所属洗涤厂和“终端工位”，工作模式在内容区顶部横向切换。
- 微信小程序中不开放厂内终端；进入时提示使用非微信厂内终端并返回登录页。
- 非微信终端提供芯片登记和订单备货两个工作模式。

#### 使用边界与设备信息

- 厂内终端只保留“芯片登记”和“订单备货”两个模式；当前为人工登记，硬件尚未接入，不显示扫描成功或在线设备状态。
- 所属工厂只读，站点从本厂权限范围内下拉选择。采集方式只读展示“人工登记（设备未接入）”，没有已配置设备目录时不虚构设备选项、不要求填写设备编号、厂商或协议。后续有真实设备档案时，优先按设备名称下拉选择并展示后台配置资料。
- 资料中的归属公司与规格应由后台统一配置；本期仅展示已存在的归属与品类资料。未确认的规格、设备认证、厂商协议、断网补传均不作为已完成能力。

#### 芯片登记

- 展示并必选有效站点、启用布草品类；芯片号使用必选单选下拉，不允许手动输入；默认提示“请选择演示芯片”，不预选。内置“演示芯片 01 · DEMO-RFID-001”“演示芯片 02 · DEMO-RFID-002”两条信息，按编号升序展示，仅供原型演示，不代表真实硬件读取。数量只读固定为 1，一次记录一个芯片。
- 不选择酒店、订单，不要求操作员填写批次或设备资料。提交记录归属当前工厂与站点，不代表实物已经绑定酒店，也不自动增加酒店可补额度。
- 目前记录登记事件，不具备逐件芯片资产台账、跨批次重复初始化保护或库存生命周期核验。

#### 订单备货

- 必选本站点已派单或备货中的订单，选项展示订单号、酒店名称；随后从原订单明细下拉选择品类，只填写本次数量，不填写芯片号。展示所选品类计划数量，本次数量必须为正整数。
- 同一订单允许多品类、分批登记。累计有效数量不得超过对应原单计划，跨厂、跨站、非订单品类、配送中及已送达订单均不能新增备货。停用站点或品类仅保留原有待备货订单履约。
- 所有品类备齐后，工厂有权限的人员才能确认出库，再确认送达；登记本身不自动改变订单状态。下单绑定服务工厂和站点，订单保存目标酒店；事件关联订单不等于逐件布草资产已绑定酒店。

#### 批次、反馈与异常

- 批次由系统自动生成并只读展示。首次提交锁定本批内容，失败保留相同内容及批次重试；不确定结果不能靠更换批次重复登记。同厂同批次同内容只记一次，改动内容后不能复用原批次。
- 必填项不完整、无有效候选或提交中禁用提交；错误说明保留，成功更新记录并为下一次登记准备新批次。最近记录展示模式、批次、关联订单（有则展示）、时间、数量及人工登记方式；按时间倒序，空记录显示“暂无登记记录”，失败提供重试。业务凭证不提供删除。
- 当前履约链路为首次登记、酒店下单、本站点订单备货、出库配送、送达。脏布草回收、卸货区设备扫描、洗涤入库、酒店额度自动恢复的闭环尚未实现；不能将事件数量汇总解释为实物库存已核实。

#### 布草分类与选择范围

- 当前已配置布草品类完整清单为：床单、被套、浴巾、方巾、地巾、面巾、内枕套、外枕套，计量单位均为“件”。八类为平级品类，内枕套与外枕套分别选择，不合并为枕套。新增五类不自动获得酒店协议价、工厂成本或酒店额度；配置完成前不得下单。历史订单及价格快照保持原样，运行时以平台实际启用目录及酒店配置为准。
- 当前品类只有名称、单位、图片和启停状态，不按尺寸、材质、颜色、等级建立子分类。归属洗涤厂及站点来自账号和后台档案；规格资料、额外品类需先由业务确认并配置，不能让操作员自由填写或新增，也不能把尚未配置的规格作为可选项。
- 布草品类与易耗品商城种类相互独立；商城种类管理不改变布草目录，不能混用两套候选。

| 使用场景 | 下拉候选与展示规则 |
|---|---|
| 酒店补充下单 | 同时配置当前酒店协议价与当前承接工厂成本价的启用品类；无额度记录按 0 展示，零额度不能提交正数量 |
| 酒店协议价、工厂成本价 | 平台启用的布草品类；价格按所选酒店或工厂分别配置，不从商城种类选取 |
| 酒店额度设置 | 同时配齐本酒店协议价与当前承接工厂成本价的启用品类；无额度记录显示 0，缺价格先补价格 |
| 首次芯片登记 | 平台启用品类；显示名称和单位，操作员不得输入品类编号或自由新增 |
| 订单备货 | 所选本站点待备货订单的原单品类；原单品类后来停用仍可履约，不纳入订单外品类 |
| 退污退款 | 原订单明细及剩余可退数量；沿用历史名称和价格，不改选现行目录其他品类 |
| 工厂仓库 | 汇总当前启用品类，含零事件数量；历史扫描记录保留可追溯，停用品类不因此删除历史事件 |

- 普通品类下拉按名称排序，订单与退款按原单明细顺序展示；切换站点或订单时清空不再适用的选择。空候选显示原因并禁用提交，不用手工文本替代缺失选项。多个筛选条件按交集生效。

## 10. 当前业务规则

### 10.1 可补额度

- 可补额度按酒店和布草品类记录。
- 平台管理员或平台运营可按酒店、布草品类设置目标可补数量，差额追加记入流水。
- 同一酒店与业务引用对同一布草品类重复登记时不重复增加额度。
- 下单时按每个布草品类分别扣减额度。
- 任一品类额度不足时整笔补充订单不生成。

### 10.2 补充订单与预存余额

- 酒店管理员和酒店操作员均可提交补充订单。
- 下单至少包含一个大于零的布草品类数量。有启用楼层时必须选择所属酒店的有效楼层；无启用楼层时允许不指定楼层。
- 每个品类必须同时存在酒店协议价和承接工厂成本价。
- 酒店必须启用且配置有效承接工厂与站点，工厂及站点也须启用；未配置承接工厂时无选品候选，关系无效时不能下单。
- 下单金额为各品类数量乘以酒店协议单价后求和。
- 账户余额不足时不生成订单、不扣额度、不扣余额。
- 成功下单时，订单创建、额度扣减和余额扣减作为同一次业务处理完成。
- 同一提交标识重复提交相同内容时返回原订单，不重复扣款；提交不同内容时拒绝。

### 10.3 订单履约

- 新订单在服务关系有效时直接进入已派单状态。
- 只有待派单异常订单可由平台管理员或平台运营重新指定工厂和站点。
- 工厂履约状态必须依次从已派单进入备货中、配送中和已送达；所有订单品类累计备齐后才能出库，缺少任一品类均拒绝进入配送中。配送中及已送达后不得追加备货，重复提交既有相同批次不重复计数。
- 工厂管理员和工厂操作员可更新状态；工厂财务只读。

### 10.4 退污与退款

- 酒店管理员和酒店操作员均可申请退污。
- 仅已送达订单可申请。
- 每次申请关联一条订单明细。
- 申请数量不能超过原数量扣除已有有效申请后的剩余数量。
- 有效占用数量为待确认申请的申请件数加已同意申请的确认件数；已驳回申请不占用额度，部分同意未通过的件数不继续占用可退数量。
- 工厂管理员和工厂操作员可全部、部分同意或驳回。
- 同意数量大于零时，退款金额按原订单酒店单价计算并立即增加酒店预存余额。
- 驳回不产生资金变动。
- 退款和余额入账作为同一次业务处理完成。

### 10.5 商城订单

- 酒店管理员和酒店操作员均可下单。
- 商品必须处于可售状态，购买数量不能超过当前库存。
- 商城金额按商品统一售价乘以数量求和。
- 酒店预存余额不足时不生成商城订单。
- 成功提交时，商城订单创建、库存扣减和余额扣减作为同一次业务处理完成。
- 同一提交标识不得产生重复订单或重复扣款。

### 10.6 价格与结算口径

- 平台价格页同时展示酒店协议价和工厂成本价。
- 酒店订单与小程序只使用酒店协议价。
- 工厂订单与结算只使用工厂成本价。当前成本按洗涤厂和品类配置，同厂各站点共用；是否按站点独立定价待确认，本期不改变既有价格。
- 平台订单同时展示酒店扣款、工厂结算和两者差额。
- 工厂结算只汇总已送达订单的工厂成本。

## 11. 当前验收标准

### 11.1 角色与导航

- 每个测试账号登录后进入与其角色匹配的首个页面。
- Web 菜单与本文权限矩阵一致。
- Web 右上角展示组织、角色和用户姓名，用户菜单可执行退出登录。
- 酒店“我的”页与司机工作台退出均无需二次确认，退出后展示空账号、空密码的业务账号登录页且没有酒店底部导航；返回不恢复已退出工作台，注销失败也清除本机身份。重新登录按实际账号角色进入工作台。
- 酒店与工厂账号不能查看其他组织的数据。
- 酒店、工厂建档均配置首个管理员，失败无部分保存；工厂不填写首站点和地址，不自动建站；组织列表通过“成员”打开独立弹窗添加成员，“详情”只读，“编辑”独立表单，用户列表按条件交集查询。
- 平台运营不能维护原有平台角色或授予平台角色；财务只读；最后管理员、自己停用、酒店启用名额限制不可绕过。
- 改角色、停用和重置密码后原登录失效，组织成员与用户列表保持一致。
- 工厂订单不显示酒店扣款和平台毛利。

### 11.2 补充订单

- 酒店建档不出现楼层及酒店站点名称；无楼层可浏览、下单、查询及重复提交。
- 添加楼层后出现切换，切换保留品类数量，价格和额度不变；刷新保留有效选择。
- 楼层排序、单条添加重名、停用恢复、提交前停用及跨酒店归属校验正确；无楼层统一显示“未指定”。
- 加减数量不能突破零和该品类可补数量。
- 金额与件数随数量变化正确更新。
- 额度不足、余额不足、价格缺失或酒店服务关系缺失时不生成订单。
- 成功下单仅生成一笔订单、一次额度扣减和一次余额扣减。
- 重复提交相同内容不会重复扣款。

### 11.3 履约与退款

- 工厂订单只能按既定顺序推进至已送达。
- 工厂财务不能更新订单状态。
- 酒店只能对已送达订单的剩余可退数量发起退污。
- 工厂可部分同意，确认数量不能超过申请数量。
- 驳回必须填写原因且不改变酒店余额。
- 同意后酒店余额按原订单单价和确认数量正确增加。

### 11.4 账户与商城

- 酒店管理员按元申请充值，平台管理员和平台财务登记或审批申请；12.34 元申请不入账，通过审批后余额恰增 12.34 元，银行号保留前导零及分隔符，跨酒店同银行号不可重复入账，已审批申请不可改判。
- 酒店管理员可查看资金流水；酒店操作员进入该入口时收到无权限提示。
- 商品种类必选，种类管理与商品选择同步；图片通过本地文件选择并可预览、更换、移除；未选择图片时使用占位图。商城提交时再次校验库存和余额。
- 商城采用双列商品卡，字段与第 6.5 节一致；零选择隐藏结算栏，取消确认保留选择，提交失败保留选择；成功显示订单号并清空选择、刷新库存。
- 商城成功下单仅生成一笔订单、一次库存扣减和一次余额扣减；不提供商城历史订单、商品详情或独立购物车入口。

### 11.5 工厂数据与终端

- 仓库页面按事件汇总累计入库、累计备货和当前可用数量，不能解释为逐件实物库存已核实；终端分批、多品类备货正确累计，缺任一品类均不能出库。
- 工厂财务不显示仓库、扫描和退污菜单。
- 厂内终端以竖屏移动端比例展示，工作模式、事件表单和最近事件按单栏顺序排列。
- 只有工厂操作员账号拥有厂内终端移动页面入口；此入口规则不改变已有的工厂管理员事件登记业务授权。
- 微信小程序不允许进入厂内终端。
- 厂内终端的芯片登记在未选择内置演示芯片时不能提交，数量固定为 1。
- 同厂相同采集事件编号重复提交相同事件不会生成重复记录；改订单、品类或数量后复用编号须拒绝。跨厂、跨站、非订单品类、超量备货和出库后追加均拒绝。

### 11.6 页面状态

- 关键页面具备加载、空数据、错误重试和无权限状态。
- 列表筛选、自动加载和分页可正常使用，页面不出现独立刷新按钮，失败重试保留。
- 翻页适用于本文列明的 Web 分页列表及酒店移动端充值申请、资金流水列表；其他移动端最近 20 条列表不验收为全量历史检索。
- 关键提交操作具有禁用、确认、成功和失败反馈。

### 11.7 酒店、楼层和服务关系

- 酒店下拉选择、状态、关联站点筛选取交集，包含待配置酒店；酒店和洗涤厂统一从“客户与组织”建档，维护模块只能选择已有组织；楼层单条添加，允许删除无订单引用的误建楼层；有订单引用时拒绝删除。
- 工厂多站点和站点服务酒店完整展示；工厂与站点名称联动，更换工厂清空旧站点。
- 关系配置、更换及解绑成功后，酒店列表和再次打开的只读详情保持一致，仅影响新订单；没有关系时提示配置承接站点，不提供补充选品候选且不能下单。
- 酒店、工厂和站点停用不阻断旧订单履约、查询及退款；有服务酒店的工厂和站点不能直接停用，恢复不重建解除的关系。
- 同时编辑发生冲突时不能覆盖他人结果；新下单使用提交时有效的楼层、状态及关系，不出现部分成功。
- 新订单名称、酒店地址与价格保留原记录；改名、改址及服务关系变更不改写既有订单。
- 财务仅能查看酒店、楼层、工厂站点与服务关系；终端只选择本厂站点，停用站点仅用于已有订单允许的租赁备货。

### 11.8 详情、成员与编辑入口

- “客户与组织”列表分别打开只读详情、独立成员弹窗和独立编辑表单；关闭后保留列表筛选，取消编辑不保存，成员操作不改变组织资料。
- 组织详情仅展示组织资料，不含成员列表、新增成员或编辑按钮；成员权限、最后管理员与删除保护沿用原规则。
- “酒店与站点”列表独立提供详情、楼层、额度、更换、解绑、删除；未配置时显示配置且无解绑。详情只读酒店信息、楼层信息、承接工厂与站点；详情不含维护按钮。酒店资料编辑统一在“客户与组织”完成。
- 工厂基本信息及类似单对象详情使用描述卡，多条站点、楼层和成员明细仍保留列表或表格。

- 工厂入口验收：分别点击“详情”“站点”，详情只读工厂及站点信息，站点管理独立弹窗；本模块无工厂删除按钮，站点删除保留在站点管理且有引用保护，工厂删除从“客户与组织”执行。

### 页面加载、种类弹窗与金额统一规则

- 所有页面不提供独立“刷新”按钮。进入页面自动加载，保存、删除、充值等业务提交成功后自动更新相关列表、详情、余额及统计，保留适用的筛选与页码；查询、重置、分页以及读取失败后的重试仍可使用，不要求用户为看到提交结果手动刷新。
- 种类管理列表与新增种类表单分开：管理弹窗显示列表、删除及新增入口，新增入口打开独立名称表单。提交中禁止重复操作，取消不新增；成功返回管理列表并自动更新候选，失败保留输入，原有种类引用保护不变。
- 所有价格及金额输入以人民币元为单位，最多两位小数，包括酒店协议价、工厂成本价、商城售价和充值到账金额；酒店协议价和工厂成本价允许 0，商城售价及到账金额必须大于 0。拒绝负数、超两位小数和非金额内容，不静默四舍五入；列表、详情与统计均以元显示两位小数。
- 平台“钱包与流水”展示所选酒店余额、充值申请、关联业务 ID、银行流水号和审批状态，只有平台管理员、平台财务可查看、登记申请并审批；平台运营不显示该模块和登记审批入口，不因其他资料维护权限取得资金权限。
- 酒店管理员可在本酒店账户提交线下充值申请，查看余额、申请审批结果、关联业务及资金流水；申请不等同入账，不提供在线支付成功流程。酒店操作员继续沿用既有补充页余额展示权限，不取得账户流水权限。
- 验收：协议价 0.00 元可保存，商品价与充值 0.00 元被拒绝；12.34 元输入、列表和余额变化一致；超两位小数不被舍入接受。财务或管理员审批通过后自动更新钱包及对应流水，银行号前导零与分隔符保留；运营无资金入口。各页面无独立刷新按钮，查询及失败重试仍有效。
