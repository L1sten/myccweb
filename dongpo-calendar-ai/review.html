  <textarea id="prdMdSource" style="display:none"># 《东坡行旅日历》一期产品需求文档

> 文档状态：首发版需求基线  
> 最近更新：2026 年 9 月 14 日
> 目标上线：2026 年 9 月 15 日挑战目标；正式上线时间同时受客户验收与微信平台前置条件约束  
> 适用对象：产品、设计、研发、测试、内容编辑及业务验收人员  
> 时间口径：除特别说明外，均以北京时间为准

## 1. 产品概述与本期边界

### 1.1 产品背景

《东坡行旅日历》微信小程序以实体日历为入口，将每日诗词阅读、AI 对话、苏轼生平行旅、用户身份和持续互动连接起来。用户可先以游客身份浏览今日、行旅和问东坡；完成微信登录后获得唯一“苏粉”身份，并可围绕每日诗句进行听、藏、问、签、游和分享。

首发版目标是跑通“一码入东坡、每日可读可聊、行旅可探索、身份可沉淀”的核心闭环，为后续内容运营和产品迭代建立稳定的用户与行为基础。

### 1.2 产品目标

- 让实体日历用户扫码后快速感受到“每日一句 + AI 东坡”的核心价值。
- 建立与微信用户绑定的唯一苏粉身份，持续沉淀积分、收藏、签到和勋章。
- 通过每日内容、签到与积分机制促进日常打开和持续使用。
- 通过眉山至儋州的行旅地图，将苏轼生平、作品和真实地点连接起来。
- 支持诗句海报、苏粉名片分享，形成自然传播入口。

### 1.3 用户角色

| 用户角色 | 角色说明 | 主要诉求 |
| --- | --- | --- |
| 实体日历购买者 | 通过日历页二维码进入小程序的用户 | 查看对应日期内容、获得苏粉身份、持续签到 |
| 东坡文化爱好者 | 对苏轼诗词、生平、典故感兴趣的用户 | 听诗、收藏、提问、浏览行旅内容 |
| 行旅城市游客 | 身处东坡行旅城市或计划前往的用户 | 查看城市文化内容、实地打卡、获得勋章 |
| 后台运营人员 | 使用 Web 基础管理后台维护一期基础数据 | 管理日历、行旅、推荐问题、用户列表和登录账号 |

### 1.4 核心使用场景

1. 用户扫描实体日历某一页二维码，以游客身份查看内容，或完成微信登录后建立苏粉身份。
2. 用户直接打开小程序，查看当天诗句并完成听诗、收藏、提问和签到。
3. 用户进入行旅地图，查看 18 个地点的文化详情，并在真实地点完成定位打卡。
4. 用户进入“我的”，查看苏粉身份、积分等级、珍藏、签到记录和勋章。
5. 用户生成诗句海报或苏粉数字名片，保存到相册或分享给微信好友。

### 1.5 本期范围

- 游客浏览、微信登录与唯一苏粉身份。
- 实体日历二维码日期识别。
- 今日一句、吟诵、收藏、诗句海报。
- 问东坡自由提问与推荐问题。
- 每日签到、行为积分、五级苏粉成长体系和等级名片视觉。
- 2D 行旅地图、12 个篇章与 18 个地点、城市详情、真实定位打卡和城市勋章。
- 我的身份、徽章、行旅、珍藏、签到记录和数字名片。
- 用户业务数据跨设备同步。
- Web 基础管理后台：日历内容、行旅文化内容、推荐问题、用户查询导出和后台账号。

### 1.6 非本期范围

- 亲子共读、儿童界面、诗词闯关和小游戏。
- 多东坡形象、语音提问和数字人视频对话。
- 苏粉广场、用户发帖、评论、点赞及内容审核。
- 会员、商城、积分兑换、AR 导览、票务和酒店预订。
- 积分消耗、兑换商城和用户自选名片主题。
- 对外开放的技术接口、数据表设计和部署方案。
- 用户增长、日活、留存、运营趋势、内容排行和城市排行。
- 多级审核、操作记录、历史版本、人工积分调整、补签和打卡修正。
- 地图点位编辑、后台角色与权限配置、独立素材库、自建 AI 知识库、超过近七天的问答历史和后台问答正文查询。

### 1.7 关键约束

- 游客可浏览今日诗句、行旅地图和问东坡；收藏、签到、积分、苏粉等级、名片、勋章及跨设备同步仅对微信登录用户开放。
- 每页二维码可识别实体页日期且不与扫码用户形成独占关系；二维码日期不替代首页首次展示的北京时间今天。
- 所有每日次数、连续签到和积分防重均按北京时间自然日计算。
- 首次打开首页始终展示北京时间今天；用户可从今天翻阅后台全部已发布日期，不受年份、元旦或真实今天限制。
- 原型中的 105 积分、连续签到 3 天和珍藏 6 篇仅为演示数据，生产新用户初始积分为 0。

### 1.8 正式版数据基线

- 正式版小程序与 Web 管理后台共用同一套日历、行旅、推荐问题、用户身份和互动数据；后台发布结果在小程序刷新后生效。
- 微信登录用户的展示名称、头像、苏粉编号、入籍日期、积分、签到、收藏、问答和行旅点亮结果长期保存，并在同一用户跨设备登录时保持一致。
- 正式版不得以浏览器本地演示数据替代用户真实数据；网络异常时可保留最近一次有效展示，但不得把未确认的本地结果当作已同步结果。
- 运营导入的内容默认进入草稿；只有已发布内容可进入小程序，且同一日期始终只有一条线上内容。

## 2. 用户角色和核心使用流程

### 2.1 首次扫码流程

1. 用户扫描实体日历页二维码。
2. 小程序识别二维码对应的实体页日期，但首页首次展示仍以北京时间今天为准。
3. 未登录用户可继续游客浏览，也可发起微信登录。
4. 微信登录成功后生成或读取唯一苏粉编号，并记录首次入籍日期。
5. 小程序首次打开首页展示北京时间今天；用户可从首页翻阅全部已发布日期。
6. 用户浏览其他日期后可点击“回到今天”，恢复北京时间当天页面。

### 2.2 直接打开流程

1. 用户从微信最近使用或分享入口打开小程序。
2. 未登录用户以游客身份进入；需要苏粉权益时再发起微信登录。
3. 首页展示北京时间今天；今天无已发布内容时展示准确日期和当天空状态。
4. 用户可通过底部导航进入今日、行旅、问东坡和我的。

### 2.3 每日互动闭环

1. 用户查看今日诗句。
2. 用户完整听完吟诵，首次获得 5 积分。
3. 用户收藏诗句或生成诗句海报。
4. 用户向东坡提问，当日首次成功提问获得 5 积分。
5. 用户完成每日签到，获得 10 积分。
6. 用户可生成并分享苏粉名片，当日首次成功分享获得 20 积分。
7. 所有结果同步至“我的”。

### 2.4 行旅打卡闭环

1. 用户进入行旅，地图默认展示 18 个地点的全貌。
2. 用户点击任一地点浏览文化详情；所有地点均可发起定位打卡。
3. 用户在真实城市点击“到此打卡”，阅读定位用途说明。
4. 用户授权定位并完成距离与精度验证。
5. 验证成功后点亮城市、记录打卡结果并获得专属勋章。
6. 用户可前往“我的徽章”查看已获得的行旅勋章。

## 3. 全局交互、登录、日期、权限、空状态和异常规则

### 3.1 页面入口与导航

- 底部主导航固定为“今日 / 行旅 / 问东坡 / 我的”。
- 今日、行旅、问东坡、我的四个一级页面展示底部导航。
- 珍藏详情、签到记录、城市详情和分享弹层不重复展示底部导航，使用明确的返回或关闭操作。
- 切换一级页面时保留用户已完成的登录、积分、收藏、签到、打卡和勋章状态。
- 返回“今日”时展示当前生效日期，不保留二维码历史日期。

### 3.2 游客身份与微信登录

**游客状态：**

- 展示规则：游客名称为“游客 + 随机数”，我的页面展示登录引导，不展示苏粉编号、积分、等级、名片、徽章和个人记录。
- 交互规则：游客可浏览今日、行旅和问东坡；触发收藏、签到、打卡、名片等身份权益时引导微信登录。
- 数据规则：游客随机名称仅用于本次未登录身份展示，不生成苏粉编号，不沉淀苏粉权益。

**微信登录：**

- 点击登录后进入处理中状态，处理中不可重复点击；成功后生成或读取苏粉身份。
- 同一微信用户只生成一个苏粉编号；重复登录读取原身份和全部用户数据。
- 微信登录不将微信昵称作为产品展示名称；新身份使用系统默认展示名称，既有身份读取当前已保存的展示名称和头像。
- 登录用户可在“我的”直接修改展示名称，也可点击头像后选择微信头像、从相册上传或拍照；头像操作不修改展示名称，以上操作均不改变苏粉编号。
- 用户取消或登录失败时保留游客浏览状态，并提供重新登录入口。

### 3.3 日期规则

**当前浏览日期：**

- 展示规则：日期页展示日、月、星期、公历和农历，不额外展示用于区分今天或往日的日期类型标签。
- 交互规则：首次打开显示北京时间今天；左滑进入下一个已发布日期，右滑进入上一个已发布日期；页面不展示上一页、下一页操作栏。浏览非今天日期时，在日历纸页左侧中部竖向显示“回到今天”。
- 数据规则：
  - 翻页序列包含后台全部已发布日历日期，按日期升序排列；草稿、已下线和未配置日期不进入序列。
  - 不设置年份、元旦或真实今天的翻页上限；已发布的过去和未来日期均可浏览。
  - 北京时间今天始终作为首页日期页；今天无已发布内容时，以临时空状态插入翻页序列，可继续进入最近的上一条或下一条已发布内容。
  - 应用启动、重新进入前台及北京时间跨日时重新计算今天；用户停留在原今天页时自动切换至新日期，主动浏览其他日期时不强制跳转。
  - 当前浏览内容被下线后重新计算翻页序列并回到今天。

**无对应内容：**

- 日期有效但内容缺失时，不展示其他日期内容替代。
- 今天无已发布内容时显示“今日内容暂未发布”，不使用其他日期内容替代。
- 空状态禁用收藏、听诗和生成海报；签到、问东坡和苏粉名片入口继续可用。

### 3.4 全局操作反馈

| 状态 | 产品规则 |
| --- | --- |
| 默认 | 按钮显示明确动作名称；可用操作保持可点击 |
| 处理中 | 按钮显示处理中反馈并禁止重复提交 |
| 成功 | 使用轻提示或结果区说明操作结果，并即时刷新关联数据 |
| 失败 | 保留原数据，说明失败原因，并在可重试场景提供重试入口 |
| 重复操作 | 不重复产生积分、签到、收藏或勋章记录；明确提示已完成 |
| 数据同步中 | 本地页面可继续浏览，涉及新增数据的操作避免重复提交 |
| 同步失败 | 保留用户本次操作结果并提示稍后重试；恢复后重新同步 |

### 3.5 权限与可见性

| 权限 | 触发时机 | 拒绝后的影响 |
| --- | --- | --- |
| 微信登录授权 | 游客主动登录或使用苏粉权益 | 保持游客浏览，可重新发起登录 |
| 头像选择能力 | 登录用户在“我的”主动点击当前头像，并选择微信头像、相册或拍照 | 保留当前头像，不影响展示名称、苏粉身份和数字名片，可重新选择 |
| 位置权限 | 用户在已解锁城市主动点击“授权定位并验证” | 不能完成城市打卡，可继续浏览城市内容 |
| 相册权限 | 用户保存诗句海报或数字名片时 | 不保存图片，可重新授权或改用微信分享 |
| 微信分享能力 | 用户点击分享诗句海报或数字名片时 | 不发放分享积分，保留当前分享内容 |

### 3.6 全局空状态与异常状态

- 首次加载失败：展示重新加载，不进入错误的默认数据。
- 登录身份读取失败：停留在登录后加载状态，避免生成重复苏粉编号。
- 用户数据为空：分别展示无收藏、无签到、无勋章的引导，不使用演示数据填充。
- 跨设备同步失败：展示最近一次有效数据，并明确“同步未完成”。
- 网络恢复后刷新当前页面关联数据，不改变用户所在页面和已输入但未提交的内容。

## 4. 首页日历

### 4.1 模块目标与页面结构

首页日历是首页核心内容，页面按以下顺序组织：

1. 产品名称与苏粉身份入口。
2. 日期信息。
3. 当日诗句、作者和出处。
4. 收藏与分享操作。
5. 吟诵播放。
6. 问东坡、签到和苏粉名片入口。

### 4.2 关键字段规则

**日期信息：**

- 展示规则：展示日、月、星期、公历和农历，不展示日期类型标签。
- 交互规则：日期字段只读，不提供日期选择器；用户通过左右滑动翻页。浏览非今天日期时，日历纸页左侧中部竖向显示“回到今天”；当天页面不显示该操作。
- 数据规则：按第 3.3 节当前浏览日期精确读取，与翻页序列同步。

**诗句正文：**

- 展示规则：展示编辑团队确认并发布的诗句，不截断；同时展示作者和完整出处。
- 交互规则：正文只读，可用于生成海报；内容缺失时禁用相关操作。
- 数据规则：每个日期在小程序中最多展示一条已发布内容；同日存在多条候选时只读取当前已发布记录。日期之间不要求连续、不限制句子是否相同，也不按年份区分内容类型。

**翻页与纸张动画：**

- 向后翻页时当前纸页向左滑出并轻微旋转、淡出，新纸页从右侧进入；向前翻页方向相反，完成翻页动画约 280ms。
- 手指横向拖动时纸页实时跟随位移，并同步调整旋转、阴影和透明度；达到页面宽度约 18% 或快速甩动时完成翻页，否则约 180ms 回弹。
- 首尾边界使用阻尼与回弹，不进入空白页；动画期间锁定重复翻页并提前准备相邻内容，避免白屏、日期闪烁和内容重叠。
- “回到今天”跨越多个已发布日期时只播放一次方向正确的翻页动画，不逐日播放。
- 系统开启“减少动态效果”时取消旋转和手势跟随，仅保留短暂淡入淡出。
- 动画仅作用于日历纸页，顶部身份栏和底部问东坡、签到、苏粉名片入口保持稳定。

**AI 吟诵：**

- 展示规则：默认显示“听东坡吟诵”；未播放时不显示进度，播放后显示进度。
- 标识规则：正式上线版本中，吟诵内容由人工智能生成时，播放入口和播放区域均显示“AI 生成音频”；当前原型尚未实现该标识，不得将原型状态描述为已完成。
- 交互规则：支持播放、暂停和继续；暂停保留进度；播放完成后恢复未播放状态并隐藏进度。
- 数据规则：系统调用成熟大模型朗诵当前日历内容对应作品，不由运营人员上传音频。仅完整播放完成计为有效听诗，切换日期时停止原朗诵并重置进度；听诗奖励始终按北京时间自然日判断，与浏览日期无关。

**收藏状态：**

- 展示规则：未收藏为空心书签，已收藏为实心书签；不额外显示“收藏诗句”文字。
- 交互规则：点击切换收藏/取消收藏；处理中禁止重复点击；成功后同步更新我的珍藏数量。
- 数据规则：同一用户、同一日历内容只保留一条有效收藏；收藏时间采用操作成功时间；珍藏列表按收藏时间倒序。

### 4.3 吟诵操作与积分

| 操作状态 | 按钮状态 | 结果与反馈 |
| --- | --- | --- |
| 未播放 | 可点击“听东坡吟诵” | 开始播放并显示进度 |
| 播放中 | 可点击暂停 | 暂停并保留当前进度 |
| 已暂停 | 可点击继续 | 从原进度继续播放 |
| 播放完成 | 恢复未播放 | 当日首次完整听完奖励 5 积分 |
| 朗诵生成或加载失败 | 提供重试 | 不计为听诗完成，不发积分 |
| 当日重复听完 | 正常播放 | 不重复发积分，必要时提示“今日听诗积分已领取” |

### 4.4 诗句海报

**海报内容：**

- 展示规则：包含日期、诗句、作者、出处和产品标识；内容必须与当前生效诗句一致。
- 交互规则：首页右上角收藏与分享按钮并列；用户点击分享后生成预览，可选择保存图片、分享微信好友或分享到朋友圈。
- 数据规则：仅使用当前浏览页已确认发布的诗词与海报素材；海报生成不新增收藏，不发放积分。不涉及筛选与排序。

**保存与分享：**

- 保存前请求相册权限；成功后提示保存完成，失败时保留预览并支持重试。
- 分享好友与朋友圈均通过微信分享能力完成；Web 原型提供结果模拟和真实图片下载。
- 分享失败或取消不改变收藏和积分状态。
- 诗句海报分享不计入“分享数字名片 +20 积分”任务。

### 4.5 空状态与异常状态

- 今天诗句缺失：显示“今日内容暂未发布”，禁用收藏、吟诵和海报操作，保留其他首页入口与翻页能力。
- 朗诵服务不可用：诗句仍可阅读和收藏，播放入口显示暂不可用并可重试。
- 收藏失败：保持原收藏状态，不提前更新珍藏数量。
- 海报素材缺失：保留诗句阅读和收藏，海报入口显示暂不可用。

### 4.6 验收标准

- 首次打开、左右滑动、回到今天、跨日和已浏览内容下线时，日期规则符合第 3.3 节；页面不展示独立翻页操作栏或日期类型标签。
- 已发布日期跨年度、位于过去或未来时均可正常翻阅；今天无内容时日期准确、空状态正确且仍可翻到相邻内容。
- 快速甩动、未达阈值回弹、首尾阻尼、重复翻页锁定和减少动态效果符合规则，顶部身份栏及底部功能入口在动画中保持稳定。
- 未播放时不出现进度；播放、暂停、继续、完成状态正确。
- 当日仅首次完整听完发放 5 积分，失败和重复播放不重复发放。
- 收藏状态与我的珍藏实时一致，重复收藏不产生重复记录。
- 海报内容与当前诗句一致，可完成保存或微信分享。

## 5. 问东坡

### 5.1 模块目标与边界

问东坡调用成熟大模型提供 AI 文化对话体验，支持推荐问题、自由输入，以及在当前聊天界面回看本人近七天的成功问答。首发版不自建知识库，不提供语音提问、多人会话、人工专家咨询、历史主动删除或超过近七天的问答查询。模块提供文化问答、作品解读及基于苏轼人生经历的一般性生活启发，不以情感陪伴、虚拟亲属或伴侣、心理咨询为服务目标，不建立跨会话情绪画像、关系养成或主动召回用户开展持续情感互动；后续如新增相关能力，须重新进行合规与安全评估。

### 5.2 页面结构

- 东坡身份与“内容由 AI 生成”说明。
- 近七天历史问答与当前会话组成的连续消息流。
- 按北京时间自然日展示的日期分隔。
- 首轮推荐问题。
- 自由输入框和发送按钮。
- 加载、失败和安全拒答反馈。

### 5.3 字段规则

**推荐问题：**

- 展示规则：每次进入页面从后台状态正常的问题中随机选择 3 个展示；用户在本次进入后发送第一条问题时收起推荐区。
- 交互规则：点击后等同于提交该问题；回答生成期间不可重复提交。
- 数据规则：仅纳入状态正常的问题；一次进入内不重复，重新进入可重新随机。

**自由问题：**

- 展示规则：输入框提示“问问东坡先生……”，不展示次数或额度。
- 交互规则：空内容不能发送；发送后清空输入框并进入回答生成状态；生成期间发送按钮禁用。
- 数据规则：推荐问题和自由问题均不限制每日提问次数；只有成功返回有效回答的提问进入历史记录。

**AI 回答：**

- 展示规则：区分用户问题与东坡回答；页面持续显示“内容由 AI 生成”。
- 交互规则：生成中展示等待状态；成功后追加到当前会话；失败时在对应问题后显示失败原因和重新提问入口。
- 数据规则：回答由成熟大模型生成；消息按发送时间正序展示。历史问答仅供回看，不作为新问题的 AI 对话上下文。

**近七天历史：**

- 展示规则：进入页面直接显示北京时间当天及前六个自然日内的本人成功问答，不另设历史入口或独立页面。
- 加载规则：首次加载最新 20 组问答并定位到消息底部；向上滚动继续加载较早记录，加载后保持原阅读位置。
- 分组规则：按北京时间自然日分组，显示“7 月 23 日 · 今日”“7 月 22 日”等日期分隔；到达边界时显示“仅展示近七天问答”。
- 清理规则：进入第八个自然日后，最早一天的记录不再展示；用户不能主动删除历史。
- 隐私规则：仅当前登录用户可见本人问答；后台只展示累计成功提问次数，不展示问题和回答正文。
- 临时欢迎语：每位用户每天首次进入页面展示一次，不写入历史记录。

### 5.4 提问积分

- 每个北京时间自然日首次成功获得有效回答奖励 5 积分；同日后续成功提问不重复奖励。
- 网络失败、回答超时、服务异常和安全拒答不保存为历史，也不占用当日首次积分机会。
- 同一成功问答在同步重试时不得生成重复记录或重复积分。

### 5.5 内容安全与异常状态

| 场景 | 产品反馈 | 历史与积分 |
| --- | --- | --- |
| 正常回答 | 展示 AI 回答 | 保存成功问答；当日首次成功回答加 5 分 |
| 网络失败 | 提示网络异常并允许重试 | 不保存，不加积分 |
| 回答超时 | 提示暂未回答并允许重新发送 | 不保存，不加积分 |
| 服务不可用 | 提示“东坡暂歇，请稍后再问” | 不保存，不加积分 |
| 不当或高风险问题 | 展示安全提示，不生成不当内容 | 不保存，不加积分 |
| 超出知识范围 | 明确说明暂无法可靠回答 | 作为安全有效回答保存；符合首次条件时加积分 |
| 历史读取失败 | 保留当前会话，提示重试历史加载 | 不影响继续提问 |

### 5.6 验收标准

- 推荐问题和自由问题均能持续提交，第 1、5、6、50 次成功提问均可正常回答。
- 当日首次成功提问只发放一次 5 积分。
- 失败、超时和安全拒答不保存、不奖励，也不影响后续正常提问。
- 重新进入页面直接显示近七天成功问答，不存在历史入口或独立历史页面。
- 首次加载 20 组、向上继续加载、日期分隔、七天边界和第八天自动清理均符合规则。
- 历史只属于当前用户且不进入 AI 上下文；后台无法查看问答正文。

## 6. 签到与积分

### 6.1 每日签到

**签到状态：**

- 展示规则：首页显示“今日签到 / +10 积分”或“已签到 / 当前积分”。
- 交互规则：未签到可点击；签到处理中不可重复点击；成功后即时更新积分、连续天数和签到记录。
- 数据规则：每位用户每天仅保留一条有效签到记录；按北京时间自然日去重。签到明细只展示北京时间当天及前六个自然日内的有效记录，并按签到日期倒序。

**连续签到：**

- 连续自然日均存在有效签到时，连续天数逐日增加。
- 当天未签到不立即清零；用户在下一自然日仍未补成连续时，新签到从 1 天开始。
- 不提供补签、签到撤销和签到记录删除。

### 6.2 积分规则

| 行为 | 单次积分 | 每日发放条件 | 防重规则 |
| --- | ---: | --- | --- |
| 每日签到 | +10 | 当天首次签到成功 | 同一用户同一自然日一次 |
| 完整听诗 | +5 | 当天首次完整播放任一生效诗句 | 同一用户同一自然日一次 |
| 问东坡 | +5 | 当天首次获得有效 AI 回答 | 同一用户同一自然日一次 |
| 分享数字名片 | +20 | 当天首次成功完成微信分享 | 同一用户同一自然日一次 |

- 新用户积分初始值为 0。
- 积分只增不减；首发版不提供兑换、扣减、转赠和人工调整入口。
- 同一行为重复操作仍可使用原功能，但不重复获得积分。
- 积分发放失败时不提前增加总积分；恢复后只补发一次。
- 积分明细按发生时间倒序，展示行为名称、积分值和发生时间。

### 6.3 苏粉等级与名片主题

| 等级 | 积分范围 | 等级题签 | 名片主题与识别元素 |
| --- | ---: | --- | --- |
| 青铜苏粉 | 0—199 | 初识东坡 | 暖米宣纸、青铜褐单线框、古朴山水取景和回纹诗句暗纹 |
| 白银苏粉 | 200—499 | 渐入诗境 | 月白纸、银灰单线框、清润远山取景和流云诗句暗纹 |
| 黄金苏粉 | 500—999 | 诗酒知味 | 杏金宣纸、古金单线框、暖金山水取景和梅枝诗句暗纹 |
| 东坡雅士 | 1000—1999 | 文心相契 | 青绿宣纸、青黛单线框、青绿山水取景和竹影诗句暗纹 |
| 东坡知音 | 2000 及以上 | 千载知音 | 玄墨纸、暗金单线框、深墨山河取景和山河诗句暗纹 |

- 等级根据有效积分即时计算，达到门槛自动升级，不需要用户手动领取。
- 等级只升不降；首发版没有积分扣减，因此不处理降级。
- 升级后展示一次升级反馈；“我的”展示当前等级和当前区间进度，进度区域右侧直接展示下一等级名称及对应积分门槛，不展示“再得多少分”提示。
- 最高等级显示“已达最高等级”。
- 五级名片使用统一的信息结构，均展示产品标识、等级题签、原创东坡形象、苏粉编号、入籍日期、名片诗句、等级名称、徽记和印章。
- 五个等级使用不同的山水取景、纸色、边框、头像外框和题签；边框保持单线、克制，等级修饰统一使用菱形标识，人工纹样仅作为诗句区域的低对比暗纹。
- 名片不展示“金、银、铜、知、雅”等单字装饰，不增加主题选择页面；核心功能不因等级受限。
- “我的”身份卡、数字名片预览、保存图片、分享好友和朋友圈使用同一等级主题，升级后立即同步切换。
- 名片正文须保持清晰可读，复杂纹样不得覆盖苏粉编号、诗句和日期等核心信息。

### 6.4 异常与防重

- 重复签到：提示“今日已经签到，明日再来”，不新增记录和积分。
- 重复行为奖励：功能正常执行，积分保持不变，可提示今日奖励已领取。
- 积分总数与明细不一致：展示最近一次确认总数并标记同步中，恢复后重新核对。
- 任何异常不得产生负积分、重复积分或覆盖原有明细。

### 6.5 验收标准

- 四类行为均按规定积分值发放，并严格按用户、行为和自然日防重。
- 连续签到在连续和中断场景下计算正确。
- 新用户从 0 分开始；199/200、499/500、999/1000、1999/2000 等积分边界等级计算准确。
- 积分总数等于全部有效积分明细之和，排序和时间口径正确。

## 7. 2D 行旅地图与城市打卡

### 7.1 模块目标与页面结构

行旅模块用一张可拖动缩放的宋式手绘地图串联苏轼从眉州至郏县的 18 处重要行迹。文化详情与定位打卡全部开放，通过实地打卡形成地点点亮和勋章收集体验。

页面包括：

1. 紧凑型行旅标题区。
2. 包含已点亮数量的地图状态图例。
3. 12 个篇章行程条。
4. 可上下左右拖动、缩放的行旅地图。
5. 城市交互点和行程序号。
6. 城市文化详情、资料来源、勋章和打卡操作。

顶部不展示独立的已点亮进度环；标题区须靠近页面顶部，右上区域留空避让微信胶囊控件。已点亮数量统一在地图状态图例中展示。

### 7.3 全量开放规则

- 12 个篇章和 18 个地点始终可见，不与日历月份强绑定。

- 点击篇章时地图定位到对应地点组；篇章顺序固定为第一程至第十二程。

### 7.4 地图浏览规则

- 首次进入默认展示地图全貌。
- 用户可通过手势上下左右拖动地图。
- 用户可放大、缩小、查看全貌和回到下一处未点亮地点。
- 达到最大或最小缩放级别时，对应缩放按钮禁用。
- 地图东部密集城市默认显示较小点位；首次点击先放大并聚焦，再次点击打开详情。
- 城市点位必须与地图真实地理区域对应，不因标签避让而改变城市锚点。
- 路线按 1—18 行程序号连接；路线只承担行程表达，不覆盖地点点击区域。

### 7.5 城市状态

| 状态 | 展示规则 | 点击结果 |
| --- | --- | --- |
| 未打卡 | 空心地点标识、行程序号、历史地名 | 打开完整地点详情，可发起定位打卡 |
| 已点亮 | 朱砂实心标识、行程序号、“已点亮” | 打开完整详情并展示打卡时间、验证距离和勋章 |

### 7.6 城市详情字段规则

**城市基本信息：**

- 展示规则：展示省份、历史时期、城市名称、篇章主题和地点故事。
- 交互规则：只读；用户可关闭详情返回原地图位置。
- 数据规则：仅展示编辑团队已发布的地点内容；历史地名与现代城市名称同时保留。不涉及筛选。

**历史与文化内容：**

- 展示规则：展示历史记载、相关遗迹和代表作；内容为空时显示“内容待补充”，不使用虚构信息。
- 交互规则：代表作和遗迹首发版只读，不新增站内详情页。
- 数据规则：资料来源需明确，优先采用权威文博、文旅或出版资料；同类内容按编辑配置顺序展示。

**资料来源：**

- 展示规则：城市详情展示“查看资料来源”。
- 交互规则：点击后打开对应权威资料；返回后保留当前城市详情状态。
- 数据规则：每个城市至少配置一个有效来源；来源失效时隐藏跳转并提示内容维护中。不涉及排序。

**城市勋章：**

- 展示规则：未打卡展示勋章预览，打卡成功后展示已获得状态。
- 交互规则：成功后可前往“我的徽章”查看，也可继续探索地图。
- 数据规则：每个行旅点对应一个地点勋章；同一用户、同一行旅点只获得一次。

### 7.7 定位打卡规则

**发起打卡：**

- 默认状态：未打卡地点显示“到此打卡”。
- 点击反馈：先展示定位用途、20 公里范围、精度要求和隐私说明，不立即请求系统权限。
- 权限状态：用户点击“授权定位并验证”后才请求位置权限。
- 重复打卡：已打卡城市显示“查看打卡勋章”，不重新发放。

**成功条件：**

- 用户到城市中心的球面距离不超过 20 公里，20.0 公里计为成功。
- 本次定位精度不高于 5 公里，精度值等于 5 公里可继续验证。
- 距离和精度两个条件必须同时满足。
- 成功后保存城市、打卡时间、验证距离和勋章结果，不保存原始经纬度。
- 打卡成功只发城市勋章，不增加积分。

**失败状态：**

| 失败类型 | 反馈规则 | 后续操作 |
| --- | --- | --- |
| 权限拒绝 | 提示在系统设置中允许位置访问 | 提供重新定位 |
| 请求超时 | 提示到开阔处后重试 | 提供重新定位 |
| 无法获取位置 | 提示检查网络和系统定位服务 | 提供重新定位 |
| 精度超过 5 公里 | 提示当前位置精度不足 | 提供重新定位 |
| 距城市中心超过 20 公里 | 展示约距离并说明进入范围后可打卡 | 提供重新定位或继续浏览 |
| 当前环境不支持 | 提示在支持定位的微信环境重试 | 不显示虚假成功 |

### 7.8 统计规则

- 行旅篇章数：固定为 12。
- 已点亮地点数：按当前用户已完成打卡的不同有效行旅点统计，分母固定为 18。
- 行旅勋章数：按城市勋章标识去重；重复打卡不增加。
- 统计只纳入当前用户有效数据，排除失败、取消、重复和未同步成功的打卡。
- 打卡成功后即时刷新地图、行旅进度和我的徽章。

### 7.9 验收标准

- 12 个篇章、18 个地点、历史地名、现代城市和行程顺序与本 PRD 一致。
- 所有地点均可查看详情和发起打卡，不出现锁定、月份解锁或“本月”状态。
- 地图支持四向拖动、缩放、全貌、回到未点亮地点和密集点位聚焦。
- 地点详情字段完整，资料来源可追溯。
- 19.9 公里成功、20.1 公里失败；定位精度边界符合规则。
- 拒绝、超时、无法定位、低精度、不支持和超范围均有明确反馈。
- 成功后地图、我的徽章和统计同步更新，原始经纬度不留存。

## 8. 苏粉身份、等级、徽章与数字名片

### 8.1 苏粉身份

**苏粉编号：**

- 展示规则：格式为“苏粉 No.数字编号”，在首页身份入口、我的和数字名片中保持一致。
- 交互规则：首页点击身份入口进入“我的”；编号只读，不允许用户修改。
- 数据规则：每个微信用户对应一个全局唯一苏粉编号；重复登录和跨设备登录读取原编号。不涉及筛选与排序。

**展示名称：**

- 展示规则：身份卡和分享名片均展示当前展示名称。
- 交互规则：用户点击身份卡中的展示名称进入修改弹窗，直接输入并保存新名称；弹窗不展示微信昵称说明，也不读取或回填微信昵称。
- 数据规则：展示名称为产品内独立资料，与微信昵称无关联；修改展示名称不改变头像、苏粉编号、入籍日期和其他业务数据。游客只展示“游客 + 随机数”。

**头像：**

- 展示规则：“我的”页面不展示“使用微信昵称/头像”文字入口；身份卡始终展示当前保存的头像，头像本身为更换入口。
- 交互规则：
  - 点击身份卡头像后，从页面底部展示头像选择层，操作顺序固定为“用微信头像 / 从相册选择 / 拍照 / 取消”。
  - 点击“用微信头像”后仅申请并更新微信头像，不读取或修改微信昵称。
  - 点击“从相册选择”或“拍照”后，用户选择有效图片并确认，系统更新为用户自选头像。
  - 点击“取消”、拒绝授权、未选择图片或头像处理失败时关闭或保留选择层供用户退出，当前头像与展示名称均不发生变化；失败场景允许重新发起。
- 数据规则：
  - 头像仅在用户点击身份卡头像并完成某一选择后更新；微信登录、修改展示名称、生成名片、保存名片或分享名片均不自动发起头像选择。
  - 微信头像、自选相册图片和拍照图片均只更新头像，不改变展示名称。
  - 更新头像不改变苏粉编号、入籍日期、积分、等级、签到、收藏、打卡和勋章。
  - 当前头像作为苏粉身份资料参与跨设备同步；不涉及筛选与排序。

**入籍日期：**

- 展示规则：展示用户首次完成授权并生成身份的北京时间日期。
- 交互规则：只读。
- 数据规则：首次生成后不可因重复登录、扫码或跨设备改变。不涉及筛选与排序。

### 8.2 我的首页

- 登录用户身份卡展示当前展示名称、头像、苏粉编号、入籍日期、当前积分、等级和升级进度。
- 页面标题右侧不展示微信资料申请入口；点击身份卡头像进入头像选择层，头像更新成功后身份卡即时刷新。

- 所有统计使用当前登录用户数据；读取失败时显示同步异常，不使用演示数据。
- 游客进入我的页面时只展示游客名称、登录价值说明和微信登录按钮，不展示苏粉身份卡、权益数据、个人记录和徽章。

### 8.3 徽章规则

- 未获得徽章可展示名称和获得条件，但不得显示为已获得。
- 获得徽章后即时进入“我的徽章”。
- 徽章总数按徽章标识去重，排除失败和重复记录。

### 8.4 数字名片

**名片内容：**

- 展示规则：包含产品名称、当前展示名称、当前头像、苏粉编号、入籍日期、代表诗句和等级名片主题；使用产品默认头像时展示本项目原创东坡形象，用户更换头像后展示当前微信头像或自选头像。
- 交互规则：用户可预览、关闭、保存到相册或分享微信好友；生成、保存和分享过程均不主动发起头像选择。用户对当前名称或头像不满意时，需返回“我的”分别修改。
- 数据规则：
  - 名片预览、保存图片和微信分享图片均读取生成时的当前展示名称与头像；名称或头像修改成功后，下一次生成即时使用新状态。
  - 用户首次生成名片时，从符合名片条件的已发布日历内容中随机选择一句并保存诗句快照；同一用户后续生成和跨设备展示保持一致。
  - 首页浏览日期变化不改变已经保存的名片诗句快照；没有任何符合条件的已发布内容时暂停生成名片并提示内容准备中。
  - 等级名片主题根据有效积分自动计算，不提供手动主题选择。

**分享积分：**

- 当日首次成功完成数字名片微信分享奖励 20 积分。
- 保存到相册不视为分享，不发放 20 积分。
- 取消分享或分享失败不发积分。
- 同日重复分享正常执行，但不重复发积分。

**入口与可见性：**

### 8.6 用户服务协议

**入口与导航：**

- 展示规则：登录用户和游客均可在关于页底部看到“用户服务协议”入口及辅助文案，不以微信登录作为访问条件。

- 同意规则：关于页入口仅用于查阅，不代表用户已同意协议；原型阶段访问或使用原型不视为接受草案。正式上线前须明确协议同意节点、拒绝后的可用范围和重大更新后的重新同意规则，并完成对应产品流程。
- 数据规则：协议正文不涉及筛选、排序或统计；对外仅展示当前完整条款，不展示协议版本、更新日期、生效日期或原型草案提示。

**协议信息：**

- 展示规则：协议页展示协议标题、完整条款和已确认的联系信息，不展示协议版本、更新日期、生效日期、原型展示说明，也不展示客服渠道、处理结果反馈时限等未确认信息的占位文案。联系信息中展示已确认的运营主体、联系地址和反馈受理时间；非工作时间提交的反馈说明为下一工作日受理。
- 正式上线前必须补齐客服入口或邮箱、投诉举报处理流程、处理结果反馈时限和正式生效日期，并完成法律审核；工作日 9:00—18:00 仅表示反馈受理时间，不替代处理结果反馈时限。
- 协议正文至少覆盖协议范围、用户资格、账号使用、服务内容、AI 内容及标识、用户行为、知识产权、个人信息保护、第三方服务、服务调整、违规处置、责任边界、未成年人保护、协议更新、争议解决和联系方式。
- 与用户有重大利害关系的 AI 标识、服务停止、违规处置、责任边界、未成年人保护和争议解决条款须以重点提示或加粗方式显著展示。

**AI 内容与标识规则：**

- 协议明确“问东坡”页面持续显示“内容由 AI 生成”；正式上线版本的 AI 吟诵播放入口和播放区域必须显示“AI 生成音频”，不得把当前原型描述为已实现该标识。
- 当前版本不提供 AI 回答或 AI 吟诵的复制、下载、导出或分享；后续新增任一操作前，须补充对应显式标识、隐式标识和传播后标识保留规则，并同步更新协议。
- 协议提示用户不得恶意删除、篡改、伪造或隐匿 AI 生成内容标识，并说明生成内容可能存在错误、遗漏或不准确引用。
- 协议说明“问东坡”属于文化问答、作品解读与一般性生活启发，不代表历史人物本人，不以持续情感陪伴、虚拟亲密关系或心理咨询为服务目标，也不构成医疗、法律、金融或其他专业建议。

**协议更新与责任规则：**

- 涉及用户主要权利义务的重大变更须以显著方式告知，并在法律要求时重新取得同意；不得仅以继续浏览替代依法应另行取得的同意。
- 责任限制不得排除运营方故意、重大过失责任或法律规定不得排除、限制的责任。
- 争议解决约定为先行协商，协商不成时向依法具有管辖权的人民法院提起诉讼，不预设未确认的运营主体所在地法院。

### 8.7 验收标准

- 同一用户跨设备登录时苏粉编号、入籍日期及个人数据一致。
- 点击身份卡头像可打开包含“用微信头像 / 从相册选择 / 拍照 / 取消”的底部选择层；页面标题右侧不出现“使用微信昵称/头像”。
- 使用微信头像或自选图片成功后，身份卡和下一次生成的数字名片同步更新且展示名称不变；取消、拒绝、未选择图片或处理失败时保留原头像。
- 新用户自动获得苏粉初识；听诗和七日签到按规则发放徽章。
- 行旅勋章与城市打卡一一对应，不重复累计。
- 使用产品默认头像时，原创东坡主资产、身份头像裁切和名片裁切保持同一人物体系，不使用已有文物实物图或影视人物形象；用户更换头像后改用当前微信头像或自选头像。
- 数字名片信息准确，保存和分享状态明确，分享积分严格防重。
- 登录用户与游客均可从“我的”进入关于页并正常返回；关于页内容、版本和素材授权信息与当前正式版本一致。
- 关于页不展示“隐私与权限”模块和素材接入状态提示；底部用户服务协议入口可正常打开全文并返回。
- 协议全文、协议内容稿与 PRD 规则一致；正式版不得保留客服联系方式、投诉举报处理流程、处理结果反馈时限、生效日期等待补字段。
- 协议页支持长文纵向滚动；入口打不开、正文加载失败或返回失败时不得出现空白页，须提供明确的失败反馈或可用返回操作。

## 9. 我的珍藏与签到记录

### 9.1 我的珍藏

**列表范围、筛选与排序：**

- 取数规则：只纳入当前用户处于有效收藏状态的诗句，排除已取消、重复和无权访问内容。
- 筛选规则：不提供日期或其他筛选，默认展示全部有效珍藏。
- 排序规则：按收藏成功时间倒序；时间相同时按日历日期倒序。

**珍藏卡片：**

- 展示规则：展示收藏日期、诗句、作者、出处和已收藏标识。
- 交互规则：最新收藏位于最左侧；用户通过手指左右滑动切换，不设置底部上一篇/下一篇按钮。
- 数据规则：当前序号和总数只统计有效收藏；切换只改变当前查看项，不改变收藏顺序。

**分享：**

- 每张珍藏卡可直接打开当前诗句分享预览，支持保存图片、分享好友和朋友圈。
- 分享使用该珍藏对应的日期、诗句、作者和出处，不因当前自然日变化。
- 珍藏分享不发积分，也不改变收藏状态。

**取消收藏：**

- 用户可在今日页取消当前诗句收藏。
- 取消成功后立即从我的珍藏移除，并更新珍藏数量。
- 若用户正在查看被取消的条目，返回珍藏时定位到原位置的下一条；若无下一条则定位到上一条。
- 取消最后一条收藏后展示空状态。

**空状态与异常：**

- 无收藏：展示“还没有珍藏诗句”和返回今日入口。
- 加载失败：保留最近一次有效列表并标记同步未完成，提供重试。
- 内容已下线：不展示正文，标记内容暂不可用；不计入有效收藏数。

### 9.2 签到记录

**概览字段：**

- 展示规则：展示连续签到、本月签到、当前积分。
- 交互规则：只读；月份随当前查看月份变化。
- 数据规则：
  - 连续签到按第 6.1 节计算。
  - 本月签到按北京时间当月有效签到日期去重。
  - 当前积分为全部有效积分明细之和。

**月历：**

- 展示规则：展示当前月份的星期和日期，区分今日与已签到日期。
- 交互规则：首发版不支持补签和点击日期编辑。
- 数据规则：默认展示北京时间当前自然月的签到记录，按日期正序排列，不涉及筛选。

**签到明细：**

- 展示规则：展示签到日期、统一状态文案“已签到”和 +10 积分；不展示“时间倒序”等排序说明。
- 交互规则：只读。
- 数据规则：只纳入北京时间当天及前六个自然日内的有效签到，按签到日期倒序；重复、失败及七天范围外记录不展示。

**空状态与异常：**

- 本月无签到：月历正常展示，明细区显示“本月还未签到”。
- 记录读取失败：不显示 0 替代真实数据，显示同步异常和重试。
- 积分与签到记录暂不一致：保留已确认值并标记同步中。

### 9.3 验收标准

- 珍藏按收藏时间倒序，最新在最左侧，手动滑动切换正确且不显示底部切换按钮。
- 珍藏页默认展示全部有效收藏且不提供日期筛选；珍藏卡可完成分享。
- 收藏/取消收藏后首页、珍藏列表和我的统计一致。
- 签到月历、连续天数、本月签到数和明细口径一致。
- 签到明细仅展示最近七个北京时间自然日内记录，按日期倒序，每条记录统一显示“已签到”。
- 无数据、内容下线和同步失败均有明确状态，不填充演示数据。

## 10. Web 基础管理后台

### 10.1 后台目标与边界

一期后台是面向运营人员的基础管理工具，与小程序共用已发布的日历内容、行旅文化内容、推荐问题和用户基础信息。后台解决基础内容维护、发布、查询和导出，不承担运营分析。

- 固定菜单为：日历内容、行旅地图配置、问东坡配置、用户管理、账号管理。
- 不设置工作台或运营数据菜单，不提供用户增长、日活、留存、行为趋势、热门内容或城市排行。
- 日历内容流程为草稿、发布和下线；行旅地图配置不设置草稿、发布状态或下线流程。后台不设置审核节点，不保留操作记录、审核记录和历史版本。
- 行旅地点、地图点位、行程顺序、定位中心和打卡范围为固定数据，后台只维护文化内容和素材。
- 后台与小程序共用正式业务数据；日历草稿保存不影响线上内容，日历发布与下线、行旅配置保存、用户状态和账号变更在操作成功后立即按本章规则生效。

### 10.2 后台账号边界

- 后台账号与小程序苏粉身份相互独立；后台不设置角色字段和权限配置。
- 所有有效后台账号使用同一套菜单和操作能力。
- 账号管理不得删除当前正在登录的账号。
- 新建账号时设置密码；编辑账号不允许修改密码，密码通过独立“重置密码”操作修改。

### 10.3 登录与全局交互

- 登录字段为账号名称或手机号、密码，支持密码显示切换、登录中、账号密码错误和网络异常反馈。
- 登录页不展示演示账号、快捷填充、角色或环境说明。
- 框架采用顶部栏、左侧导航和内容工作区；新增和编辑使用右侧抽屉，日历删除、发布和下线等高影响操作使用确认弹窗。
- 所有列表和表单覆盖加载、保存中、成功、失败、空数据、查询无结果、网络异常和重试状态。
- 重点适配 1440×900、1280×800 和 1024×768；窄屏侧栏收起，表格可横向滚动，弹层必须可关闭。

### 10.4 列表与编辑通用规则

- 后台登录后默认进入日历内容，不单独设置工作台。
- 每个模块由页面标题、主要操作、筛选区、列表和编辑抽屉组成。
- 导出遵循当前查询结果；按钮统一命名为“导出”。重置恢复默认列表。
- 编辑抽屉关闭、切换菜单或刷新页面时，存在未保存内容须提示用户确认。
- 日历保存草稿不影响小程序已发布内容；日历发布或行旅配置保存成功后，小程序刷新读取新内容。
- 日历和行旅编辑不展示实时手机预览。

### 10.5 日历内容管理

**列表与筛选**

- 列表字段：日期、作品、当日句子、作者、发布状态和操作。
- 默认按日期正序；支持按句子、作品、作者或出处关键词和发布状态查询。
- 支持导出、Excel 导入和新建内容。
- 操作列按记录状态展示，按钮顺序固定如下：

| 记录状态 | 操作按钮 | 操作结果 |
| --- | --- | --- |
| 草稿 | 编辑、发布 | 编辑进入内容抽屉；发布前校验内容并二次确认 |
| 已发布 | 编辑、下线 | 下线后二次确认，成功后状态变为已下线且小程序不再展示 |
| 已下线 | 编辑、删除 | 删除后二次确认，成功后从列表移除且不可恢复 |

**内容字段与规则**

- 运营人员录入：日期、作品标题、当日句子、作者、完整出处和基础海报素材。
- 选择日期后，系统自动计算并只读展示公历、农历和星期；运营人员不单独输入。
- 诗词作品编号、组内顺序和名片候选由系统根据日期和业务规则生成，不在表单中展示。
- 日期、作品标题、当日句子、作者和出处必填；同一日期允许维护多条相互独立的候选记录，手工新建、编辑和 Excel 导入均不限制同日记录数量。
- 同一日期最多只能有一条已发布内容，其他同日记录可处于草稿或已下线状态。
- 系统仍可按日期自动建立作品分组；共用同一作品分组的记录共用作品标题、作者、出处和海报。12 月 31 日按年度特别页处理。
- 同一日期存在多条候选记录时，各候选作品组相互独立；每条满足必填项的记录均可独立发布，不要求先保存连续日期的配对内容，也不校验配对句子是否重复。
- 吟诵由成熟大模型朗诵对应作品，后台不上传或维护音频。
- 已发布内容编辑后先保存草稿，小程序继续读取上一次已发布内容；再次发布后替换，不保留旧版本。
- 下线内容不进入小程序正常展示，小程序显示内容维护状态。
- 发布、下线和删除均使用确认弹窗。发布时若同日已有其他已发布内容，弹窗须明确提示“本条发布后，已经存在的那条将下线”；确认后新内容发布、原内容下线，其他同日草稿状态不变。取消操作时所有记录保持原状态。
- 删除只对已下线记录开放；被其他日期共同使用的作品信息不随当前记录删除。

### 10.6 Excel 导入与导出

- 日历导入模板固定包含：日期、当日句子、作品标题、作者、出处、海报资源地址。
- 公历、农历、星期、作品分组和组内顺序均由系统自动计算，不要求 Excel 提供。
- 流程为下载模板、选择文件、解析、校验、查看结果、确认导入和查看摘要；不提供重复项处理策略。
- 校验文件格式、工作表、表头、日期格式、必填项和同组作品信息一致性；不校验文件内重复日期，不与系统已有记录进行日期重复判断，也不校验两日内容是否连续或句子是否重复。错误须定位到 Excel 行号、字段、原始值和原因。
- 正确行可以继续导入，错误行不写入并可下载错误明细。
- 每个正确行均新增为独立草稿，不覆盖、不下线、不修改任何已有草稿、已发布或已下线记录；导入摘要展示总行数、可导入草稿数和错误数。
- 同一导入文件中的每个正确行均可形成候选内容；单条记录导入后无需补齐连续日期配对即可发布。
- 支持导出日历内容、行旅地图配置、推荐问题和当前查询结果下的用户列表。

### 10.7 行旅地图配置

- 12 个篇章、18 个行旅点、历史地名、现代城市、行程序号、顺序、地图点位、打卡中心和打卡范围为系统固定数据。
- 列表字段：行程、篇章、历史地名/今址、图片、来源和操作；默认按行程序号正序，不展示状态列。
- 支持按篇章筛选并导出，不提供状态筛选、草稿箱或下线入口。
- 可编辑篇章主题、历史时期、地点故事、历史记载、相关遗迹、代表作、城市图片、资料来源、勋章名称、勋章说明和勋章图片；以上 11 项均为必填。
- 篇章主题不少于 4 个字，地点故事不少于 10 个字，勋章名称不少于 2 个字；地点故事与历史记载不得完全相同，资料来源必须为 HTTP 或 HTTPS 地址，城市图片和勋章图片必须已上传。
- 表单顶部只读展示当前地点及今址，不展示实时手机预览。
- 操作列只提供“维护配置”；编辑抽屉只提供“保存并上线”。必填项未通过校验时不得保存，保存成功后配置立即同步小程序。
- 后台不提供城市新增删除、地图拖拽、坐标输入、路线调整、打卡范围设置和用户打卡修改。
- 行旅配置不区分草稿、已发布或已下线状态，不保留独立版本；当前有效配置向所有用户开放，不设置月份锁定。

### 10.8 问东坡配置

- 后台只维护推荐问题，不建设或维护知识库；问答能力调用成熟大模型。
- 推荐问题字段为问题内容和状态，不设置主题分类或展示顺序字段。
- 支持新增、编辑和切换正常/停用状态。
- 小程序每次进入问东坡时，从全部状态正常的问题中随机选择 3 个展示；一次展示内不重复。
- 后台不管理模型、提示词、用户问答正文、提问趋势、热门问题和回答成功率。

### 10.9 用户管理

- 列表字段：苏粉编号、展示名称、注册时间、积分/等级、连续签到、收藏/勋章和最近活跃时间。
- 支持苏粉编号精确查询和展示名称模糊查询，默认按注册时间倒序。
- 支持导出当前查询结果，按钮命名为“导出”。
- 不展示用户状态和操作列，不提供用户详情弹窗、停用、恢复或任何业务数据修改。
- 后台不得修改苏粉编号、微信身份、注册时间、积分、签到、收藏、打卡和勋章。

### 10.10 账号管理

- 字段仅为账号名称、手机号和密码，不包含角色字段。
- 新建账号时输入密码并二次确认；两次输入不一致时不得保存。
- 编辑账号只允许修改账号名称和手机号，不展示密码字段。
- 账号列表在编辑旁提供“重置密码”；重置弹窗须输入新密码并二次确认。
- 同一手机号只能对应一个后台账号；当前登录账号不得被删除。
- 后台不提供“恢复演示数据”入口。

### 10.11 后台验收标准

- 后台账号可正常登录；登录页不展示演示账号；菜单只包含日历内容、行旅地图配置、问东坡配置、用户管理和账号管理。
- 日历新建、编辑、导入、导出、草稿、发布、下线、删除及小程序联动符合规则；日期衍生字段自动生成且不可编辑，草稿、已发布和已下线记录分别展示正确的操作按钮。
- 同日可创建和导入多条候选内容，但小程序始终只读取该日期唯一的已发布内容；替换发布前提示原内容将下线，取消不改变状态，确认后新稿发布且旧稿下线。
- 每条满足必填项的日历记录均可独立发布，不因缺少连续日期配对或句子与同组记录重复而被拦截。
- Excel 可解析真实文件，重复日期的正确行全部新增为草稿，已有记录不被覆盖；其他错误定位准确，模板不包含作品编号、组内顺序和音频字段。
- 18 个行旅地点和坐标固定；行旅地图配置不展示草稿箱、状态筛选、状态列或下线入口，11 项文字与图片字段全部必填，唯一操作“保存并上线”成功后立即同步小程序；编辑页不展示实时手机预览。
- 推荐问题可新增、编辑和启停，小程序每次从正常问题中随机展示 3 个；后台不存在知识内容页。
- 用户列表支持查询和导出，不出现状态、停用、恢复、详情或业务数据修改入口。
- 账号新增需二次确认密码，账号编辑不允许改密码，独立重置密码需二次确认。
- 后台不存在工作台、运营数据、地图编辑、恢复演示数据、操作记录、审核记录和历史版本入口。

## 11. 数据口径与内容依赖

### 11.1 业务数据对象

| 业务对象 | 核心业务内容 | 关键规则 |
| --- | --- | --- |
| 诗词作品 | 标题、作者、出处、海报 | 可被一条或多条日历候选记录引用，关联记录发布后生效 |
| 日历内容 | 唯一记录标识、日期、公历、农历、当日句子、状态 | 日期可重复；同一日期允许多条候选，但最多一条处于已发布状态 |
| 游客身份 | 游客随机名称、登录状态 | 不生成苏粉编号，不沉淀苏粉权益 |
| 苏粉身份 | 展示名称、头像、苏粉编号、入籍日期、积分、等级 | 与微信用户唯一绑定，跨设备一致 |
| 行为积分 | 行为、积分值、发生时间、奖励日期 | 按用户、行为、自然日防重 |
| 问答历史 | 用户、问题、回答、来源、成功时间、业务日期 | 仅保存成功问答；本人近七天可见；不作为 AI 上下文 |
| 收藏记录 | 日历内容、收藏时间、有效状态 | 同一内容只保留一个有效收藏 |
| 签到记录 | 签到日期、签到时间、签到状态 | 每日一条有效记录，不支持补签；明细仅展示最近七个北京时间自然日 |
| 行旅篇章 | 篇章序号、主题、地点顺序 | 12 个篇章固定正序，全部开放 |
| 地点内容 | 历史地名、现代城市、时期、故事、史料、遗迹、作品、来源、勋章 | 18 个固定地点，发布后展示 |
| 城市打卡 | 城市、行旅点、打卡时间、验证距离、勋章 | 不保存原始经纬度，每行旅点一次 |
| 徽章 | 徽章名称、获得条件、获得时间 | 按徽章标识去重 |

### 11.2 统一统计口径

| 指标 | 统计口径 |
| --- | --- |
| 当前积分 | 当前用户全部有效积分明细之和 |
| 连续签到 | 截至最近一次有效签到的连续自然日数量 |
| 本月签到 | 当前北京时间月份内不同有效签到日期数 |
| 珍藏数量 | 当前用户不同日历内容的有效收藏数 |
| 行旅篇章 | 固定 12 个篇章 |
| 已点亮地点 | 当前用户成功打卡的不同有效行旅点数，分母 18 |
| 勋章数量 | 当前用户已获得的不同勋章标识数 |
| 累计成功提问 | 当前用户全部成功问答次数；后台只展示次数，不展示正文 |
| 近七天问答 | 北京时间当天及前六个自然日内的成功问答 |

- 统计范围只包含当前登录用户的有效数据。
- 排除失败、取消、重复、已撤销或未确认成功的数据。
- 统计在相关操作成功后刷新；异常时展示最近一次确认结果并标记同步状态。
- 空值应按业务语义展示 0 或空状态；读取失败不得按 0 处理。

### 11.3 编辑团队内容依赖

首发前需完成并确认以下内容：

- 计划上线日期的诗句、作者、出处和海报素材；公历、农历和星期由系统计算，已发布内容可覆盖过去或未来日期。
- 诗句海报模板、苏粉数字名片模板、五级名片主题和原创东坡人物资产。
- 推荐问题清单及其正常/停用状态。
- 12 个行旅篇章、18 个行程序号对应的地点史料、遗迹、作品、图片和资料来源。
- 基础徽章与行旅点专属勋章名称、说明和正式素材。

内容未确认并发布时不得进入正式展示范围；缺失项按对应模块的空状态处理，不得使用未经确认的替代内容。

### 11.4 数据隐私约束

- 位置权限仅在用户主动发起城市打卡后请求。
- 定位仅用于当次城市距离验证。
- 原始经纬度不进入用户历史记录；只保留城市、打卡时间、验证距离和勋章结果。
- 用户数据只用于苏粉身份、互动记录和跨设备同步，不在本期提供公开排行或用户间查看。
- 展示名称为产品内独立资料，不读取或依赖微信昵称；头像仅在用户点击身份卡头像并主动选择微信头像、相册图片或拍照图片后更新，取消或失败时不更新。
- 问答历史仅供当前用户在聊天界面回看，后台不展示问题和回答正文；超过近七天的内容不再提供查询。

## 12. 一期整体验收标准

### 12.1 登录与日期

- 游客可浏览今日、行旅和问东坡；我的页面不展示苏粉权益。
- 微信登录成功后生成或读取唯一苏粉编号；展示名称不与微信昵称绑定，用户可在“我的”直接修改，并可点击头像单独选择微信头像、相册图片或拍照图片。
- 取消、失败和重复登录的状态及结果符合要求，游客名称按“游客 + 随机数”展示。
- 同一用户重复扫码和跨设备登录不生成新身份。
- 首次打开、全部已发布日期翻阅、返回今天、今天空状态、前后台切换和北京时间跨日均符合日期规则。

### 12.2 今日与珍藏

- 日期、诗句、作者和出处准确匹配，AI 朗诵调用正确作品。
- 当前浏览日期的内容、朗诵、收藏和分享保持一致；切换日期时原朗诵停止并重置进度。
- 未播放不显示进度，播放、暂停、继续和完成状态正确。
- 当日首次完整听诗奖励 5 分，重复或失败不重复奖励。
- 收藏、取消收藏、珍藏倒序、手动左右滑动、分享、数量和空状态一致；珍藏页不提供日期筛选。
- 诗句海报支持预览、下载、分享好友和朋友圈，失败状态明确。

### 12.3 问东坡

- 推荐问题和自由问题均可持续使用，不显示或限制每日提问次数。
- 当日首次成功回答只奖励一次 5 分。
- AI 标识、加载、错误和安全状态完整。
- 进入现有聊天页面直接显示本人近七天成功问答，首次加载最新 20 组并支持向上继续加载。
- 历史按北京时间自然日分组，第八天自动移除最早一天；历史不参与 AI 上下文。
- 失败、超时和安全拒答不写入历史，后台无法查看问题和回答正文。

### 12.4 签到、积分与等级

- 签到每日一次并奖励 10 分，重复签到不新增数据。
- 签到明细只展示最近七个北京时间自然日内的有效记录，按日期倒序且统一标记“已签到”。
- 听诗、提问、数字名片分享和签到四类积分均按自然日防重。
- 连续签到在连续、跨月和中断场景下计算正确。
- 新用户初始 0 分；五级等级及 199/200、499/500、999/1000、1999/2000 边界准确。
- 积分总数、明细和个人中心展示一致，不出现负数或重复积分。

### 12.5 行旅地图与打卡

- 12 个篇章、18 个行程序号、历史地名、现代城市和地点状态正确。
- 地图四向拖动、缩放、全貌、回到下一处未点亮地点和密集地点聚焦可用。
- 城市点位与实际地理区域相符，路线顺序清晰且不妨碍点击。
- 地点详情字段齐全，资料来源有效，所有地点均可查看和打卡。
- 19.9 公里打卡成功、20.1 公里失败；精度边界正确。
- 权限拒绝、超时、无法定位、低精度、不支持和超范围均可恢复或退出。
- 成功后城市、勋章、统计和我的页面同步；重复打卡不重复发放。
- 用户历史数据中不保存原始经纬度。

### 12.6 身份、名片与数据同步

- 展示名称、头像、苏粉编号、入籍日期、积分、等级、签到、收藏和勋章跨设备一致。
- 基础徽章与行旅勋章按条件发放并去重。
- 五级名片的题签、纸色、边框、纹样、头像外框、徽记和印章具有明确区分。
- “我的”身份卡、数字名片预览、下载图片与微信分享图片使用一致的等级主题和山水背景，升级后立即切换。
- “我的”标题右侧不显示微信资料申请入口；点击身份卡头像可选择微信头像、相册图片或拍照图片，更新后身份卡、数字名片预览、下载图片和分享图片均使用当前头像，展示名称保持不变。
- 数字名片内容准确，保存和分享结果明确。
- 名片代表诗句从符合条件的已发布日历内容中首次随机选取并固定为用户快照，跨设备保持一致。
- 使用产品默认头像时，原创东坡主资产及身份头像、名片裁切人物一致；用户更换头像后改用当前微信头像或自选头像。
- 当日首次成功分享数字名片奖励 20 分，取消、失败和重复分享不重复奖励。
- 加载失败、同步失败和无数据场景不使用演示值冒充真实数据。

### 12.7 一期通过条件

- 本 PRD 所列核心流程均可完整闭环，无阻断性问题。
- 所有积分、签到、收藏、成功问答、打卡和勋章均满足去重与统计口径。
- 关键异常均有明确反馈和可执行的恢复路径。
- 内容编辑团队已完成所有首发内容确认与发布，不存在未授权或来源不明的正式内容。
- 产品、设计、研发、测试和业务方依据本 PRD 完成联合验收。

      function escapeHtml(value) {
        return value.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
      }

      function inlineMd(value) {
        var escaped = escapeHtml(value);
        escaped = escaped.replace(/`([^`]+)`/g, '<code>$1</code>');
        escaped = escaped.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
        escaped = escaped.replace(/\[([^\]]+)\]\((https?:\/\/[^\s)]+)\)/g, '<a href="$2" target="_blank" rel="noreferrer">$1</a>');
        return escaped;
      }

      function slugify(value, index) {
        var cleaned = value.replace(/[#*`《》“”"'：:，,。！？!?（）()\/\\\s]+/g, '-').replace(/^-+|-+$/g, '');
        return (cleaned || 'section') + '-' + index;
      }

      function isTableDivider(line) {
        return /^\s*\|?\s*:?-{3,}:?\s*(\|\s*:?-{3,}:?\s*)+\|?\s*$/.test(line);
      }

      function cells(line) {
        return line.trim().replace(/^\||\|$/g, '').split('|').map(function (cell) { return cell.trim(); });
      }

      function renderMarkdown(markdown) {
        var lines = markdown.replace(/\r\n?/g, '\n').split('\n');
        var html = [];
        var headings = [];
        var i = 0;
        var headingIndex = 0;

        function closeParagraph(buffer) {
          if (buffer.length) {
            html.push('<p>' + inlineMd(buffer.join(' ')) + '</p>');
            buffer.length = 0;
          }
        }

        while (i < lines.length) {
          var line = lines[i];
          if (!line.trim()) { i += 1; continue; }

          var heading = line.match(/^(#{1,4})\s+(.+)$/);
          if (heading) {
            headingIndex += 1;
            var level = heading[1].length;
            var title = heading[2].trim();
            var id = slugify(title, headingIndex);
            html.push('<h' + level + ' id="' + id + '">' + inlineMd(title) + '</h' + level + '>');
            if (level <= 3) headings.push({ level: level, title: title, id: id });
            i += 1;
            continue;
          }

          if (/^---+$/.test(line.trim())) {
            html.push('<hr />');
            i += 1;
            continue;
          }

          if (line.trim().charAt(0) === '>' ) {
            var quote = [];
            while (i < lines.length && lines[i].trim().charAt(0) === '>') {
              quote.push(lines[i].replace(/^\s*>\s?/, ''));
              i += 1;
            }
            html.push('<blockquote><p>' + quote.map(inlineMd).join('<br />') + '</p></blockquote>');
            continue;
          }

          if (i + 1 < lines.length && line.indexOf('|') !== -1 && isTableDivider(lines[i + 1])) {
            var headerCells = cells(line);
            i += 2;
            var rows = [];
            while (i < lines.length && lines[i].trim() && lines[i].indexOf('|') !== -1) {
              rows.push(cells(lines[i]));
              i += 1;
            }
            var table = '<div class="table-wrap"><table><thead><tr>' +
              headerCells.map(function (cell) { return '<th>' + inlineMd(cell) + '</th>'; }).join('') +
              '</tr></thead><tbody>';
            rows.forEach(function (row) {
              table += '<tr>' + headerCells.map(function (_, column) {
                return '<td>' + inlineMd(row[column] || '') + '</td>';
              }).join('') + '</tr>';
            });
            table += '</tbody></table></div>';
            html.push(table);
            continue;
          }

          var listMatch = line.match(/^(\s*)([-*]|\d+\.)\s+(.+)$/);
          if (listMatch) {
            var listLines = [];
            while (i < lines.length) {
              var current = lines[i].match(/^(\s*)([-*]|\d+\.)\s+(.+)$/);
              if (!current) break;
              listLines.push({
                indent: current[1].replace(/\t/g, '  ').length,
                ordered: /\d+\./.test(current[2]),
                text: current[3]
              });
              i += 1;
            }
            var baseIndent = Math.min.apply(null, listLines.map(function (item) { return item.indent; }));
            var rootTag = listLines[0].ordered ? 'ol' : 'ul';
            var listHtml = '<' + rootTag + '>';
            var previousIndent = baseIndent;
            var activeTag = rootTag;
            listLines.forEach(function (item, index) {
              if (index === 0) {
                listHtml += '<li>' + inlineMd(item.text);
                return;
              }
              if (item.indent > previousIndent) {
                activeTag = item.ordered ? 'ol' : 'ul';
                listHtml += '<' + activeTag + '><li>' + inlineMd(item.text);
              } else if (item.indent < previousIndent) {
                listHtml += '</li></' + activeTag + '></li><li>' + inlineMd(item.text);
                activeTag = rootTag;
              } else {
                listHtml += '</li><li>' + inlineMd(item.text);
              }
              previousIndent = item.indent;
            });
            if (previousIndent > baseIndent) listHtml += '</li></' + activeTag + '>';
            listHtml += '</li></' + rootTag + '>';
            html.push(listHtml);
            continue;
          }

          var paragraph = [];
          while (i < lines.length && lines[i].trim()) {
            if (/^(#{1,4})\s+/.test(lines[i]) || /^---+$/.test(lines[i].trim()) || lines[i].trim().charAt(0) === '>') break;
            if (i + 1 < lines.length && lines[i].indexOf('|') !== -1 && isTableDivider(lines[i + 1])) break;
            if (/^(\s*)([-*]|\d+\.)\s+/.test(lines[i])) break;
            paragraph.push(lines[i].trim());
            i += 1;
          }
          var hadParagraph = paragraph.length > 0;
          closeParagraph(paragraph);
          if (!hadParagraph && i < lines.length && lines[i] === line) i += 1;
        }

        return { html: html.join('\n'), headings: headings };
      }

      var rendered = renderMarkdown(source);
      article.innerHTML = rendered.html;
      rendered.headings.forEach(function (heading) {
        if (heading.level === 1) return;
        var button = document.createElement('button');
        button.type = 'button';
        button.className = 'toc-item level-' + heading.level;
        button.textContent = heading.title;
        button.addEventListener('click', function () {
          var target = document.getElementById(heading.id);
          if (!target) return;
          content.scrollTo({ top: Math.max(0, target.offsetTop - 76), behavior: 'smooth' });
        });
        toc.appendChild(button);
      });

      var tocButtons = Array.prototype.slice.call(toc.querySelectorAll('.toc-item'));
      var observedHeadings = rendered.headings.map(function (heading) {
        return document.getElementById(heading.id);
      }).filter(Boolean);
      content.addEventListener('scroll', function () {
        var current = observedHeadings[0];
        observedHeadings.forEach(function (heading) {
          if (heading.offsetTop <= content.scrollTop + 120) current = heading;
        });
        tocButtons.forEach(function (button) {
          button.classList.toggle('active', current && button.textContent === current.textContent);
        });
      }, { passive: true });

      function isMobile() {
        return window.matchMedia('(max-width: 860px)').matches;
      }

      function updateToggleLabel() {
        if (isMobile()) {
          toggle.textContent = document.body.classList.contains('mobile-prd-open') ? '查看原型' : '查看 PRD';
        } else {
          toggle.textContent = panel.classList.contains('collapsed') ? '展开 PRD' : '收起 PRD';
        }
      }

      toggle.addEventListener('click', function () {
        if (isMobile()) {
          document.body.classList.toggle('mobile-prd-open');
        } else {
          panel.classList.toggle('collapsed');
          drag.style.display = panel.classList.contains('collapsed') ? 'none' : '';
        }
        updateToggleLabel();
      });

      window.addEventListener('resize', function () {
        if (!isMobile()) document.body.classList.remove('mobile-prd-open');
        updateToggleLabel();
      });
      updateToggleLabel();

      function panelBounds() {
        return { min: 360, max: Math.floor(window.innerWidth * .7) };
      }

      function setPanelWidth(width) {
        var bounds = panelBounds();
        var nextWidth = Math.max(bounds.min, Math.min(bounds.max, width));
        panel.style.width = nextWidth + 'px';
        drag.setAttribute('aria-valuemax', String(bounds.max));
        drag.setAttribute('aria-valuenow', String(Math.round(nextWidth)));
      }
      setPanelWidth(panel.offsetWidth);

      drag.addEventListener('keydown', function (event) {
        if (panel.classList.contains('collapsed')) return;
        if (event.key !== 'ArrowLeft' && event.key !== 'ArrowRight') return;
        event.preventDefault();
        setPanelWidth(panel.offsetWidth + (event.key === 'ArrowLeft' ? 24 : -24));
      });

      drag.addEventListener('pointerdown', function (event) {
        if (panel.classList.contains('collapsed')) return;
        event.preventDefault();
        var startX = event.clientX;
        var startWidth = panel.offsetWidth;
        var pointerId = event.pointerId;
        drag.classList.add('dragging');
        document.body.style.cursor = 'col-resize';
        document.body.style.userSelect = 'none';
        if (drag.setPointerCapture) drag.setPointerCapture(pointerId);

        function onMove(moveEvent) {
          var width = startWidth - (moveEvent.clientX - startX);
          setPanelWidth(width);
        }
        function onUp() {
          drag.classList.remove('dragging');
          document.body.style.cursor = '';
          document.body.style.userSelect = '';
          if (drag.hasPointerCapture && drag.hasPointerCapture(pointerId)) drag.releasePointerCapture(pointerId);
          drag.removeEventListener('pointermove', onMove);
          drag.removeEventListener('pointerup', onUp);
          drag.removeEventListener('pointercancel', onUp);
        }
        drag.addEventListener('pointermove', onMove);
        drag.addEventListener('pointerup', onUp);
        drag.addEventListener('pointercancel', onUp);
      });

      function renderChangelog() {
        var list = document.getElementById('changeList');
        list.innerHTML = changelogData.map(function (item) {
          return '<li><time>' + escapeHtml(item.time) + '</time><p>' + escapeHtml(item.desc) + '</p></li>';
        }).join('');
      }
      renderChangelog();

      document.getElementById('changeBtn').addEventListener('click', function () {
        changeMask.classList.add('open');
        document.getElementById('closeChange').focus();
      });
      document.getElementById('closeChange').addEventListener('click', function () {
        changeMask.classList.remove('open');
      });
      changeMask.addEventListener('click', function (event) {
        if (event.target === changeMask) changeMask.classList.remove('open');
      });
      document.addEventListener('keydown', function (event) {
        if (event.key === 'Escape') changeMask.classList.remove('open');
      });
    });
  </script>
