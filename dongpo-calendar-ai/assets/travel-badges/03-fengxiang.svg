<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512" role="img" aria-labelledby="title desc" style="--badge-wash:#dbe4e6">
  <title id="title">凤翔·关中喜雨</title>
  <desc id="desc">喜雨亭屋檐、斜雨与飞鸿</desc>
  <defs>
    <radialGradient id="paperWash" cx="35%" cy="28%" r="78%">
      <stop offset="0" stop-color="#fffaf0"/>
      <stop offset=".55" stop-color="#f6efe2"/>
      <stop offset="1" stop-color="#dbe4e6"/>
    </radialGradient>
    <filter id="paperGrain" x="-20%" y="-20%" width="140%" height="140%">
      <feTurbulence type="fractalNoise" baseFrequency=".72" numOctaves="3" seed="21" result="noise"/>
      <feColorMatrix in="noise" type="saturate" values="0" result="gray"/>
      <feComponentTransfer in="gray">
        <feFuncA type="table" tableValues="0 .065"/>
      </feComponentTransfer>
    </filter>
    <filter id="softLift" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="5" stdDeviation="5" flood-color="#3b2a1c" flood-opacity=".12"/>
    </filter>
    <clipPath id="medalClip"><circle cx="256" cy="256" r="222"/></clipPath>
  </defs>
  <g filter="url(#softLift)">
    <circle cx="256" cy="256" r="222" fill="url(#paperWash)" stroke="#4f6c7c" stroke-width="5"/>
    <circle cx="256" cy="256" r="207" fill="none" stroke="#4f6c7c" stroke-width="2.5" stroke-opacity=".5"/>
    <circle cx="256" cy="256" r="192" fill="#dbe4e6" fill-opacity=".28" stroke="#4f6c7c" stroke-width="2" stroke-opacity=".24" stroke-dasharray="5 7"/>
  </g>
  <g clip-path="url(#medalClip)" filter="url(#paperGrain)">
    <rect x="32" y="32" width="448" height="448" fill="#6d5b46"/>
  </g>
  <g color="#4f6c7c" transform="translate(112 108) scale(4.5)">
    <style>
      .line,.fine,.wash{stroke:currentColor;stroke-linecap:round;stroke-linejoin:round}
      .line{fill:none;stroke-width:2.7}
      .fine{fill:none;stroke-width:2.1}
      .wash{fill:var(--badge-wash);stroke-width:2.3}
    </style>
    
    <path class="wash" d="M14 47h37l-6-8H20Z"/>
    <path class="fine" d="M20 47V39m25 8v-8M11 51h44M14 19v4m11-8v4m28 2v4"/>
    <path class="line" d="M14 33c9-1 14-10 22-8 6 1 8 7 13 7 3 0 5-1 8-3-4 7-11 10-18 8-10-3-16 0-25-4Z"/>
  </g>
  <g fill="#4f6c7c" opacity=".6">
    <circle cx="256" cy="55" r="3"/>
    <circle cx="457" cy="256" r="3"/>
    <circle cx="55" cy="256" r="3"/>
  </g>
  <path d="M246 455h20" stroke="#b53b27" stroke-width="6" stroke-linecap="round"/>
</svg>
