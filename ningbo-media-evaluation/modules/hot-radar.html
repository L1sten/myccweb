 document.addEventListener('click',e=>{const item=e.target.closest('.radar-hot-item');if(item)open(item)});
 document.addEventListener('keydown',e=>{if((e.key==='Enter'||e.key===' ')&&e.target.matches('.radar-hot-item')){e.preventDefault();open(e.target)}});
 dialog.addEventListener('click',e=>{if(e.target===dialog)dialog.close()});
 dialog.querySelector('button').onclick=()=>dialog.close();
})();
